async function drawWatermark() {
  await ensureFontsLoaded();
  const w = design.watermark;
  const canvas = document.getElementById('wmCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const cx = 400, cy = 400;
  ctx.clearRect(0, 0, 800, 800);
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, 380, 0, Math.PI * 2);
  ctx.clip();
  const g = ctx.createRadialGradient(cx, cy, 100, cx, cy, 400);
  g.addColorStop(0, w.bgColor1 || '#1C2541');
  g.addColorStop(1, w.bgColor2 || '#0B132B');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 800, 800);
  if (w.img) {
    const iw = w.img.width * w.imgScale;
    const ih = w.img.height * w.imgScale;
    const ix = cx + w.imgX, iy = cy + w.imgY;
    const rot = (w.imgRotate ?? 0) * Math.PI / 180;
    if (rot !== 0) {
      ctx.translate(ix, iy);
      ctx.rotate(rot);
      ctx.translate(-ix, -iy);
    }
    ctx.drawImage(w.img, ix - iw/2, iy - ih/2, iw, ih);
  }
  // overlays behind text (still inside circle clip)
  (w.overlays || []).filter(o => o.layer === 'bottom').forEach(ov => drawOverlay(ctx, ov, 800, 800));
  ctx.restore();

  // Optional ring border around the circle
  if (w.ringEnabled) {
    const rw = w.ringWidth || 15;
    ctx.beginPath();
    ctx.arc(cx, cy, 380 - rw / 2, 0, Math.PI * 2);
    ctx.lineWidth = rw;
    ctx.strokeStyle = w.ringColor || '#D4AF37';
    ctx.stroke();
  }

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const tx of w.texts) {
    if (!tx.text.trim()) continue;
    ctx.save();
    const weight = tx.bold ? '900' : tx.weight;
    const style = tx.italic ? 'italic ' : '';
    ctx.font = `${style}${weight} ${tx.size}px ${tx.font}`;
    try { ctx.letterSpacing = (tx.letterSpacing ?? 0) + 'px'; } catch (e) {}

    const px = cx + (tx.x ?? 0);
    const py = cy + tx.y;
    const rot = (tx.rotate ?? 0) * Math.PI / 180;
    if (rot !== 0) {
      ctx.translate(px, py);
      ctx.rotate(rot);
      ctx.translate(-px, -py);
    }

    const lines = tx.text.split('\n');
    const lineHeight = tx.size + (tx.lineGap ?? 15);
    const startY = py - (lines.length - 1) * lineHeight / 2;
    const outlineW = tx.outlineWidth ?? 0;

    lines.forEach((ln, i) => {
      const ly = startY + i * lineHeight;
      // outline first (stroke behind fill, never shadowed)
      if (outlineW > 0) {
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;
        ctx.lineWidth = outlineW;
        ctx.strokeStyle = tx.outlineColor || '#000000';
        ctx.lineJoin = 'round';
        ctx.strokeText(ln, px, ly);
      }
      // fill (with shadow if enabled)
      if (tx.shadow) {
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 6;
        ctx.shadowOffsetX = 3;
        ctx.shadowOffsetY = 3;
      } else {
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;
      }
      ctx.fillStyle = tx.color;
      ctx.fillText(ln, px, ly);
    });

    try { ctx.letterSpacing = '0px'; } catch (e) {}
    ctx.restore();
  }

  // overlays in front of text — clipped to circle
  const topOvs = (w.overlays || []).filter(o => o.layer === 'top');
  if (topOvs.length > 0) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, 380, 0, Math.PI * 2);
    ctx.clip();
    topOvs.forEach(ov => drawOverlay(ctx, ov, 800, 800));
    ctx.restore();
  }
}

// === HELPERS ===
function fileToImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function ensureFontsLoaded() {
  if (!document.fonts) return;
  try {
    await document.fonts.ready;
    const jobs = [];
    FONTS.forEach(f => {
      jobs.push(document.fonts.load(`${f.weight} 48px ${f.value}`).catch(() => {}));
    });
    // also load italic variants for the toggle
    FONTS.forEach(f => {
      jobs.push(document.fonts.load(`italic ${f.weight} 48px ${f.value}`).catch(() => {}));
    });
    await Promise.all(jobs);
  } catch (e) {}
}

// 인쇄 / PDF 저장 — Blob URL로 인쇄용 HTML 페이지를 만들고
// <a target="_blank"> 트릭으로 새 탭에 띄움. 새 탭 안에서 자동 print() 호출.
// 확인됨: PC와 모바일 크롬 모두 작동.
function printAsPDF(opts) {
  const { titleHead, channelName, epLabel, epTitle, topic, outputLabel, body } = opts;
  const today = new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });

  // 탭 제목 = PDF 저장 시 파일명 힌트로 사용됨
  // 예: "[파고드림] EP.01 대본" 또는 "[파고드림] EP.01 인터뷰 대화"
  const tabTitle = [
    channelName ? `[${channelName}]` : '',
    epLabel || '',
    outputLabel || titleHead || ''
  ].filter(Boolean).join(' ').trim() || titleHead || outputLabel || '결과물';

  const metaRows = [];
  if (channelName) metaRows.push(`<tr><td><strong>채널</strong></td><td>${escText(channelName)}</td></tr>`);
  if (epLabel || epTitle) {
    const ep = [epLabel, epTitle].filter(Boolean).join(' — ');
    metaRows.push(`<tr><td><strong>에피소드</strong></td><td>${escText(ep)}</td></tr>`);
  }
  if (topic) metaRows.push(`<tr><td><strong>주제</strong></td><td>${escText(topic)}</td></tr>`);
  if (outputLabel) metaRows.push(`<tr><td><strong>결과물</strong></td><td>${escText(outputLabel)}</td></tr>`);
  metaRows.push(`<tr><td><strong>작성</strong></td><td>${today}</td></tr>`);

  const printHtml = `<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${escText(tabTitle)}</title>
<style>
  body { font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif; padding: 1.5cm; color: #1a1a1a; max-width: 800px; margin: 0 auto; line-height: 1.7; background: white; }
  .header { border-bottom: 2px solid #B85C38; padding-bottom: 0.4cm; margin-bottom: 0.6cm; }

  .brand { font-size: 9pt; color: #888; letter-spacing: 0.05em; }

  table.meta td { padding: 0.1cm 0.4cm 0.1cm 0; vertical-align: top; }
  table.meta td:first-child { color: #2A1810; width: 90px; }
  .body { font-size: 11pt; line-height: 1.9; color: #1a1a1a; white-space: pre-wrap; word-break: keep-all; }
  .footer { margin-top: 0.8cm; padding-top: 0.3cm; border-top: 1px solid #ccc; font-size: 9pt; color: #888; text-align: center; }
  @page { margin: 1cm; size: A4; }
  .print-hint { position: fixed; top: 0; left: 0; right: 0; background: #2A1810; color: #FAF5EA; padding: 0.8rem 1rem; text-align: center; font-size: 0.92rem; z-index: 1000; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
  .print-hint button { background: #B85C38; color: white; border: 0; padding: 0.4rem 1rem; border-radius: 0.4rem; cursor: pointer; font-weight: 700; margin-left: 0.6rem; font-size: 0.9rem; }
  @media print { .print-hint { display: none !important; } body { padding: 0; } }
  @media screen { body { padding-top: 4.5rem; } }
</style>
</head><body>
<div class="print-hint">
  💡 인쇄 미리보기가 안 뜨면 오른쪽 버튼을 눌러주세요.
  <button onclick="window.print()">📕 인쇄 / PDF 저장</button>
</div>
<div class="header">
  <div class="title">${escText(titleHead || outputLabel || '결과물')}</div>
  <div class="brand">나도 PD 있다 · PD 스튜디오 · 파고드림</div>
</div>
<table class="meta">${metaRows.join('')}</table>
<div class="body">${escText(body)}</div>
<div class="footer">🎙 파고드림 PD 스튜디오로 만들었어요</div>
<script>
  // 페이지 로드 후 자동으로 인쇄 대화창 띄움
  window.addEventListener('load', function() {
    setTimeout(function() { try { window.print(); } catch(e) {} }, 400);
  });
<\/script>
</body></html>`;

  try {
    const blob = new Blob([printHtml], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    // <a target="_blank"> 동적 클릭 트릭 — user gesture를 유지해서
    // iframe sandbox에서도 PC·모바일 모두 작동.
    const link = document.createElement('a');
    link.href = url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.style.display = 'none';
    document.body.appendChild(link);
    link.click();
    setTimeout(() => {
      try { document.body.removeChild(link); } catch (e) {}
      URL.revokeObjectURL(url);
    }, 60000);
    return true;
  } catch (e) {
    showToast('PDF 창을 열 수 없어요. txt 다운로드 후 메모장 등에서 인쇄해주세요.');
    return false;
  }
}

function downloadText(filename, text) {
  // 클로드 아티팩트 iframe sandbox 환경에서 `<a download>`가 막혀 부모 페이지를
  // 다시 다운로드시키는 버그가 있음. target="_blank"를 주면 부모 컨텍스트와 분리됨.
  // 또한 안드로이드 파일 뷰어가 UTF-8로 인식하도록 BOM(\uFEFF)을 앞에 붙임 (한글 깨짐 방지).
  try {
    const blob = new Blob(['\uFEFF' + text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = filename;
    link.href = url;
    link.target = '_blank';
    link.rel = 'noopener';
    link.style.display = 'none';
    document.body.appendChild(link);
    link.click();
    setTimeout(() => {
      try { document.body.removeChild(link); } catch (e) {}
      URL.revokeObjectURL(url);
    }, 500);
    return true;
  } catch (e) {
    return false;
  }
}

function downloadCanvas(canvasId, prefix, format) {

// 클립보드 복사 헬퍼 — iframe/모바일 환경에서 navigator.clipboard가 막힐 때를 대비한 폴백 포함
async function copyToClipboard(text) {
  // 1차: 최신 API 시도
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* 폴백으로 진행 */ }
  // 2차 폴백: 임시 textarea + execCommand('copy')
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.top = '0';
    ta.setAttribute('readonly', '');
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) {
    return false;
  }
}

// 공유용 URL을 얻는 순서:
// 1) 코드에 박힌 SHAREABLE_URL (가장 신뢰성 — 단축링크 등)
// 2) 자기 자신의 정상 URL (window.location.href)
// 3) 부모창 URL (same-origin이면 가능)
// 4) document.referrer 폴백
// 5) 다 실패하면 빈 문자열
function getShareableUrl() {
  // 1) 하드코딩 — 가장 우선
  if (typeof SHAREABLE_URL === 'string' && /^https?:\/\//i.test(SHAREABLE_URL)) {
    return SHAREABLE_URL;
  }
  // 2) 자기 URL
  const own = (typeof window !== 'undefined' && window.location && window.location.href) || '';
  if (/^https?:\/\//i.test(own)) return own;
  // 3) 부모창 (cross-origin이면 막힘 — try-catch)
  try {
    if (window.top && window.top !== window) {
      const topUrl = window.top.location.href;
      if (/^https?:\/\//i.test(topUrl)) return topUrl;
    }
  } catch (e) { /* cross-origin */ }
  // 4) referrer
  const ref = document.referrer || '';
  if (/^https?:\/\//i.test(ref)) return ref;
  // 5) 알 수 없음
  return '';
}

// === 시스템 공유 헬퍼 (Web Share API) ===
function canShareSystem() {
  return typeof navigator.share === 'function';
}
function canShareFiles(files) {
  return canShareSystem() && typeof navigator.canShare === 'function' && navigator.canShare({ files });
}
// 시스템 공유 호출 — 결과를 자세히 분류해서 반환
// 반환값: 'shared' | 'cancelled' | 'blocked' | 'unsupported' | 'failed'
async function shareSystem({ title, text, url, files }) {
  if (typeof navigator.share !== 'function') return 'unsupported';
  const payload = {};
  if (title) payload.title = title;
  if (text) payload.text = text;
  if (url) payload.url = url;
  if (files && files.length) payload.files = files;
  // 사전 체크 — canShare가 false면 차단된 환경
  if (typeof navigator.canShare === 'function') {
    try {
      if (!navigator.canShare(payload)) return 'blocked';
    } catch (e) { /* canShare가 없거나 에러면 그냥 시도 */ }
  }
  try {
    await navigator.share(payload);
    return 'shared';
  } catch (e) {
    const name = e && e.name ? e.name : '';
    if (name === 'AbortError') return 'cancelled';
    if (name === 'NotAllowedError' || name === 'SecurityError') return 'blocked';
    return 'failed';
  }
}

// 텍스트/URL 공유 — 분명한 결과 분기 후 필요 시 클립보드 폴백
// 반환값: 'shared' | 'cancelled' | 'copied' | 'blocked-copied' | 'failed'
async function shareOrCopy({ title, text, url }) {
  const result = await shareSystem({ title, text, url });
  if (result === 'shared') return 'shared';
  if (result === 'cancelled') return 'cancelled';
  // unsupported/blocked/failed → 클립보드 폴백
  const fallbackText = [text, url].filter(Boolean).join('\n');
  const copied = await copyToClipboard(fallbackText);
  if (!copied) return 'failed';
  return result === 'blocked' ? 'blocked-copied' : 'copied';
}

// 우측 상단 ⛶ 풀스크린 토글
// Claude artifact iframe 안에서 fullscreen API가 작동하면 → 한 번 탭으로 풀스크린 (Claude 헤더 가려짐)
// 환경상 작동 안 하면 → PWA 설치 안내로 fallback (PWA 설치하면 standalone 모드로 자동 풀스크린)
(function setupFullscreenButton() {
  const fsBtn = document.getElementById('fsBtn');
  if (!fsBtn) return;

  // 이미 PWA standalone 모드(설치된 앱으로 실행 중)면 fullscreen 버튼 자체를 숨김 (이미 풀스크린)
  const isStandalone = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
  if (isStandalone) {
    fsBtn.style.display = 'none';
    return;
  }

  // fullscreen 상태에 따라 아이콘 변경
  function syncIcon() {
    const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
    fsBtn.textContent = isFs ? '⛶' : '⛶';
    fsBtn.title = isFs ? '풀스크린 끄기' : '풀스크린';
    fsBtn.style.opacity = isFs ? '1' : '0.75';
    fsBtn.style.color = isFs ? 'var(--terra-deep)' : 'var(--soil-light)';
  }

  document.addEventListener('fullscreenchange', syncIcon);
  document.addEventListener('webkitfullscreenchange', syncIcon);

  fsBtn.onclick = async () => {
    const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
    try {
      if (isFs) {
        // 풀스크린 해제
        if (document.exitFullscreen) await document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      } else {
        // 풀스크린 진입 — iframe 안에서 작동 안 할 수 있음
        const el = document.documentElement;
        const reqFs = el.requestFullscreen || el.webkitRequestFullscreen;
        if (!reqFs) throw new Error('fullscreen api 미지원');
        await reqFs.call(el);
      }
    } catch (err) {
      // 풀스크린 실패 — 환경 한계. PWA 설치 안내로 fallback.
      showToast('이 환경에선 풀스크린이 안 돼요. PWA로 설치하면 완전 풀스크린으로 쓸 수 있어요!');

        <!-- 🚀 메인 액션 — anchor + target=_blank, 외부 크롬으로 이동 -->
        <a id="pwaExternalOpen" href="${INSTALL_URL}" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none;width:100%;background:linear-gradient(135deg, #FF6B35 0%, #C1521E 100%);color:white;border:0;padding:1rem;border-radius:0.7rem;font-weight:800;font-size:1rem;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(193,82,30,0.35);margin-bottom:0.8rem;box-sizing:border-box;">🚀 외부 크롬에서 자동 설치</a>
        <div style="font-size:0.7rem;color:var(--soil-light);text-align:center;line-height:1.55;margin-bottom:1.1rem;">
          "외부 링크 열기" 다이얼로그가 뜨면 <strong>"링크 열기"</strong>를 눌러주세요
        </div>

        <!-- 수동 방법 (접힘) -->
        <details style="background:rgba(245,181,0,0.06);border:1px solid rgba(245,181,0,0.2);border-radius:0.55rem;padding:0.45rem 0.75rem;">
          <summary style="cursor:pointer;font-size:0.78rem;font-weight:700;color:#7a5818;padding:0.15rem 0;list-style:none;">📖 또는 수동으로 설치하는 방법</summary>
          <div style="margin-top:0.6rem;display:flex;flex-direction:column;gap:0.4rem;">
            <div style="background:white;padding:0.6rem 0.75rem;border-radius:0.5rem;border:1px solid rgba(92,74,58,0.1);">
              <div style="font-size:0.82rem;font-weight:700;color:#2A1810;margin-bottom:0.15rem;">🍎 iOS Safari</div>
              <div style="font-size:0.74rem;color:#5C4A3A;line-height:1.5;">하단 <strong>공유 ⬆</strong> → "<strong>홈 화면에 추가</strong>"</div>
            </div>
            <div style="background:white;padding:0.6rem 0.75rem;border-radius:0.5rem;border:1px solid rgba(92,74,58,0.1);">
              <div style="font-size:0.82rem;font-weight:700;color:#2A1810;margin-bottom:0.15rem;">📱 안드로이드 크롬</div>
              <div style="font-size:0.74rem;color:#5C4A3A;line-height:1.5;">우측 상단 <strong>⋮</strong> → "<strong>홈 화면에 추가</strong>"</div>
            </div>
            <div style="background:white;padding:0.6rem 0.75rem;border-radius:0.5rem;border:1px solid rgba(92,74,58,0.1);">
              <div style="font-size:0.82rem;font-weight:700;color:#2A1810;margin-bottom:0.15rem;">💻 PC 크롬</div>
              <div style="font-size:0.74rem;color:#5C4A3A;line-height:1.5;">주소창 오른쪽 <strong>⊕</strong> → "<strong>설치</strong>"</div>
            </div>
          </div>
        </details>

        <button id="pwaModalClose" style="width:100%;margin-top:1rem;background:transparent;color:var(--soil-light, #5C4A3A);border:1px solid rgba(92,74,58,0.2);padding:0.6rem;border-radius:0.5rem;font-weight:600;font-size:0.84rem;cursor:pointer;font-family:inherit;">✕ 닫기</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);

  // 🚀 외부 크롬 이동 anchor — 사용자가 의도해서 누른 경우만 (설정 페이지에서 명시 클릭)
  document.getElementById('pwaExternalOpen').onclick = () => {
    setTimeout(() => { try { modal.remove(); } catch(_) {} }, 500);
  };

  document.getElementById('pwaModalClose').onclick = () => modal.remove();
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
}

// footer "📱 홈 화면 추가" 링크에 모달 연결
// ⚠ pwaHelpLink는 <span role="button">이므로 navigate 시도 없음 → 외부 링크 다이얼로그 트리거 0%
//    클릭 시 PWA 안내 모달만 표시.
(function setupPwaHelp() {
  const lnk = document.getElementById('pwaHelpLink');
  if (!lnk) return;
  lnk.onclick = () => showPwaHelpModal();
  lnk.onkeydown = (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showPwaHelpModal(); }
  };
})();

loadState().then(() => {
  render();
  // 카톡 등 앱 안 브라우저에서 들어왔으면, 사용자 혼란 줄이기 위해
  // 하단 배너 단계를 건너뛰고 곧장 안내 모달을 띄움.
  // 사용자가 모달의 "닫기"를 누르면 그 세션 동안 다시 뜨지 않음.
  if (isInAppBrowser()) {
    showInAppBrowserDetail();
  }
  if (!state.profile || !state.profile.onboarded) {
    showOnboarding();
  } else if (!state.onboarding.completed) {
    // 앱 소개는 봤지만 PD 캐릭터·창작자 정체성 설문이 아직 완료 안 됨 → 자동 진입
    state.stage = 'onboardSurvey';
    render();
  }

  // 🎯 외부 도메인(github 등)에서 호스팅된 경우 → Claude iframe 미리 로드
  // window.self === window.top: 최상위 윈도우 (iframe 안이 아님)
  // hostname이 claude.ai 아님: 외부 도메인
  // → 첫 AI 호출 전에 미리 iframe 로드해서 응답 빠르게
  try {
    const inIframe = window.self !== window.top;
    const isClaudeOrigin = location.hostname === 'claude.ai' || location.hostname.endsWith('.claude.ai');
    if (!inIframe && !isClaudeOrigin) {
      setTimeout(() => { try { ensureClaudeIframe(); } catch (_) {} }, 1500);
    }
  } catch (_) {}
});
</script>
</body>
</html>
