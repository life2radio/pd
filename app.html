// === 💭 PD가 도와줘요 — 미니 AI 인터뷰 ===
// 사용자가 단계에 답하기 어려워할 때, PD가 추가 질문으로 끌어내고 정리해줌
function showSurveyHelpModal(step) {
  // 도움 모드 초기화
  state.helpMode = {
    active: true,
    stepIdx: state.onboarding.currentStep,
    messages: [],
    loading: true,
    finalAnswer: '',
    showFinal: false,
  };
  renderHelpModal(step);
  // 첫 인사 + 첫 질문을 PD가 자동으로 시작
  callHelpAIContinue(step);
}

function renderHelpModal(step) {
  // 기존 모달 제거
  const exist = document.getElementById('pd-help-modal');
  if (exist) exist.remove();

  const hm = state.helpMode;
  const pdName = state.pdCharacter.name || 'PD';

  const messagesHtml = hm.messages.map(m => {
    if (m.role === 'assistant') {
      return `
        <div style="display:flex;gap:0.5rem;margin-bottom:0.8rem;">
          <div style="flex-shrink:0;width:1.8rem;height:1.8rem;border-radius:50%;background:linear-gradient(135deg, #C66A40 0%, #A04F2E 100%);color:white;display:flex;align-items:center;justify-content:center;font-size:0.9rem;">🎙</div>
          <div style="flex:1;min-width:0;background:white;border:1px solid var(--line);border-radius:0.6rem;padding:0.6rem 0.8rem;font-size:0.88rem;line-height:1.7;color:var(--ink);white-space:pre-wrap;word-break:keep-all;overflow-wrap:break-word;">${escText(m.content)}</div>
        </div>
      `;
    }
    return `
      <div style="display:flex;justify-content:flex-end;margin-bottom:0.8rem;">
        <div style="max-width:80%;background:rgba(184,92,56,0.1);border:1px solid rgba(184,92,56,0.2);border-radius:0.6rem;padding:0.55rem 0.8rem;font-size:0.88rem;line-height:1.7;color:var(--ink);white-space:pre-wrap;word-break:keep-all;overflow-wrap:break-word;">${escText(m.content)}</div>
      </div>
    `;
  }).join('');

  const loadingHtml = hm.loading ? `
    <div style="display:flex;gap:0.5rem;margin-bottom:0.8rem;">
      <div style="flex-shrink:0;width:1.8rem;height:1.8rem;border-radius:50%;background:linear-gradient(135deg, #C66A40 0%, #A04F2E 100%);color:white;display:flex;align-items:center;justify-content:center;font-size:0.9rem;">🎙</div>
      <div style="flex:1;min-width:0;background:white;border:1px solid var(--line);border-radius:0.6rem;padding:0.6rem 0.8rem;font-size:0.86rem;color:var(--soil-light);">⏳ ${pdName}가 생각 중...</div>
    </div>
  ` : '';

  // 메시지 영역 또는 정리 결과 영역
  let bodyContent = '';
  if (hm.showFinal && hm.finalAnswer) {
    bodyContent = `
      ${messagesHtml}
      ${loadingHtml}
      <div style="background:linear-gradient(135deg, rgba(255,107,53,0.08) 0%, rgba(245,181,0,0.08) 100%);border:2px solid rgba(255,107,53,0.3);border-radius:0.8rem;padding:0.9rem 1rem;margin-top:0.5rem;">
        <div style="font-size:0.78rem;font-weight:800;color:#c1521e;margin-bottom:0.45rem;">🎯 ${escText(pdName)}가 정리한 답안</div>
        <div style="font-size:0.92rem;color:var(--ink);line-height:1.75;white-space:pre-wrap;word-break:keep-all;">${escText(hm.finalAnswer)}</div>
      </div>
    `;
  } else {
    bodyContent = messagesHtml + loadingHtml;
  }

  // 입력 영역 (정리 모드 아닐 때만)
  const inputArea = hm.showFinal ? `
    <div style="display:flex;flex-direction:column;gap:0.4rem;">
      <button class="btn-primary" id="helpApply" style="margin:0;">✅ 이대로 적용하기</button>
      <button class="btn-secondary" id="helpKeepTalking" style="margin:0;">🔄 더 얘기해서 다시 정리</button>
      <button id="helpCancel" style="width:100%;background:transparent;color:var(--soil-light);border:0;padding:0.5rem;font-size:0.82rem;cursor:pointer;font-family:inherit;text-decoration:underline;">✕ 취소 (적용 안 함)</button>
    </div>
  ` : `
    <textarea id="helpUserInput" rows="2" placeholder="PD 질문에 편하게 답해주세요..." style="width:100%;border:1.5px solid var(--line);border-radius:0.5rem;padding:0.6rem 0.7rem;font-family:inherit;font-size:0.9rem;resize:vertical;background:white;color:var(--ink);" ${hm.loading ? 'disabled' : ''}></textarea>
    <div style="display:flex;gap:0.4rem;margin-top:0.5rem;">
      <button class="btn-primary" id="helpSend" style="margin:0;flex:2;" ${hm.loading ? 'disabled' : ''}>전송 →</button>
      <button class="btn-secondary" id="helpFinalize" style="margin:0;flex:1;background:rgba(184,92,56,0.1);color:var(--terra-deep);border:1px solid rgba(184,92,56,0.25);" ${hm.loading || hm.messages.length < 2 ? 'disabled' : ''}>✅ 정리해줘</button>
    </div>
    <button id="helpCancel" style="width:100%;background:transparent;color:var(--soil-light);border:0;padding:0.5rem;margin-top:0.4rem;font-size:0.78rem;cursor:pointer;font-family:inherit;text-decoration:underline;">✕ 취소 (적용 안 함)</button>
  `;

  const modal = document.createElement('div');
  modal.id = 'pd-help-modal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(20,15,10,0.7);z-index:99999;display:flex;align-items:flex-end;justify-content:center;padding:0;backdrop-filter:blur(4px);';
  modal.innerHTML = `
    <div style="background:#FAF5EA;border-radius:1rem 1rem 0 0;max-width:480px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(40,20,10,0.4);">
      <div style="padding:0.9rem 1rem;border-bottom:1px solid rgba(92,74,58,0.12);display:flex;align-items:center;gap:0.55rem;flex-shrink:0;">
        <div style="width:1.9rem;height:1.9rem;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg, #C66A40 0%, #A04F2E 100%);color:white;display:flex;align-items:center;justify-content:center;font-size:0.95rem;">🎙</div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:0.92rem;font-weight:800;color:var(--ink);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escText(pdName)} 와 함께 정리하기</div>
          <div style="font-size:0.72rem;color:var(--soil-light);line-height:1.4;margin-top:0.15rem;word-break:keep-all;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">${escText(step.question)}</div>
        </div>
        <button id="helpClose" aria-label="닫기" style="background:transparent;border:0;color:var(--soil-light);font-size:1.3rem;cursor:pointer;padding:0.3rem 0.45rem;line-height:1;flex-shrink:0;width:2rem;height:2rem;display:inline-flex;align-items:center;justify-content:center;">✕</button>
      </div>
      <div id="helpMessages" style="flex:1;overflow-y:auto;padding:0.9rem 1rem 0.5rem;min-height:200px;">
        ${bodyContent}
      </div>
      <div style="padding:0.7rem 1rem 1rem;border-top:1px solid rgba(92,74,58,0.08);flex-shrink:0;">
        ${inputArea}
      </div>
    </div>
  `;
  document.body.appendChild(modal);

  // 한글 IME 친화 속성 적용
  setupKoreanInputs();

  // 메시지 영역 항상 아래로 스크롤
  setTimeout(() => {
    const msgArea = document.getElementById('helpMessages');
    if (msgArea) msgArea.scrollTop = msgArea.scrollHeight;
  }, 50);

  // 핸들러
  const closeModal = () => {
    state.helpMode.active = false;
    modal.remove();
  };
  document.getElementById('helpClose').onclick = closeModal;
  document.getElementById('helpCancel').onclick = closeModal;

  if (hm.showFinal) {
    document.getElementById('helpApply').onclick = () => {
      applyHelpFinal(step);
      closeModal();
    };
    document.getElementById('helpKeepTalking').onclick = () => {
      state.helpMode.showFinal = false;
      state.helpMode.finalAnswer = '';
      // 마지막 어시스턴트 메시지(정리 답안)도 제거
      const lastIdx = state.helpMode.messages.length - 1;
      if (lastIdx >= 0 && state.helpMode.messages[lastIdx].role === 'assistant') {
        state.helpMode.messages.pop();
      }
      renderHelpModal(step);
    };
  } else {
    const sendBtn = document.getElementById('helpSend');
    const finalizeBtn = document.getElementById('helpFinalize');
    const input = document.getElementById('helpUserInput');

    if (sendBtn) sendBtn.onclick = () => {
      const text = (input.value || '').trim();
      if (!text) {
        showToast('답변을 입력해주세요');
        return;
      }
      state.helpMode.messages.push({ role: 'user', content: text });
      renderHelpModal(step);
      callHelpAIContinue(step);
    };

    if (finalizeBtn) finalizeBtn.onclick = () => {
      callHelpAIFinalize(step);
    };

    // Ctrl/Cmd + Enter 전송
    if (input) {
      input.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          sendBtn.click();
        }
      });
      input.focus();
    }
  }
}

// PD가 계속 대화 (질문 던지기) — 처음 진입 시에도 호출됨
async function callHelpAIContinue(step) {
  const pdName = state.pdCharacter.name || 'PD';
  const pdPersonality = state.pdCharacter.personality || '친근하고 따뜻한';
  const pdSpeechStyle = state.pdCharacter.speechStyle || '친근한 존댓말';

  const systemPrompt = `당신은 "${pdName}"이라는 PD입니다. 성격은 ${pdPersonality}이고, 말투는 ${pdSpeechStyle} 스타일이에요.

지금 사용자가 다음 질문에 답하기 어려워합니다:
"${step.question}"

당신의 역할:
- 한 번에 한 가지만 친근하게 물어보세요
- 사용자 답변을 듣고 자연스럽게 이어서 다음 질문을 던지세요
- 부담스럽지 않게, 편안하게 대화하세요
- 짧고 따뜻한 톤 (한국어 존댓말)
- 어떤 답이든 일단 긍정적으로 받아주고 더 풀어내주세요
- 마크다운 기호(*, #, -)나 이모지 과다 사용 금지
- 답변은 보통 2~4문장 정도로 짧게

지금까지의 대화를 보고 다음 한 마디(질문)를 던져주세요. 정리는 사용자가 "정리해줘" 버튼을 누르면 따로 요청할 거예요.`;

  state.helpMode.loading = true;
  renderHelpModal(step);

  try {
    // messages가 비어있으면 첫 시작 — 가상 user 시드 메시지 추가
    let msgsForAI = state.helpMode.messages.slice();
    if (msgsForAI.length === 0) {
      msgsForAI = [{ role: 'user', content: `[설문 시작] 이 질문에 답하기 어려워요. 도와주세요: "${step.question}"` }];
    }

    const reply = await callClaude(msgsForAI, systemPrompt);
    state.helpMode.messages.push({ role: 'assistant', content: reply });
    state.helpMode.loading = false;
    renderHelpModal(step);
  } catch (e) {
    state.helpMode.loading = false;
    showToast('PD 응답 실패 — ' + friendlyError(e));
    renderHelpModal(step);
  }
}

// PD가 정리해줌 — 대화 종합해서 답안 한 개로 정리
async function callHelpAIFinalize(step) {
  const pdName = state.pdCharacter.name || 'PD';

  const systemPrompt = `당신은 "${pdName}"이라는 PD입니다. 사용자와 다음 질문에 대해 대화를 나눴어요:
"${step.question}"

이제 사용자가 "정리해줘"라고 했어요. 지금까지 사용자가 한 말을 종합해서, 원래 질문에 대한 답을 사용자 본인이 쓴 것처럼 정리해주세요.

규칙:
- 1~3줄로 짧고 명확하게
- 사용자가 한 말의 핵심을 그대로 살려서
- 사용자가 그대로 입력 필드에 넣을 수 있게 (인사·이모지·설명 없이 답안만)
- "사용자는…" 같은 3인칭 X. 사용자 본인이 쓴 것처럼 (예: "내가 카페를 20년 운영했고…")
- 한국어 자연스러운 문장
- 마크다운·이모지·따옴표 없이 순수 텍스트만

지금 정리해주세요.`;

  state.helpMode.loading = true;
  renderHelpModal(step);

  try {
    // 사용자가 "정리해줘"를 직접 메시지로 추가
    const msgsForAI = state.helpMode.messages.concat([
      { role: 'user', content: '지금까지 얘기한 내용을 종합해서 원래 질문의 답으로 정리해주세요.' },
    ]);
    const reply = await callClaude(msgsForAI, systemPrompt);
    // 정리 답안 표시 — messages에는 추가 안 함 (별도 finalAnswer 영역에 표시)
    state.helpMode.finalAnswer = reply.trim();
    state.helpMode.showFinal = true;
    state.helpMode.loading = false;
    renderHelpModal(step);
  } catch (e) {
    state.helpMode.loading = false;
    showToast('정리 실패 — ' + friendlyError(e));
    renderHelpModal(step);
  }
}

// 정리 답안을 원 단계 입력 필드에 적용
function applyHelpFinal(step) {
  const ans = state.helpMode.finalAnswer.trim();
  if (!ans) return;

  if (step.type === 'freeform-only') {
    // 자유 입력에 채움
    setFieldValue(step.field, ans);
  } else if (step.type === 'cards-with-freeform') {
    // 카드 단계 — 첫 번째 group의 자유 입력에 답안 넣기 (카드 선택은 사용자 판단)
    const firstGroup = step.groups[0];
    setFieldValue(firstGroup.field, ans);
  }
  saveState();
  showToast('✅ 답안이 적용됐어요 — 필요하면 수정하셔도 됩니다');
  // 페이지 다시 렌더링해서 입력 반영
  render();
}

// === Phase D — AI 정리 + 메인 진입 ===
// 모든 답변을 종합해 PD가 따뜻한 인사문을 생성하고, 사용자 정보를 카드로 정리
async function renderOnboardSurveyFinal() {
  const pd = state.pdCharacter;
  const cp = state.creatorProfile;
  const pdName = pd.name || 'PD';
  const totalSteps = getSurveyTotalSteps();

  // 인사문이 아직 생성되지 않았다면 AI 호출 (1회만)
  if (!state.onboarding.finalGreeting) {
    // 일단 로딩 화면
    app.innerHTML = `

// AI에게 PD 인사문 생성 요청
async function callPdFinalGreeting() {
  const pd = state.pdCharacter;
  const cp = state.creatorProfile;
  const nick = (state.profile && state.profile.nickname) || '';
  const pdName = pd.name || 'PD';

  const systemPrompt = `당신은 "${pdName}"이라는 유튜브 PD입니다. 성격은 ${pd.personality || '친근한'}이고, 말투는 ${pd.speechStyle || '친근한 존댓말'} 스타일이며, ${pd.expertise || '시청자 심리에 강한'} 전문 강점을 가지고 있어요.

방금 사용자가 단계별 설문에 답하며 자신의 이야기를 풀어줬어요. 이제 그 이야기를 종합해서, 사용자에게 따뜻한 첫 인사문을 한 메시지로 작성해주세요.

[사용자가 답한 정보]
- 호칭: ${nick || '(없음)'}
- 유튜브 동기: ${cp.motivation || '(미입력)'}
- 강점·경험: ${cp.strengths || '(미입력)'}
- 타깃 시청자: ${cp.audience || '(미입력)'}
- 시청자 고민: ${cp.audienceConcerns || '(미입력)'}
- 시청자가 얻을 감정·변화: ${cp.desiredImpact || '(미입력)'}
- 1년 후 비전: ${cp.vision || '(미입력)'}
- 유지 동력: ${cp.sustainability || '(미입력)'}

[작성 규칙]
- 4~6문장, 따뜻하고 진솔한 어조
- 사용자가 답한 내용을 *구체적으로* 한두 가지 언급 (그래야 "이 PD가 진짜 나를 안다" 느낌)
- 사용자 강점을 인정해주고, 그 위에서 함께 채널을 만들자는 다짐
- 처음 만나는 동료에게 건네는 첫 인사처럼 자연스럽게
- 마크다운(*, #, -)·이모지·따옴표 없이 순수 한국어 문장만
- 답안만 출력 (인사 외 다른 말 X)`;

  const reply = await callClaude([
    { role: 'user', content: '이제 사용자에게 첫 인사를 건네주세요.' }
  ], systemPrompt);
  return reply.trim();
}

const TOTAL_PHASE_C_D_STEPS_PLACEHOLDER = 1; // Phase D 정리 (다음 차수에 추가)

function getSurveyTotalSteps() {
  // 1차에서는 SURVEY_STEPS.length 만, 다음 차수에 합쳐짐
  return SURVEY_STEPS.length + TOTAL_PHASE_C_D_STEPS_PLACEHOLDER;
}

function getFieldValue(path) {
  const [obj, key] = path.split('.');
  return state[obj] && state[obj][key] || '';
}

function setFieldValue(path, value) {
  const [obj, key] = path.split('.');
  if (!state[obj]) state[obj] = {};
  state[obj][key] = value;
}

function renderOnboardSurvey() {
  const idx = state.onboarding.currentStep || 0;
  // 모든 단계 완료 → Phase D 정리 화면
  if (idx >= SURVEY_STEPS.length) {
    return renderOnboardSurveyFinal();
  }
  const step = SURVEY_STEPS[idx];
  const totalSteps = getSurveyTotalSteps();
  const progressPct = Math.round(((idx + 1) / totalSteps) * 100);

  // 현재 값 미리 가져오기
  let cardSelections = {};
  if (step.type === 'cards-with-freeform') {
    step.groups.forEach(g => {
      cardSelections[g.field] = getFieldValue(g.field);
    });
  }
  const freeformValue = step.type === 'freeform-only' ? getFieldValue(step.field) : '';

  let bodyHtml = '';
  if (step.type === 'freeform-only') {
    if (step.multiline) {
      bodyHtml = `
        <textarea id="surveyFreeformInput" class="survey-freeform" rows="4" placeholder="${escAttr(step.placeholder || '')}">${escText(freeformValue)}</textarea>
      `;
    } else {
      bodyHtml = `
        <input type="text" id="surveyFreeformInput" class="survey-freeform" style="min-height:auto;padding:0.85rem;font-size:0.98rem;font-weight:600;" placeholder="${escAttr(step.placeholder || '')}" value="${escAttr(freeformValue)}">
      `;
    }
  } else if (step.type === 'cards-with-freeform') {
    bodyHtml = step.groups.map(g => {
      const currentValue = cardSelections[g.field] || '';
      const max = g.maxSelections || 1;
      // 현재 저장된 값을 ' · '로 split해서 카드와 매칭
      const valueParts = currentValue ? currentValue.split(' · ').map(s => s.trim()).filter(Boolean) : [];
      const cardTitles = g.cards.map(c => c.title);
      const matchedTitles = valueParts.filter(v => cardTitles.includes(v));
      const customValue = valueParts.filter(v => !cardTitles.includes(v)).join(' · ');
      const groupId = g.field.replace('.', '-');
      const countLabel = max > 1
        ? `<span style="font-size:0.72rem;font-weight:600;color:var(--soil-light);margin-left:0.5rem;" data-count-for="${escAttr(g.field)}">최대 ${max}개 · <span data-current-count="${escAttr(g.field)}">${matchedTitles.length}</span>/${max}</span>`
        : `<span style="font-size:0.72rem;font-weight:600;color:var(--soil-light);margin-left:0.5rem;">1개 선택</span>`;
      return `
        <div class="survey-group-label">${escText(g.label)}${countLabel}</div>
        <div class="choice-grid" data-field="${escAttr(g.field)}" data-max-selections="${max}">
          ${g.cards.map((c) => `
            <button type="button" class="choice-card${matchedTitles.includes(c.title) ? ' selected' : ''}" data-card-title="${escAttr(c.title)}">
              <span class="choice-card-icon">${c.icon}</span>
              <span class="choice-card-body">
                <div class="choice-card-title">${escText(c.title)}</div>
                <div class="choice-card-desc">${escText(c.desc)}</div>
              </span>
            </button>
          `).join('')}
        </div>
        <input type="text" id="custom-${escAttr(groupId)}" data-field="${escAttr(g.field)}" class="survey-freeform" style="min-height:auto;padding:0.55rem 0.75rem;font-size:0.86rem;" placeholder="직접 입력 (선택 — 카드와 함께 결합돼요)" value="${escAttr(customValue)}">
      `;
    }).join('');
  }

  app.innerHTML = `
    <div class="survey-page">
      <div class="survey-progress">
        <div class="survey-progress-bar"><div class="survey-progress-fill" style="width:${progressPct}%;"></div></div>
        <div class="survey-progress-text">${idx + 1} / ${totalSteps}</div>
      </div>

      <div>
        <span class="survey-phase-tag">${escText(step.phase)}</span>
      </div>
      <div class="survey-question">${escText(step.question)}</div>
      <div class="survey-hint">${step.hint}</div>

      ${bodyHtml}

      <button class="survey-help-link" id="surveyHelpBtn">💭 잘 모르겠어요 — PD가 도와줘요</button>

      ${step.optional ? '<div style="font-size:0.74rem;color:var(--soil-light);margin-top:0.5rem;line-height:1.55;">📝 이 단계는 선택 사항이에요. 비워두고 다음으로 진행하셔도 됩니다.</div>' : ''}

      <div class="survey-nav">
        ${idx > 0 ? '<button type="button" class="survey-back" id="surveyBack">← 이전</button>' : ''}
        <button type="button" class="btn-primary" id="surveyNext">${step.optional ? '다음 (또는 건너뛰기) →' : '다음 →'}</button>
      </div>
    </div>
  `;

  window.scrollTo({ top: 0, behavior: 'auto' });

  // 카드 클릭 — 토글 (max=1이면 단일 선택, max>1이면 복수 선택)
  app.querySelectorAll('.choice-card').forEach(card => {
    card.onclick = () => {
      const grid = card.closest('.choice-grid');
      const max = parseInt(grid.getAttribute('data-max-selections') || '1', 10);
      const field = grid.getAttribute('data-field');
      const isSelected = card.classList.contains('selected');

      if (isSelected) {
        // 해제
        card.classList.remove('selected');
      } else {
        const currentSelected = grid.querySelectorAll('.choice-card.selected');
        if (max === 1) {
          // 단일 선택: 다른 모든 카드 해제 후 이 카드 선택
          currentSelected.forEach(c => c.classList.remove('selected'));
          card.classList.add('selected');
        } else {
          // 복수 선택: max 초과면 막기
          if (currentSelected.length >= max) {
            showToast(`최대 ${max}개까지 선택할 수 있어요. 다른 걸 누르려면 기존 선택을 먼저 해제해주세요.`);
            return;
          }
          card.classList.add('selected');
        }
      }
      // 카운트 업데이트
      const countEl = app.querySelector(`[data-current-count="${field}"]`);
      if (countEl) {
        countEl.textContent = grid.querySelectorAll('.choice-card.selected').length;
      }
    };
  });

  // 직접 입력 변경 시 — 카드 선택은 유지 (둘 다 결합되므로)
  // (카드 클릭만으로도 결합 가능, 직접 입력은 추가만)

  // 💭 PD가 도와줘요 — 미니 AI 인터뷰 모달
  document.getElementById('surveyHelpBtn').onclick = () => {
    showSurveyHelpModal(step);
  };

  // 이전
  const backBtn = document.getElementById('surveyBack');
  if (backBtn) backBtn.onclick = () => {
    saveCurrentSurveyAnswers(step);
    state.onboarding.currentStep = Math.max(0, idx - 1);
    render();
  };

  // 다음
  document.getElementById('surveyNext').onclick = () => {
    const ok = saveCurrentSurveyAnswers(step);
    if (!ok && step.required) {
      showToast('⚠ 답해주셔야 다음으로 넘어갈 수 있어요');
      return;
    }
    state.onboarding.currentStep = idx + 1;
    render();
  };
}

// 현재 단계 입력값을 state에 저장
function saveCurrentSurveyAnswers(step) {
  if (step.type === 'freeform-only') {
    const input = document.getElementById('surveyFreeformInput');
    const val = (input && input.value || '').trim();
    if (!val && step.required) return false;
    setFieldValue(step.field, val);
    return !!val;
  } else if (step.type === 'cards-with-freeform') {
    let anyFilled = false;
    step.groups.forEach(g => {
      const grid = app.querySelector(`.choice-grid[data-field="${g.field}"]`);
      const selectedCards = grid ? Array.from(grid.querySelectorAll('.choice-card.selected')) : [];
      const customInput = app.querySelector(`input[data-field="${g.field}"]`);
      const customVal = customInput ? (customInput.value || '').trim() : '';
      // 카드 선택들 + 직접 입력을 ' · '로 결합
      const parts = [];
      selectedCards.forEach(c => parts.push(c.getAttribute('data-card-title')));
      if (customVal) parts.push(customVal);
      const finalVal = parts.join(' · ');
      if (finalVal) anyFilled = true;
      setFieldValue(g.field, finalVal);
    });
    if (!anyFilled && step.required) return false;
    return anyFilled;
  }
  return true;
}

    const btn = document.getElementById('setExport');

    const input = document.createElement('input');

    document.body.appendChild(input);
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) { input.remove(); return; }
      const reader = new FileReader();
      reader.onload = (ev) => {
        input.remove();
        let data;
        try {
          data = JSON.parse(ev.target.result);
        } catch (err) {
          showToast('파일을 읽을 수 없어요. 올바른 백업 파일인지 확인해주세요.');
          return;
        }
        if (!data || data._app !== 'PD스튜디오' || !Array.isArray(data.channels)) {
          showToast('이 앱의 백업 파일이 아니에요.');
          return;
        }
        showConfirm('백업 파일을 불러올까요?\n지금 이 브라우저에 있는 채널·일정·메모는 모두 백업 내용으로 덮어쓰여져요.', () => {
          state.channels = Array.isArray(data.channels) ? data.channels : [];
          state.events = Array.isArray(data.events) ? data.events : [];
          state.memos = Array.isArray(data.memos) ? data.memos : [];
          state.eventIdNext = data.eventIdNext || (state.events.reduce((m, x) => Math.max(m, x.id || 0), 0) + 1);
          state.memoIdNext = data.memoIdNext || (state.memos.reduce((m, x) => Math.max(m, x.id || 0), 0) + 1);
          if (data.profile) {
            state.profile = {
              nickname: data.profile.nickname || '',
              email: data.profile.email || '',
              onboarded: true,
              firstOutputDone: !!data.profile.firstOutputDone,
            };
          }
          if (data.voiceURI) voice.selectedURI = data.voiceURI;
          state.activeChannelId = null;
          state.editingChannelId = null;
          state.activeOutput = null;
          state.stage = 'dashboard';
          saveState();
          showToast('백업을 불러왔어요.');
          render();
        });
      };
      reader.onerror = () => {
        input.remove();
        showToast('파일을 읽는 중 오류가 났어요.');
      };
      reader.readAsText(file);
    };
    input.click();
  };

  // --- 도움말 ---
  document.getElementById('setNotice').onclick = () => { state.stage = 'notice'; render(); };
  document.getElementById('setIntro').onclick = () => { state.stage = 'intro'; render(); };
  document.getElementById('setFaq').onclick = () => { state.stage = 'faq'; render(); };
  document.getElementById('setChannel').onclick = () => window.open(CHANNEL_URL, '_blank');

  // 📱 홈 화면 추가 안내 모달
  const setPwaHelpBtn = document.getElementById('setPwaHelp');
  if (setPwaHelpBtn) setPwaHelpBtn.onclick = () => showPwaHelpModal();

  // 🔄 PD 캐릭터 다시 설정 — 단계별 설문 첫 단계부터 다시
  const setPdResetBtn = document.getElementById('setPdReset');
  if (setPdResetBtn) setPdResetBtn.onclick = () => {
    showConfirm('PD 캐릭터를 처음부터 다시 설정하시겠어요?\n\n현재 설정된 이름·성격·말투·강점이 모두 초기화되고, 단계별 설문으로 이동해요.', () => {
      state.pdCharacter = { name: '', personality: '', speechStyle: '', expertise: '' };
      state.onboarding = { completed: false, currentStep: 0 };
      saveState();
      state.stage = 'onboardSurvey';
      render();
    });
  };

  // 🔄 창작자 정체성 다시 설정
  const setCreatorResetBtn = document.getElementById('setCreatorReset');
  if (setCreatorResetBtn) setCreatorResetBtn.onclick = () => {
    showConfirm('창작자 정체성을 처음부터 다시 설정하시겠어요?\n\n현재 설정된 동기·강점·시청자 등이 모두 초기화돼요. PD 캐릭터(이름·성격 등)는 그대로 유지됩니다.', () => {
      state.creatorProfile = {
        motivation: '', strengths: '', audience: '', audienceConcerns: '',
        desiredImpact: '', vision: '', sustainability: '',
      };
      state.onboarding = { completed: false, currentStep: SURVEY_STEPS.findIndex(s => s.phase === '창작자로서의 나') };
      saveState();
      state.stage = 'onboardSurvey';
      render();
    });
  };

  // 📤 앱 공유 — landing의 공유 로직과 동일
  const setShareBtn = document.getElementById('setShareApp');
  if (setShareBtn) setShareBtn.onclick = async () => {
    const btn = document.getElementById('setShareApp');
    const realUrl = getShareableUrl();
    const shareText = `🎙 나도 PD 있다 · PD 스튜디오
1인 콘텐츠 창작자를 위한 무료 AI 도구

PD가 당신을 인터뷰하고,
그 답을 바탕으로 영상 한 편 분량의
모든 결과물을 한 번에 만들어드려요.

📝 글 결과물
인터뷰 · 대본 · 제목 · 쇼츠 · 더보기란

🎨 디자인
썸네일 · 배너 · 워터마크 편집 · 이미지 저장

💾 편의 기능
txt · PDF 저장 · 들어보기(TTS)
결과물 보관함 · 일정관리 · 메모

완전 무료 · 폰 홈 화면에 설치 가능

— 유튜브 채널 파고드림 제작`;
    if (!realUrl) {
      btn.textContent = '⚠️ 링크를 얻지 못했어요 — 주소창 복사로 공유해주세요';
      setTimeout(() => { btn.textContent = '📤 앱 공유하기'; }, 3500);
      return;
    }
    const result = await shareOrCopy({
      title: '나도 PD 있다 · PD 스튜디오',
      text: shareText,
      url: realUrl,
    });
    if (result === 'shared') {
      btn.textContent = '✓ 공유 완료 — 감사합니다!';
    } else if (result === 'cancelled') {
      return;
    } else if (result === 'blocked-copied') {
      btn.textContent = '공유창이 막혀서 링크만 복사됐어요 — 카톡 등에 붙여넣기';
    } else if (result === 'copied') {
      btn.textContent = '✓ 소개글·링크 복사됨 — 어디든 붙여넣으세요';
    } else {
      btn.textContent = '공유 실패 — 다시 시도해주세요';
    }
    setTimeout(() => { btn.textContent = '📤 앱 공유하기'; }, 3500);
  };

  // --- 초기화 ---
  document.getElementById('setReset').onclick = () => {
    showConfirm('정말 초기화할까요?\n채널·에피소드·인터뷰·결과물·일정·메모가 모두 사라지고 되돌릴 수 없어요. 먼저 백업을 권해요.', () => {
      state.channels = [];
      state.events = [];
      state.memos = [];
      state.eventIdNext = 1;
      state.memoIdNext = 1;
      state.activeChannelId = null;
      state.editingChannelId = null;
      state.activeOutput = null;
      state.stage = 'landing';
      saveState();
      showToast('작업 데이터가 초기화되었어요.');
      render();
    });
  };

  document.getElementById('setBack').onclick = () => { state.stage = 'landing'; render(); };
}

// === CHANNEL DASHBOARD ===
function renderDashboard() {
  const channels = state.channels;
  const nick = (state.profile && state.profile.nickname) ? state.profile.nickname : '';
  let cardsHtml;
  if (channels.length === 0) {
    cardsHtml = `
      <div style="text-align:center; padding:2.5rem 1rem; color:var(--soil-light); background:rgba(255,255,255,0.5); border:1px dashed rgba(92,74,58,0.25); border-radius:1rem; margin-bottom:0.8rem;">
        <div style="font-size:2.5rem; margin-bottom:0.5rem;">📺</div>
        <div style="font-size:0.95rem; font-weight:600; color:var(--soil); margin-bottom:0.3rem;">아직 채널이 없어요</div>
        <div style="font-size:0.82rem;">첫 채널을 만들어 PD 작업을 시작하세요.</div>
      </div>
    `;
  } else {
    cardsHtml = channels
      .slice()
      .sort((a, b) => b.updatedAt - a.updatedAt)
      .map(c => {
        const cat = channelCategoryLabel(c);
        const epCount = (c.episodes || []).length;
        const publishedCount = (c.episodes || []).filter(e => e.status === 'published').length;
        const updated = new Date(c.updatedAt);
        const dateStr = `${updated.getMonth()+1}/${updated.getDate()}`;
        return `
          <div class="output-card" data-channel-id="${c.id}" style="align-items:flex-start;">
            <div class="output-icon" style="background:${c.brandColor}22;">
              <span style="width:14px;height:14px;border-radius:50%;background:${c.brandColor};display:inline-block;"></span>
            </div>
            <div class="output-info">
              <div class="output-label">${escText(c.name)}</div>
              <div class="output-desc">
                <span style="display:inline-block;background:rgba(92,74,58,0.1);padding:0.1rem 0.45rem;border-radius:0.3rem;font-size:0.7rem;margin-right:0.3rem;">${escText(cat)}</span>
                ${c.tone ? escText(c.tone) : '톤 미설정'}
              </div>
              <div class="output-desc" style="margin-top:0.25rem;font-size:0.7rem;">
                에피소드 ${epCount}개 · 발행 ${publishedCount}개${c.uploadSchedule ? ' · ' + escText(c.uploadSchedule) : ''} · 최근 ${dateStr}
              </div>
            </div>
            <div class="channel-card-actions">
              <button class="btn-delete" data-edit-channel="${c.id}" style="background:rgba(92,74,58,0.1);color:var(--soil);">⚙ 수정</button>
              <button class="btn-delete" data-dup-channel="${c.id}" style="background:rgba(92,74,58,0.1);color:var(--soil);">📑 복제</button>
              <span class="output-status">열기 →</span>
            </div>
          </div>
        `;
      }).join('');
  }
  // today + important summary banner
  const tStr = todayYMD();
  const todayEvs = sortEvents(state.events.filter(e => e.date === tStr));
  const importantEvs = sortEvents(state.events.filter(e => e.important && !e.done && e.date >= tStr))
    .filter(e => e.date !== tStr)
    .slice(0, 3);
  let bannerHtml = '';
  if (todayEvs.length > 0 || importantEvs.length > 0) {
    let inner = '';
    if (todayEvs.length > 0) {
      inner += `<h3>🔔 오늘 (${tStr})</h3>` + todayEvs.map(e => eventRowHtml(e)).join('');
    }
    if (importantEvs.length > 0) {
      inner += `<h3 style="margin-top:${todayEvs.length ? '0.7rem' : '0'};">⭐ 중요 일정</h3>` + importantEvs.map(e => eventRowHtml(e, true)).join('');
    }
    bannerHtml = `<div class="today-banner">${inner}</div>`;
  }

  app.innerHTML = `
    <div class="breadcrumb">채널 대시보드</div>
    <h2>📺 ${nick ? escText(nick) + '님의 채널' : '내 채널'}</h2>
    ${bannerHtml}
    <div class="meta-line">채널을 선택하면 그 채널의 PD 작업 메뉴로 이동해요. 채널마다 인터뷰·대본·결과물이 따로 저장됩니다.</div>
    ${cardsHtml}
    <div class="divider"></div>
    <button class="btn-primary" id="newChannel">+ 새 채널 만들기</button>
    <button class="btn-work" id="openCalendar">📅 콘텐츠 캘린더 (업로드 일정·메모)</button>
    <button class="btn-secondary" id="backLanding">← 처음으로</button>
  `;
  document.querySelectorAll('[data-channel-id]').forEach(card => {
    card.onclick = () => {
      state.activeChannelId = card.dataset.channelId;
      state.stage = 'episodeList';
      state.activeOutput = null;
      render();
    };
  });
  document.querySelectorAll('[data-edit-channel]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      state.editingChannelId = btn.dataset.editChannel;
      state.stage = 'channelForm';
      render();
    };
  });
  document.querySelectorAll('[data-dup-channel]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const src = state.channels.find(c => c.id === btn.dataset.dupChannel);
      if (!src) return;
      showConfirm(`'${src.name}' 채널을 복제할까요?\n채널 설정(카테고리·톤·컬러·주기)만 복사되고, 인터뷰·결과물은 빈 상태로 새로 시작해요.`, () => {
        const dup = newChannel({
          name: src.name + ' (복사본)',
          category: src.category,
          categoryCustom: src.categoryCustom,
          tone: src.tone,
          topic: src.topic,
          brandColor: src.brandColor,
          uploadSchedule: src.uploadSchedule,
        });
        state.channels.push(dup);
        showToast('채널이 복제되었어요.');
        render();
      });
    };
  });
  document.getElementById('newChannel').onclick = () => {
    state.editingChannelId = null;
    state.stage = 'channelForm';
    render();
  };
  document.getElementById('openCalendar').onclick = () => {
    state.calReturn = 'dashboard';
    state.stage = 'calendar';
    render();
  };
  // today-banner event interactions
  document.querySelectorAll('[data-ev-check]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const id = parseInt(btn.dataset.evCheck);
      const ev = state.events.find(x => x.id === id);
      if (ev) { ev.done = !ev.done; render(); }
    };
  });
  document.querySelectorAll('[data-ev-del]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const id = parseInt(btn.dataset.evDel);
      state.events = state.events.filter(x => x.id !== id);
      render();
    };
  });
  document.querySelectorAll('[data-ev-edit]').forEach(row => {
    row.onclick = () => {
      const id = parseInt(row.dataset.evEdit);
      const ev = state.events.find(x => x.id === id);
      if (ev) showEventDialog(ev.date, ev);
    };
  });
  document.getElementById('backLanding').onclick = () => { state.stage = 'landing'; render(); };
}

// === CHANNEL CREATE / EDIT FORM ===
function renderChannelForm() {
  const editing = state.editingChannelId ? state.channels.find(c => c.id === state.editingChannelId) : null;
  const ch = editing || newChannel();
  const isEdit = !!editing;
  const catOptions = CATEGORIES.map(cat =>
    `<option value="${escAttr(cat)}"${ch.category === cat ? ' selected' : ''}>${escText(cat)}</option>`
  ).join('');
  const colorDots = CHANNEL_COLORS.map(col =>
    `<button type="button" class="color-dot" data-color="${col}" style="width:34px;height:34px;border-radius:50%;background:${col};border:${ch.brandColor === col ? '3px solid var(--ink)' : '2px solid rgba(0,0,0,0.1)'};cursor:pointer;padding:0;"></button>`
  ).join('');
  // ch.persona 구조 보장 (기존 채널에 persona 없으면 빈 객체) + 새 필드 보장
  if (!ch.persona) ch.persona = {};
  ['productionMode','visualStyle','aiVideoTool','voiceMethod','ttsService',
   'editingTool','subtitleStyle','characterConsistency','shootingEnv',
   'interviewFormat','notes'].forEach(k => {
    if (ch.persona[k] === undefined) ch.persona[k] = '';
  });
  const personaNotes = ch.persona.notes || '';
  // STEP 1 — productionMode 카드 매칭
  const styleTitles = VIDEO_STYLES.map(s => s.title);
  const matchedMode = ch.persona.productionMode;
  const matchedStyleIdx = matchedMode ? styleTitles.indexOf(matchedMode) : -1;

  const styleCardsHtml = VIDEO_STYLES.map((s, i) => `
    <button type="button" class="choice-card${matchedStyleIdx === i ? ' selected' : ''}" data-style-title="${escAttr(s.title)}">
      <span class="choice-card-icon">${s.icon}</span>
      <span class="choice-card-body">
        <div class="choice-card-title">${escText(s.title)}</div>
        <div class="choice-card-desc">${escText(s.desc)}</div>
      </span>
    </button>
  `).join('');

  // STEP 2 — 분기별 동적 필드 HTML 빌드
  // multi: true 필드는 ' · '로 결합 저장. 칩 선택은 *토글*로 동작.
  function buildBranchFieldsHtml(mode) {
    if (!mode || !PRODUCTION_BRANCHES[mode]) return '';
    const fields = PRODUCTION_BRANCHES[mode];
    return fields.map(field => {
      // 조건부 필드 — 이전 필드 값에 따라 표시
      if (field.condition && !field.condition(ch.persona)) return '';
      const rawVal = ch.persona[field.key] || '';
      const selectedValues = field.multi
        ? rawVal.split(' · ').map(s => s.trim()).filter(Boolean)
        : (rawVal ? [rawVal] : []);
      // 직접 입력 — 옵션에 없는 값 (multi면 여러 개일 수 있음)
      const customValues = selectedValues.filter(v => !field.options.includes(v));
      const customValue = customValues.join(' · ');
      const hasCustom = customValues.length > 0;

      const optionsHtml = field.options.map(opt => `
        <button type="button" class="pf-chip${selectedValues.includes(opt) ? ' selected' : ''}" data-field="${escAttr(field.key)}" data-value="${escAttr(opt)}" data-multi="${field.multi ? '1' : '0'}">${escText(opt)}</button>
      `).join('');
      const customHtml = field.allowCustom ? `
        <button type="button" class="pf-chip-custom${hasCustom ? ' selected' : ''}" data-field="${escAttr(field.key)}" data-multi="${field.multi ? '1' : '0'}">${hasCustom ? '✓ 직접 입력' : '+ 직접 입력'}</button>
      ` : '';
      const customInputHtml = field.allowCustom ? `
        <input type="text" class="pf-custom-input" data-custom-for="${escAttr(field.key)}" data-multi="${field.multi ? '1' : '0'}" placeholder="${field.multi ? '직접 입력 (여러 개면 · 으로 구분, 예: 항목A · 항목B)' : '직접 입력 (한 단어 또는 짧게)'}" value="${escAttr(customValue)}" style="display:${hasCustom ? 'block' : 'none'};">
      ` : '';
      return `
        <div class="pf-field" data-field-name="${escAttr(field.key)}">
          <div class="pf-field-label">${escText(field.label)}${field.multi ? ' <span style="font-size:0.65rem;font-weight:600;background:rgba(92,140,184,0.15);color:#2c5476;padding:0.1rem 0.4rem;border-radius:0.3rem;margin-left:0.25rem;letter-spacing:0;vertical-align:middle;">여러 개 가능</span>' : ''}</div>
          <div class="pf-field-hint">${escText(field.hint)}</div>
          <div class="pf-chip-row">
            ${optionsHtml}
            ${customHtml}
          </div>
          ${customInputHtml}
        </div>
      `;
    }).join('');
  }
  const branchFieldsHtml = buildBranchFieldsHtml(matchedMode);

  app.innerHTML = `
    <div class="breadcrumb">${isEdit ? '채널 수정' : '새 채널 만들기'}</div>
    <h2>${isEdit ? '⚙ 채널 수정' : '📺 새 채널 만들기'}</h2>
    <div class="meta-line">채널은 인터뷰·대본·결과물이 묶이는 단위예요. 시청자·페르소나를 정해두면 PD가 그 채널 색깔에 맞게 작업해요.</div>

    <label>채널 이름 *</label>
    <input type="text" id="cf-name" placeholder="채널 이름을 적어주세요" value="${escAttr(ch.name)}">

    <label>카테고리</label>
    <select id="cf-category">${catOptions}</select>
    <input type="text" id="cf-categoryCustom" placeholder="카테고리 직접 입력" value="${escAttr(ch.categoryCustom)}" style="display:${ch.category === '기타(직접입력)' ? 'block' : 'none'};margin-top:-0.4rem;">

    <div style="background:linear-gradient(135deg, rgba(255,107,53,0.06) 0%, rgba(245,181,0,0.06) 100%);border:1.5px solid rgba(255,107,53,0.28);border-radius:0.8rem;padding:0.95rem 1rem 1rem;margin:1rem 0;">
      <label style="display:flex;align-items:center;gap:0.35rem;margin:0 0 0.3rem;font-size:0.9rem;font-weight:800;color:#c1521e;">🎯 누구를 위한 채널인가요?</label>
      <div style="font-size:0.74rem;color:var(--soil);margin-bottom:0.55rem;line-height:1.6;">가장 중요한 정보예요. 시청자가 명확할수록 모든 결과물(소재·각도·대본·썸네일)이 정확해져요.</div>
      <input type="text" id="cf-audience" placeholder="예: 30~40대 직장인, 부모님 돌봄 고민하는 층" value="${escAttr(ch.audience || '')}">
    </div>

    <div class="design-section" style="background:linear-gradient(135deg, rgba(184,92,56,0.04) 0%, rgba(212,168,67,0.05) 100%);border:1px solid rgba(184,92,56,0.2);border-radius:0.8rem;padding:0.95rem 1rem 1.05rem;margin:1rem 0;">
      <div style="font-size:0.86rem;font-weight:800;color:var(--terra-deep);margin-bottom:0.3rem;display:flex;align-items:center;gap:0.35rem;">
        🎭 채널 페르소나
      </div>
      <div style="font-size:0.76rem;color:var(--soil);line-height:1.6;margin-bottom:0.9rem;">영상을 *어떻게* 만드는지의 정보예요. 한 번 정하면 모든 결과물(대본·썸네일 컨셉·영상 프롬프트…)에 일관되게 반영돼요.</div>

      <div style="display:flex;align-items:center;gap:0.4rem;margin-bottom:0.3rem;">
        <span style="font-size:0.7rem;font-weight:800;background:rgba(184,92,56,0.18);color:var(--terra-deep);padding:0.15rem 0.45rem;border-radius:0.35rem;letter-spacing:0.04em;">STEP 1</span>
        <label style="font-size:0.84rem;font-weight:700;color:var(--ink);margin:0;">영상 *제작 방식* (워크플로우)</label>
      </div>
      <div style="font-size:0.74rem;color:var(--soil-light);margin-bottom:0.5rem;line-height:1.55;">영상을 어떻게 *생산*할지의 분기예요. 하나 골라주세요. ※ 영상 *스타일*(실사풍·픽사풍·따뜻함 등)은 STEP 2에서 정해요.</div>
      <div class="choice-grid" id="cf-styleCards" data-field="persona.visualStyle" data-max-selections="1">${styleCardsHtml}</div>

      <div style="display:flex;align-items:center;gap:0.4rem;margin:0.95rem 0 0.3rem;">
        <span style="font-size:0.7rem;font-weight:800;background:rgba(184,92,56,0.18);color:var(--terra-deep);padding:0.15rem 0.45rem;border-radius:0.35rem;letter-spacing:0.04em;">STEP 2</span>
        <label style="font-size:0.84rem;font-weight:700;color:var(--ink);margin:0;">제작 방식에 맞는 세부 설정 (선택)</label>
      </div>
      <div id="cf-styleDetailHelper" style="font-size:0.74rem;color:var(--soil-light);margin-bottom:0.7rem;line-height:1.55;">${matchedMode ? '비워둬도 OK — 채워질수록 영상 프롬프트·대본·결과물이 정확해져요.' : '⚠ STEP 1 카드를 먼저 골라주시면 세부 항목이 나타나요.'}</div>
      <div id="cf-branchFields">${branchFieldsHtml}</div>

      <div style="display:flex;align-items:center;gap:0.4rem;margin:1.1rem 0 0.3rem;">
        <span style="font-size:0.7rem;font-weight:800;background:rgba(184,92,56,0.18);color:var(--terra-deep);padding:0.15rem 0.45rem;border-radius:0.35rem;letter-spacing:0.04em;">STEP 3</span>
        <label style="font-size:0.84rem;font-weight:700;color:var(--ink);margin:0;">분위기·세부 (자유 노트)</label>
      </div>
      <div style="font-size:0.74rem;color:var(--soil-light);margin-bottom:0.4rem;line-height:1.55;">시청자·톤·시그니처는 <strong>아래 별도 필드</strong>에 입력해주세요. 여기엔 그 외 분위기·세부 정보만 적어주세요. 비워둬도 OK.</div>
      <textarea id="cf-personaNotes" rows="3" class="survey-freeform" placeholder="예: 영상 끝에 명언 한 줄로 마무리. 가끔 특정 음악 시그니처 사용. 시청자에게 ○○라고 부름. 등 페르소나 관련 부가 정보" style="min-height:auto;">${escText(personaNotes)}</textarea>
    </div>

    <label>💬 채널 톤·말투 (선택)</label>
    <input type="text" id="cf-tone" placeholder="예: 차분하고 친근한 말투 / 정보 중심 차분한 톤" value="${escAttr(ch.tone)}">

    <label>✨ 시그니처·차별점 (선택)</label>
    <input type="text" id="cf-signature" placeholder="예: 검증된 연구 인용 + 본인 경험 결합 / 매 영상 한 줄 명언" value="${escAttr(ch.signature || '')}">

    <label>📌 기본 주제 (선택 — 작업마다 바꿀 수 있어요)</label>
    <input type="text" id="cf-topic" placeholder="이 채널에서 주로 다룰 핵심 주제" value="${escAttr(ch.topic)}">

    <label>📅 업로드 주기 (선택)</label>
    <input type="text" id="cf-schedule" placeholder="예: 매주 토요일 / 격주 화요일" value="${escAttr(ch.uploadSchedule)}">

    <label>🔁 자동 일정 생성 (선택)</label>
    <div style="background:rgba(184,92,56,0.05);border:1px solid rgba(184,92,56,0.18);border-radius:0.6rem;padding:0.7rem 0.85rem;margin-bottom:1rem;">
      <label style="display:flex;align-items:center;font-size:0.88rem;color:var(--ink);cursor:pointer;font-weight:600;margin-bottom:0.5rem;">
        <input type="checkbox" id="cf-recurring-enabled"${ch.recurringUpload && ch.recurringUpload.enabled ? ' checked' : ''} style="margin-right:0.5rem;width:18px;height:18px;accent-color:var(--terra);">
        매주 자동으로 업로드 일정을 캘린더에 등록
      </label>
      <div id="cf-recurring-detail" style="display:${ch.recurringUpload && ch.recurringUpload.enabled ? 'block' : 'none'};padding-left:1.6rem;">
        <div style="display:flex;align-items:center;gap:0.4rem;font-size:0.82rem;color:var(--soil);">
          <span>매주</span>
          <select id="cf-recurring-day" style="width:auto;min-width:0;flex:0 0 auto;padding:0.3rem 0.5rem;margin:0;font-size:0.85rem;">
            ${[0,1,2,3,4,5,6].map(d => `<option value="${d}"${(ch.recurringUpload && ch.recurringUpload.dayOfWeek === d) ? ' selected' : ''}>${['일','월','화','수','목','금','토'][d]}</option>`).join('')}
          </select>
          <span>요일에 12주 분량 생성</span>
        </div>
        <div style="font-size:0.72rem;color:var(--soil-light);margin-top:0.4rem;line-height:1.5;">꺼면 자동 생성된 일정만 제거돼요. 수동으로 등록한 일정은 그대로 유지돼요.</div>
      </div>
    </div>

    <label>🎨 브랜드 컬러</label>
    <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:1rem;" id="cf-colors">${colorDots}</div>

    <button class="btn-primary" id="cf-save">${isEdit ? '수정 완료' : '채널 만들기'}</button>
    ${isEdit ? `<button class="btn-secondary" id="cf-delete" style="color:var(--terra-deep);border-color:rgba(184,92,56,0.4);">🗑 이 채널 삭제</button>` : ''}
    <button class="btn-secondary" id="cf-cancel">← 취소</button>
  `;

  // === 채널 페르소나 — STEP 1 카드 토글 + STEP 2 분기별 필드 동적 표시 ===
  // STEP 1 카드 선택 시: ch.persona.productionMode 업데이트 → STEP 2 영역 다시 그림
  // 분기 바뀌면 이전 분기의 세부 필드 값은 그대로 유지 (재선택 시 자동 복원)

  // STEP 2 분기 필드 영역만 다시 그리는 헬퍼 (전체 폼 리렌더 X — 입력 포커스 유지)
  function rebuildBranchFields() {
    const container = document.getElementById('cf-branchFields');
    if (!container) return;
    container.innerHTML = buildBranchFieldsHtml(ch.persona.productionMode);
    bindBranchFieldHandlers();
    setupKoreanInputs();
  }

  // STEP 2 분기 필드 내부 핸들러 — 칩 선택, 직접 입력 토글
  // multi: true 필드는 ' · '로 결합된 문자열로 저장. 칩 클릭은 토글.
  function bindBranchFieldHandlers() {
    // 옵션 칩 클릭 — multi면 토글 (여러 개 누적), 아니면 단일 선택
    document.querySelectorAll('#cf-branchFields .pf-chip').forEach(btn => {
      btn.onclick = () => {
        const fieldKey = btn.dataset.field;
        const value = btn.dataset.value;
        const isMulti = btn.dataset.multi === '1';
        const wasSelected = btn.classList.contains('selected');

        if (isMulti) {
          // 다중: 토글. 직접 입력 값(있다면)은 보존.
          const curVals = (ch.persona[fieldKey] || '').split(' · ').map(s => s.trim()).filter(Boolean);
          if (wasSelected) {
            // 해제
            const idx = curVals.indexOf(value);
            if (idx >= 0) curVals.splice(idx, 1);
            btn.classList.remove('selected');
          } else {
            // 추가
            if (!curVals.includes(value)) curVals.push(value);
            btn.classList.add('selected');
          }
          ch.persona[fieldKey] = curVals.join(' · ');
        } else {
          // 단일: 같은 필드의 다른 칩 모두 해제 후 이 칩만 선택 (또는 토글로 해제)
          document.querySelectorAll(`#cf-branchFields .pf-chip[data-field="${fieldKey}"]`).forEach(b => b.classList.remove('selected'));
          document.querySelectorAll(`#cf-branchFields .pf-chip-custom[data-field="${fieldKey}"]`).forEach(b => {
            b.classList.remove('selected');
            b.textContent = '+ 직접 입력';
          });
          const customInput = document.querySelector(`#cf-branchFields .pf-custom-input[data-custom-for="${fieldKey}"]`);
          if (customInput) {
            customInput.style.display = 'none';
            customInput.value = '';
          }
          if (wasSelected) {
            ch.persona[fieldKey] = '';
          } else {
            btn.classList.add('selected');
            ch.persona[fieldKey] = value;
          }
        }
        // 조건부 필드 의존성이 있는 경우(예: voiceMethod → ttsService)만 rebuild
        const mode = ch.persona.productionMode;
        const branchFields = PRODUCTION_BRANCHES[mode] || [];
        const someFieldDependsOnThis = branchFields.some(f =>
          f.condition && f.condition.toString().includes(fieldKey)
        );
        if (someFieldDependsOnThis) {
          rebuildBranchFields();
        }
      };
    });
    // "+ 직접 입력" 버튼 — input 토글 (rebuild 안 함 — 포커스 보존)
    document.querySelectorAll('#cf-branchFields .pf-chip-custom').forEach(btn => {
      btn.onclick = () => {
        const fieldKey = btn.dataset.field;
        const isMulti = btn.dataset.multi === '1';
        const customInput = document.querySelector(`#cf-branchFields .pf-custom-input[data-custom-for="${fieldKey}"]`);
        const wasSelected = btn.classList.contains('selected');

        if (wasSelected) {
          // 해제: 직접 입력 부분만 제거
          btn.classList.remove('selected');
          btn.textContent = '+ 직접 입력';
          if (customInput) { customInput.style.display = 'none'; customInput.value = ''; }
          // 저장값에서 직접 입력 부분만 제거 (옵션 선택은 유지)
          if (isMulti) {
            const branchFields = PRODUCTION_BRANCHES[ch.persona.productionMode] || [];
            const field = branchFields.find(f => f.key === fieldKey);
            const opts = field ? field.options : [];
            const curVals = (ch.persona[fieldKey] || '').split(' · ').map(s => s.trim()).filter(Boolean);
            ch.persona[fieldKey] = curVals.filter(v => opts.includes(v)).join(' · ');
          } else {
            ch.persona[fieldKey] = '';
          }
        } else {
          // 활성화: 단일이면 옵션 칩 해제. multi면 그대로 두고 직접 입력 추가.
          if (!isMulti) {
            document.querySelectorAll(`#cf-branchFields .pf-chip[data-field="${fieldKey}"]`).forEach(b => b.classList.remove('selected'));
          }
          btn.classList.add('selected');
          btn.textContent = '✓ 직접 입력';
          if (customInput) {
            customInput.style.display = 'block';
            setTimeout(() => customInput.focus(), 30);
          }
        }
      };
    });
    // 직접 입력란 — 입력값을 ch.persona에 실시간 반영
    document.querySelectorAll('#cf-branchFields .pf-custom-input').forEach(input => {
      const update = () => {
        const fieldKey = input.dataset.customFor;
        const isMulti = input.dataset.multi === '1';
        const customRaw = (input.value || '').trim();
        if (isMulti) {
          // multi: 옵션 선택값 유지 + 직접 입력값(여러 개 가능) 추가
          const branchFields = PRODUCTION_BRANCHES[ch.persona.productionMode] || [];
          const field = branchFields.find(f => f.key === fieldKey);
          const opts = field ? field.options : [];
          const curVals = (ch.persona[fieldKey] || '').split(' · ').map(s => s.trim()).filter(Boolean);
          // 옵션에 해당하는 값만 보존
          const fromOptions = curVals.filter(v => opts.includes(v));
          const fromCustom = customRaw ? customRaw.split('·').map(s => s.trim()).filter(Boolean) : [];
          ch.persona[fieldKey] = [...fromOptions, ...fromCustom].join(' · ');
        } else {
          ch.persona[fieldKey] = customRaw;
        }
      };
      input.oninput = update;
      input.onblur = update;
    });
  }

  // STEP 1 카드 클릭
  app.querySelectorAll('#cf-styleCards .choice-card').forEach(card => {
    card.onclick = () => {
      const grid = card.closest('.choice-grid');
      const isSelected = card.classList.contains('selected');
      grid.querySelectorAll('.choice-card').forEach(c => c.classList.remove('selected'));
      const helperText = document.getElementById('cf-styleDetailHelper');
      if (!isSelected) {
        card.classList.add('selected');
        const title = card.getAttribute('data-style-title');
        ch.persona.productionMode = title;
        if (helperText) helperText.textContent = '비워둬도 OK — 채워질수록 영상 프롬프트·대본·결과물이 정확해져요.';
      } else {
        ch.persona.productionMode = '';
        if (helperText) helperText.textContent = '⚠ STEP 1 카드를 먼저 골라주시면 세부 항목이 나타나요.';
      }
      // STEP 2 분기 필드 다시 그림
      rebuildBranchFields();
    };
  });

  // 초기 STEP 2 필드 핸들러 바인딩 (productionMode가 이미 있는 경우)
  bindBranchFieldHandlers();

  let pickedColor = ch.brandColor;
  let pickedCategory = ch.category;

  document.getElementById('cf-category').onchange = (e) => {
    pickedCategory = e.target.value;
    document.getElementById('cf-categoryCustom').style.display =
      pickedCategory === '기타(직접입력)' ? 'block' : 'none';
  };
  document.querySelectorAll('.color-dot').forEach(dot => {
    dot.onclick = () => {
      pickedColor = dot.dataset.color;
      document.querySelectorAll('.color-dot').forEach(d => {
        d.style.border = d.dataset.color === pickedColor ? '3px solid var(--ink)' : '2px solid rgba(0,0,0,0.1)';
      });
    };
  });

  document.getElementById('cf-save').onclick = () => {
    const name = document.getElementById('cf-name').value.trim();
    if (!name) { showToast('채널 이름을 입력해주세요.'); return; }

    // 채널 페르소나는 STEP 1·2 핸들러에서 ch.persona에 실시간 반영됨
    // 직접 입력값(blur 안 된 경우)을 마지막으로 한 번 더 동기화
    document.querySelectorAll('#cf-branchFields .pf-custom-input').forEach(input => {
      const fieldKey = input.dataset.customFor;
      const isCustomActive = (input.style.display !== 'none') && (input.value || '').trim();
      if (isCustomActive) ch.persona[fieldKey] = (input.value || '').trim();
    });
    const finalNotes = (document.getElementById('cf-personaNotes').value || '').trim();
    ch.persona.notes = finalNotes;

    const fields = {
      name,
      category: pickedCategory,
      categoryCustom: document.getElementById('cf-categoryCustom').value.trim(),
      audience: document.getElementById('cf-audience').value.trim(),
      tone: document.getElementById('cf-tone').value.trim(),
      signature: document.getElementById('cf-signature').value.trim(),
      topic: document.getElementById('cf-topic').value.trim(),
      uploadSchedule: document.getElementById('cf-schedule').value.trim(),
      brandColor: pickedColor,
      persona: Object.assign({}, ch.persona),
      // 🔁 반복 일정 설정 수집
      recurringUpload: {
        enabled: document.getElementById('cf-recurring-enabled').checked,
        dayOfWeek: parseInt(document.getElementById('cf-recurring-day').value) || 6,
        weeksAhead: 12,
      },
      updatedAt: Date.now(),
    };
    if (isEdit) {
      Object.assign(editing, fields);
      // 🔁 동기화 — 기존 자동 일정 제거 후 새로 생성
      syncRecurringChannelEvents(editing);
      state.editingChannelId = null;
      state.stage = 'dashboard';
    } else {
      const created = newChannel(fields);
      state.channels.push(created);
      // 🔁 동기화 — 새 채널의 반복 일정 즉시 생성
      syncRecurringChannelEvents(created);
      state.activeChannelId = created.id;
      state.editingChannelId = null;
      state.stage = 'episodeList';
    }
    state.activeOutput = null;
    render();
  };

  // 🔁 반복 일정 토글 — 펼침/접힘
  const recurringCheckbox = document.getElementById('cf-recurring-enabled');
  const recurringDetail = document.getElementById('cf-recurring-detail');
  if (recurringCheckbox && recurringDetail) {
    recurringCheckbox.onchange = () => {
      recurringDetail.style.display = recurringCheckbox.checked ? 'block' : 'none';
    };
  }

  const delBtn = document.getElementById('cf-delete');
  if (delBtn) delBtn.onclick = () => {
    showConfirm(`'${ch.name}' 채널을 삭제할까요?\n이 채널의 인터뷰·대본·결과물이 모두 사라져요.\n캘린더에 연결된 일정·반복 일정도 함께 삭제돼요.`, () => {
      const deletedChId = state.editingChannelId;
      // 🔁 채널 연결 일정·반복 일정 모두 제거
      state.events = state.events.filter(e =>
        e.channelId !== deletedChId && e.recurringChannelId !== deletedChId
      );
      state.channels = state.channels.filter(c => c.id !== deletedChId);
      if (state.activeChannelId === deletedChId) state.activeChannelId = null;
      state.editingChannelId = null;
      state.stage = 'dashboard';
      render();
    });
  };

  document.getElementById('cf-cancel').onclick = () => {
    state.editingChannelId = null;
    state.stage = 'dashboard';
    render();
  };
}

// === EPISODE LIST ===
// 🏷 에피소드 상태 변경 미니 메뉴
function showStatusPicker(ep, anchorEl) {
  // 기존 picker 제거
  const existing = document.getElementById('pd-status-picker');
  if (existing) existing.remove();

  const ch = getActiveChannel();
  if (!ch) return;

  const rect = anchorEl.getBoundingClientRect();
  const picker = document.createElement('div');
  picker.id = 'pd-status-picker';
  picker.style.cssText = `position:fixed;top:${rect.bottom + 6}px;left:${Math.max(8, rect.left)}px;background:white;border:1px solid rgba(92,74,58,0.25);border-radius:0.6rem;box-shadow:0 8px 24px rgba(40,20,10,0.2);padding:0.3rem;z-index:9999;font-family:inherit;min-width:140px;`;

  picker.innerHTML = EPISODE_STATUSES.map(s => `
    <button type="button" data-status-key="${s.key}" style="display:block;width:100%;background:${ep.status === s.key ? 'rgba(184,92,56,0.1)' : 'transparent'};border:0;border-radius:0.35rem;padding:0.45rem 0.7rem;text-align:left;cursor:pointer;font-family:inherit;font-size:0.85rem;color:#2A1810;font-weight:${ep.status === s.key ? '700' : '500'};box-shadow:none;margin:0;transition:background 0.12s;">
      <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${s.color};margin-right:0.5rem;vertical-align:middle;"></span>${escText(s.label)}${ep.status === s.key ? ' ✓' : ''}
    </button>
  `).join('');

  document.body.appendChild(picker);

  // 핸들러
  picker.querySelectorAll('[data-status-key]').forEach(b => {
    b.onmouseover = () => { if (ep.status !== b.dataset.statusKey) b.style.background = 'rgba(184,92,56,0.06)'; };
    b.onmouseout = () => { if (ep.status !== b.dataset.statusKey) b.style.background = 'transparent'; };
    b.onclick = (e) => {
      e.stopPropagation();
      ep.status = b.dataset.statusKey;
      ep.updatedAt = Date.now();
      touchChannel(ch);
      picker.remove();
      const st = episodeStatusInfo(ep.status);
      showToast(`✓ 상태 변경: ${st.label}`);
      render();
    };
  });

  // 바깥 클릭 시 닫기
  setTimeout(() => {
    const closeOnOutside = (e) => {
      if (!picker.contains(e.target)) {
        picker.remove();
        document.removeEventListener('click', closeOnOutside);
      }
    };
    document.addEventListener('click', closeOnOutside);
  }, 10);
}

function renderEpisodeList() {
  const ch = getActiveChannel();
  if (!ch) { state.stage = 'dashboard'; render(); return; }
  if (!ch.episodes) ch.episodes = [];
  if (!Array.isArray(ch.corners)) ch.corners = [];

  // 에피소드를 cornerId로 그룹화
  // 그룹 순서: corners 배열 순서 → "분류 없음" 맨 아래
  const corners = ch.corners.slice().sort((a, b) => (a.order || 0) - (b.order || 0));
  const episodesByCorner = {};
  const uncorneredEpisodes = [];
  ch.episodes.forEach(ep => {
    if (ep.cornerId && corners.some(c => c.id === ep.cornerId)) {
      (episodesByCorner[ep.cornerId] = episodesByCorner[ep.cornerId] || []).push(ep);
    } else {
      uncorneredEpisodes.push(ep);
    }
  });
  // 각 그룹 안에서 에피소드를 epNumber 내림차순으로 정렬
  Object.keys(episodesByCorner).forEach(k => {
    episodesByCorner[k].sort((a, b) => (b.epNumber || 0) - (a.epNumber || 0));
  });
  uncorneredEpisodes.sort((a, b) => (b.epNumber || 0) - (a.epNumber || 0));

  // 단일 에피소드 카드 렌더링
  function renderEpCard(ep) {
    const st = episodeStatusInfo(ep.status);
    const answered = ep.messages.filter(m => m.role === 'user' && !m.hidden).length;
    const outCount = Object.keys(ep.outputs || {}).length;
    const epLabel = `EP.${String(ep.epNumber).padStart(2, '0')}`;
    return `
      <div class="output-card" data-episode-id="${ep.id}" style="align-items:flex-start;">
        <div class="output-icon" style="background:${st.color}22;color:${st.color};font-weight:700;font-size:0.7rem;">
          ${String(ep.epNumber).padStart(2, '0')}
        </div>
        <div class="output-info">
          <div class="output-label">${epLabel}${ep.title ? ' · ' + escText(ep.title) : ''}</div>
          <div class="output-desc">
            <button data-ep-status="${ep.id}" title="클릭해서 상태 변경" style="display:inline-block;width:auto;background:${st.color};color:white;padding:0.18rem 0.5rem;border-radius:0.3rem;font-size:0.68rem;font-weight:600;margin-right:0.3rem;border:0;cursor:pointer;font-family:inherit;box-shadow:none;">${st.label} ▾</button>
            ${ep.topic ? escText(ep.topic) : '주제 미설정'}
          </div>
          <div class="output-desc" style="margin-top:0.25rem;font-size:0.7rem;">
            인터뷰 ${answered}문답 · 결과물 ${outCount}개
          </div>
        </div>
        <div class="channel-card-actions">
          <button class="btn-delete" data-ep-edit="${ep.id}" title="에피소드 수정" style="background:rgba(92,140,184,0.12);color:#2c5476;">✏</button>
          <button class="btn-delete" data-ep-del="${ep.id}" title="에피소드 삭제" style="background:rgba(184,92,56,0.12);color:var(--terra-deep);">🗑</button>
          <span class="output-status">열기 →</span>
        </div>
      </div>
    `;
  }

  // 코너 섹션 렌더링 (접기/펼침 토글)
  function renderCornerSection(corner, episodes) {
    const collapsed = corner.collapsed === true;
    const epsHtml = collapsed ? '' : (episodes.length === 0
      ? `<div style="text-align:center;padding:1.2rem 1rem;color:var(--soil-light);font-size:0.8rem;background:rgba(255,255,255,0.4);border:1px dashed rgba(92,74,58,0.18);border-radius:0.55rem;margin:0.3rem 0 0.5rem;">이 코너에 아직 에피소드가 없어요</div>`
      : episodes.map(renderEpCard).join(''));
    return `
      <div style="margin-bottom:0.9rem;">
        <div class="corner-header" data-corner-id="${corner.id}" style="display:flex;align-items:center;gap:0.5rem;background:linear-gradient(135deg, rgba(184,92,56,0.07) 0%, rgba(212,168,67,0.07) 100%);border:1px solid rgba(184,92,56,0.22);border-radius:0.55rem;padding:0.55rem 0.75rem;cursor:pointer;user-select:none;margin-bottom:0.45rem;">
          <span style="font-size:1.05rem;flex-shrink:0;">${escText(corner.icon || '📌')}</span>
          <span style="flex:1;min-width:0;font-size:0.92rem;font-weight:800;color:var(--terra-deep);line-height:1.3;word-break:keep-all;">${escText(corner.name)}</span>
          <span style="flex-shrink:0;font-size:0.72rem;font-weight:700;color:var(--soil);background:rgba(184,92,56,0.12);padding:0.15rem 0.5rem;border-radius:0.3rem;">${episodes.length}</span>
          <span style="flex-shrink:0;font-size:0.85rem;color:var(--soil-light);transition:transform 0.2s ease;${collapsed ? '' : 'transform:rotate(90deg);'}">▶</span>
        </div>
        ${epsHtml}
      </div>
    `;
  }

  // 전체 리스트 HTML
  let listHtml = '';
  if (ch.episodes.length === 0 && corners.length === 0) {
    listHtml = `
      <div style="text-align:center; padding:2.5rem 1rem; color:var(--soil-light); background:rgba(255,255,255,0.5); border:1px dashed rgba(92,74,58,0.25); border-radius:1rem; margin-bottom:0.8rem;">
        <div style="font-size:2.5rem; margin-bottom:0.5rem;">🎬</div>
        <div style="font-size:0.95rem; font-weight:600; color:var(--soil); margin-bottom:0.3rem;">아직 에피소드가 없어요</div>
        <div style="font-size:0.82rem;">첫 에피소드를 만들어 인터뷰·대본 작업을 시작하세요.</div>
      </div>
    `;
  } else {
    // 코너별 섹션
    corners.forEach(corner => {
      listHtml += renderCornerSection(corner, episodesByCorner[corner.id] || []);
    });
    // 분류 없음 섹션
    if (uncorneredEpisodes.length > 0) {
      const fakeCorner = { id: '__uncornered__', icon: '📋', name: '분류 없음', collapsed: state.uncorneredCollapsed === true };
      listHtml += renderCornerSection(fakeCorner, uncorneredEpisodes);
    }
  }

  app.innerHTML = `
    <div class="breadcrumb">${escText(ch.name)} · 에피소드</div>
    <h2>🎬 에피소드 목록</h2>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem;background:rgba(184,92,56,0.05);border:1px solid rgba(184,92,56,0.15);border-radius:0.55rem;padding:0.5rem 0.75rem;margin-bottom:0.85rem;">
      <span style="font-size:0.82rem;color:var(--ink);min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
        <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${ch.brandColor};margin-right:0.4rem;vertical-align:middle;"></span>
        ${escText(ch.name)} · ${escText(channelCategoryLabel(ch))}${ch.uploadSchedule ? ' · ' + escText(ch.uploadSchedule) : ''}
      </span>
      <span role="button" tabindex="0" id="cornerMgrLink" style="flex-shrink:0;font-size:0.75rem;color:var(--terra-deep);text-decoration:underline;cursor:pointer;font-weight:700;white-space:nowrap;">🎙 코너 관리${corners.length > 0 ? ` (${corners.length})` : ''}</span>
    </div>
    ${listHtml}
    <div class="divider"></div>

    <!-- 1순위: 메인 액션 — 새 에피소드 만들기 -->
    <button class="btn-primary" id="newEpisode">+ 새 에피소드 만들기</button>

    <!-- 2순위: 발굴·회의 묶음 카드 (강조) -->
    <div style="margin-top:1.2rem;">
      <div style="display:flex;align-items:center;gap:0.4rem;margin-bottom:0.5rem;padding:0 0.25rem;">
        <span style="font-size:1rem;">✨</span>
        <span style="font-size:0.85rem;font-weight:700;color:var(--ink);">아이디어가 안 떠오를 땐</span>
      </div>
      <div style="background:linear-gradient(135deg, rgba(255,107,53,0.08) 0%, rgba(245,181,0,0.08) 100%);border:1px solid rgba(255,107,53,0.28);border-radius:0.8rem;overflow:hidden;">
        <button id="sourceFinderBtn" style="display:block;width:100%;background:transparent;border:0;border-bottom:1px solid rgba(184,92,56,0.15);padding:0.85rem 0.95rem;text-align:left;cursor:pointer;font-family:inherit;color:inherit;transition:background 0.15s;" onmouseover="this.style.background='rgba(255,107,53,0.06)'" onmouseout="this.style.background='transparent'">
          <div style="font-size:0.92rem;font-weight:700;color:#2A1810;margin-bottom:0.15rem;">🔥 터질 소재 찾기</div>
          <div style="font-size:0.74rem;color:var(--soil);line-height:1.45;">알고리즘 잘 타는 주제·각도 자동 발굴</div>
        </button>
        <button id="brainstormBtn" style="display:block;width:100%;background:transparent;border:0;padding:0.85rem 0.95rem;text-align:left;cursor:pointer;font-family:inherit;color:inherit;transition:background 0.15s;" onmouseover="this.style.background='rgba(255,107,53,0.06)'" onmouseout="this.style.background='transparent'">
          <div style="font-size:0.92rem;font-weight:700;color:#2A1810;margin-bottom:0.15rem;">💡 PD와 브레인스토밍 회의</div>
          <div style="font-size:0.74rem;color:var(--soil);line-height:1.45;">막막할 때 PD와 대화로 풀어가기</div>
        </button>
      </div>
    </div>

    <!-- 3순위: 결과물 보관함 (보조) -->
    <button class="btn-secondary" id="archiveBtn" style="margin-top:1.2rem;background:rgba(184,92,56,0.04);border:1px solid rgba(92,74,58,0.18);color:var(--soil);">📚 결과물 보관함 (전체 ${(ch.episodes||[]).reduce((s,e)=>s+Object.keys(e.outputs||{}).filter(k=>e.outputs[k]).length,0)}개)</button>

    <!-- 4순위: 네비게이션 (가장 낮음) -->
    <button class="btn-secondary" id="epListBack" style="margin-top:0.3rem;background:transparent;border:1px solid rgba(92,74,58,0.18);color:var(--soil-light);">← 채널 대시보드로</button>
  `;

  // 에피소드 카드 클릭
  document.querySelectorAll('[data-episode-id]').forEach(card => {
    card.onclick = () => {
      ch.activeEpisodeId = card.dataset.episodeId;
      state.stage = 'menu';
      state.activeOutput = null;
      render();
    };
  });
  document.querySelectorAll('[data-ep-del]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const epId = btn.dataset.epDel;
      const ep = ch.episodes.find(x => x.id === epId);
      if (!ep) return;
      showConfirm(`EP.${String(ep.epNumber).padStart(2, '0')}을(를) 삭제할까요?\n이 에피소드의 인터뷰·대본·결과물이 모두 사라져요.\n캘린더에 연결된 일정도 함께 삭제돼요.`, () => {
        ch.episodes = ch.episodes.filter(x => x.id !== epId);
        if (ch.activeEpisodeId === epId) ch.activeEpisodeId = null;
        // 📅 연결 일정 정리
        removeEpisodeLinkedEvents(epId);
        touchChannel(ch);
        render();
      });
    };
  });
  // ✏ 수정 아이콘 — showEpisodeDialog로 진입
  document.querySelectorAll('[data-ep-edit]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const epId = btn.dataset.epEdit;
      const ep = ch.episodes.find(x => x.id === epId);
      if (!ep) return;
      showEpisodeDialog(ch, ep);
    };
  });
  // 🏷 상태 배지 클릭 — 미니 메뉴로 즉시 변경
  document.querySelectorAll('[data-ep-status]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const epId = btn.dataset.epStatus;
      const ep = ch.episodes.find(x => x.id === epId);
      if (!ep) return;
      showStatusPicker(ep, btn);
    };
  });
  document.getElementById('newEpisode').onclick = () => {
    showEpisodeDialog(ch);
  };
  // 코너 헤더 클릭 — 접기/펼침 토글
  document.querySelectorAll('.corner-header').forEach(header => {
    header.onclick = () => {
      const cid = header.dataset.cornerId;
      if (cid === '__uncornered__') {
        state.uncorneredCollapsed = !state.uncorneredCollapsed;
      } else {
        const corner = ch.corners.find(c => c.id === cid);
        if (corner) corner.collapsed = !corner.collapsed;
        touchChannel(ch);
        saveState();
      }
      render();
    };
  });
  // 코너 관리 페이지 진입 (헤더 옆 작은 링크 — span role=button)
  const cornerMgrLink = document.getElementById('cornerMgrLink');
  if (cornerMgrLink) {
    const goCornerMgr = () => { state.stage = 'cornerManager'; render(); };
    cornerMgrLink.onclick = goCornerMgr;
    cornerMgrLink.onkeydown = (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goCornerMgr(); }
    };
  }
  document.getElementById('brainstormBtn').onclick = () => {
    state.stage = 'brainstorm';
    render();
  };
  const sfBtn = document.getElementById('sourceFinderBtn');
  if (sfBtn) sfBtn.onclick = () => {
    state.stage = 'sourceFinder';
    render();
  };
  document.getElementById('archiveBtn').onclick = () => {
    // 보관함 진입 — 필터 초기화
    state.archive.searchTerm = '';
    state.archive.filterType = '';
    state.archive.filterEpId = '';
    state.archive.filterDate = 'all';
    state.archive.sort = 'newest';
    state.stage = 'archive';
    render();
  };
  document.getElementById('epListBack').onclick = () => {
    state.stage = 'dashboard';
    state.activeChannelId = null;
    render();
  };
}

// === 🎙 코너 관리 페이지 ===
// 코너 추가/이름·아이콘 변경/순서 조정/삭제
function renderCornerManager() {
  const ch = getActiveChannel();
  if (!ch) { state.stage = 'dashboard'; render(); return; }
  if (!Array.isArray(ch.corners)) ch.corners = [];
  const corners = ch.corners.slice().sort((a, b) => (a.order || 0) - (b.order || 0));

  // 각 코너에 속한 에피소드 개수
  const epCount = {};
  let uncorneredCount = 0;
  (ch.episodes || []).forEach(ep => {
    if (ep.cornerId && corners.some(c => c.id === ep.cornerId)) {
      epCount[ep.cornerId] = (epCount[ep.cornerId] || 0) + 1;
    } else {
      uncorneredCount++;
    }
  });

  const cornersHtml = corners.length === 0 ? `
    <div style="text-align:center;padding:2rem 1rem;color:var(--soil-light);background:rgba(255,255,255,0.5);border:1px dashed rgba(92,74,58,0.25);border-radius:0.9rem;margin-bottom:0.7rem;">
      <div style="font-size:2rem;margin-bottom:0.45rem;">🎙</div>
      <div style="font-size:0.9rem;font-weight:600;color:var(--soil);margin-bottom:0.3rem;">아직 코너가 없어요</div>
      <div style="font-size:0.78rem;line-height:1.6;">코너는 에피소드를 묶는 그룹이에요.<br>예: "알PD와 함께", "아이들과 함께", "바이브코딩하는 드림"</div>
    </div>
  ` : corners.map((c, i) => `
    <div style="background:white;border:1px solid rgba(184,92,56,0.22);border-radius:0.75rem;padding:0.85rem 0.95rem;margin-bottom:0.55rem;">
      <div style="display:flex;align-items:center;gap:0.55rem;margin-bottom:0.55rem;">
        <span style="font-size:1.2rem;flex-shrink:0;">${escText(c.icon || '📌')}</span>
        <div style="flex:1;min-width:0;">
          <div style="font-size:0.96rem;font-weight:800;color:var(--ink);line-height:1.3;word-break:keep-all;">${escText(c.name)}</div>
          <div style="font-size:0.72rem;color:var(--soil-light);margin-top:0.15rem;">에피소드 ${epCount[c.id] || 0}개</div>
        </div>
      </div>
      <div style="display:flex;gap:0.4rem;flex-wrap:wrap;">
        <button class="btn-tiny" data-corner-edit="${c.id}" style="background:rgba(184,92,56,0.1);color:var(--terra-deep);border:1px solid rgba(184,92,56,0.22);">✏️ 이름·아이콘</button>
        ${i > 0 ? `<button class="btn-tiny" data-corner-up="${c.id}">↑ 위로</button>` : ''}
        ${i < corners.length - 1 ? `<button class="btn-tiny" data-corner-down="${c.id}">↓ 아래로</button>` : ''}
        <button class="btn-tiny" data-corner-del="${c.id}" style="background:rgba(220,80,80,0.1);color:#a04040;border:1px solid rgba(220,80,80,0.25);">🗑 삭제</button>
      </div>
    </div>
  `).join('');

  app.innerHTML = `
    <div class="breadcrumb">${escText(ch.name)} · 에피소드 · 코너 관리</div>
    <h2>🎙 코너 관리</h2>
    <div class="meta-line">
      <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${ch.brandColor};margin-right:0.35rem;vertical-align:middle;"></span>
      ${escText(ch.name)} · 코너 ${corners.length}개 · 분류 없음 에피소드 ${uncorneredCount}개
    </div>

    <div style="background:linear-gradient(135deg, rgba(184,92,56,0.05) 0%, rgba(212,168,67,0.05) 100%);border:1px solid rgba(184,92,56,0.2);border-radius:0.8rem;padding:0.8rem 0.95rem;margin-bottom:0.9rem;font-size:0.78rem;color:var(--soil);line-height:1.7;">
      💡 코너는 에피소드를 묶는 그룹이에요. 한 채널 안에서 여러 시리즈·콘텐츠 라인을 운영할 때 활용하세요.<br>
      예: 파고드림 채널 → <strong>알PD와 함께</strong>, <strong>아이들과 함께</strong>, <strong>바이브코딩하는 드림</strong>
    </div>

    ${cornersHtml}

    <button class="btn-primary" id="newCornerBtn" style="margin-top:0.5rem;">+ 새 코너 만들기</button>
    <button class="btn-secondary" id="cornerMgrBack" style="margin-top:0.5rem;">← 에피소드 목록으로</button>
  `;

  document.getElementById('newCornerBtn').onclick = () => showCornerDialog(ch);
  document.getElementById('cornerMgrBack').onclick = () => {
    state.stage = 'episodeList';
    render();
  };
  document.querySelectorAll('[data-corner-edit]').forEach(btn => {
    btn.onclick = () => {
      const cid = btn.dataset.cornerEdit;
      const c = ch.corners.find(x => x.id === cid);
      if (c) showCornerDialog(ch, c);
    };
  });
  document.querySelectorAll('[data-corner-up]').forEach(btn => {
    btn.onclick = () => {
      const cid = btn.dataset.cornerUp;
      moveCornerOrder(ch, cid, -1);
      render();
    };
  });
  document.querySelectorAll('[data-corner-down]').forEach(btn => {
    btn.onclick = () => {
      const cid = btn.dataset.cornerDown;
      moveCornerOrder(ch, cid, 1);
      render();
    };
  });
  document.querySelectorAll('[data-corner-del]').forEach(btn => {
    btn.onclick = () => {
      const cid = btn.dataset.cornerDel;
      const c = ch.corners.find(x => x.id === cid);
      if (!c) return;
      const cnt = epCount[cid] || 0;
      const msg = cnt > 0
        ? `"${c.name}" 코너를 삭제할까요?\n이 코너의 에피소드 ${cnt}개는 "분류 없음"으로 이동돼요.`
        : `"${c.name}" 코너를 삭제할까요?`;
      showConfirm(msg, () => {
        // 에피소드의 cornerId 해제 (분류 없음으로)
        (ch.episodes || []).forEach(ep => {
          if (ep.cornerId === cid) ep.cornerId = null;
        });
        ch.corners = ch.corners.filter(x => x.id !== cid);
        // 순서 재정렬
        ch.corners.forEach((cc, idx) => { cc.order = idx; });
        touchChannel(ch);
        saveState();
        render();
      });
    };
  });
}

// 코너 순서 이동 (-1: 위, +1: 아래)
function moveCornerOrder(ch, cid, dir) {
  if (!Array.isArray(ch.corners)) return;
  const sorted = ch.corners.slice().sort((a, b) => (a.order || 0) - (b.order || 0));
  const idx = sorted.findIndex(c => c.id === cid);
  if (idx < 0) return;
  const target = idx + dir;
  if (target < 0 || target >= sorted.length) return;
  [sorted[idx], sorted[target]] = [sorted[target], sorted[idx]];
  sorted.forEach((c, i) => { c.order = i; });
  touchChannel(ch);
  saveState();
}

// 코너 만들기/수정 모달
function showCornerDialog(ch, existing) {
  const isEdit = !!existing;
  const c = existing || { name: '', icon: '📌' };
  const existId = document.getElementById('pd-corner-modal');
  if (existId) existId.remove();

    const status = document.getElementById('epStatus').value;
    const cornerSelect = document.getElementById('epCorner');
    const cornerId = (cornerSelect && cornerSelect.value) ? cornerSelect.value : null;
    const scheduledUploadDate = (document.getElementById('epUploadDate').value || '').trim();

      existing.title = title;
      existing.topic = topic;
      existing.status = status;
      existing.cornerId = cornerId;
      existing.scheduledUploadDate = scheduledUploadDate;

      const created = newEpisode(ch, { epNumber, title, topic, status, cornerId, scheduledUploadDate });
      // 🔥 터질 소재 발굴 결과가 대기 중이면 새 에피소드에 연결 + state 클리어
      if (state.sourceFinder.pendingForNewEp && state.sourceFinder.pendingForNewEp.trim()) {
        created.sourceFinderResult = state.sourceFinder.pendingForNewEp.trim();
        state.sourceFinder.pendingForNewEp = '';
      }
      ch.episodes.push(created);
      ch.episodeIdNext = Math.max(ch.episodeIdNext || 1, epNumber + 1);
      ch.activeEpisodeId = created.id;
      // 📅 캘린더 동기화
      syncEpisodeUploadEvent(ch, created);
      touchChannel(ch);
      modal.remove();
      state.stage = 'menu';
      state.activeOutput = null;
      render();
      return;
    }
    touchChannel(ch);
    modal.remove();
    render();
  };
}


function ymd(y, m, d) {
  return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}
function todayYMD() {
  const t = new Date();
  return ymd(t.getFullYear(), t.getMonth(), t.getDate());
}
function parseYMD(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function eventsOnDate(dateStr) {
  return state.events.filter(e => e.date === dateStr);
}
// channel upload-cycle weekday detection (e.g. "매주 토요일" -> 6)
const WEEKDAY_MAP = { '일': 0, '월': 1, '화': 2, '수': 3, '목': 4, '금': 5, '토': 6 };
function channelCycleWeekdays() {
  const set = new Set();
  state.channels.forEach(c => {
    if (!c.uploadSchedule) return;
    Object.keys(WEEKDAY_MAP).forEach(k => {
      if (c.uploadSchedule.includes(k + '요일') || c.uploadSchedule.includes(k + ' 요일')) {
        set.add(WEEKDAY_MAP[k]);
      }
    });
  });
  return set;
}

// === BRAINSTORM (브레인스토밍 회의) ===
async function callBrainstormAI() {
  const bs = state.brainstorm;
  const ch = getActiveChannel();
  if (!ch || bs.loading) return;
  bs.loading = true;
  render();
  try {
    const systemPrompt = `당신은 1인 콘텐츠 창작자를 위한 브레인스토밍 파트너 "PD"입니다.

채널 정보:
- 채널명: ${ch.name}
- 채널 주제·방향: ${ch.topic || '미설정'}
- 채널 톤·매너: ${ch.tone || '미설정'}
- 타깃 시청자: ${ch.audience || '미설정'}

역할:
- 사용자가 키워드·막연한 아이디어를 던지면, 구체적인 영상 주제 3~5개를 제안하세요.
- 각 제안 형식: 짧은 영상 제목 후보 + 한 줄 설명 + 왜 시청자가 클릭할지 한 줄.
- 사용자가 마음에 들어하면 그 주제를 더 발전시키세요 (각도·구성·차별점·후크).
- 사용자가 부정적이면 다른 방향으로 새 제안.
- 식상하거나 일반적인 주제는 피하고, 차별화 포인트와 시청자 호기심을 자극하는 후크를 우선.
- 채널의 톤과 타깃에 맞춰서 제안하세요.

응답 톤: 친근하지만 전문적. 한 응답은 짧게 (3~6문장 또는 짧은 목록).

규칙:
- 마크다운 기호(#, *, **, _ 등) 사용 금지. 일반 텍스트로만.
- 이모지는 강조용으로만 절제해서 사용.
- 사용자가 회의를 어디로 끌고 갈지 주도권을 갖되, 막히면 다음 단계를 제안.${buildPersonaContext()}`;
    const apiMessages = bs.messages.map(m => ({ role: m.role, content: m.content }));
    const response = await callClaude(apiMessages, systemPrompt);
    bs.messages.push({ id: 'm' + Date.now(), role: 'assistant', content: response });
  } catch (e) {
    showToast(friendlyError(e));
  } finally {
    bs.loading = false;
    render();
  }
}
