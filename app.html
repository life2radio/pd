  const memosHtml = bs.memos.length > 0 ? bs.memos.map(memo => `
    <div data-memo-id="${memo.id}" style="background:rgba(245,181,0,0.08);border:1px solid rgba(245,181,0,0.3);border-radius:0.5rem;padding:0.5rem 0.6rem;margin-bottom:0.4rem;font-size:0.82rem;line-height:1.5;color:var(--ink);display:flex;gap:0.4rem;align-items:flex-start;">
      <div style="flex:1;white-space:pre-wrap;word-break:keep-all;min-width:0;">${escText(memo.text)}</div>
      <button class="bs-memo-del" data-memo-del="${memo.id}" title="메모 삭제" style="flex-shrink:0;background:rgba(255,255,255,0.7);border:1px solid rgba(122,88,24,0.2);cursor:pointer;color:#7a5818;font-size:0.85rem;width:1.5rem;height:1.5rem;border-radius:0.3rem;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;font-weight:700;">×</button>
    </div>
  `).join('') : `<div style="font-size:0.78rem;color:var(--ink-soft);font-style:italic;padding:0.4rem 0.2rem;">메시지의 📋 버튼을 누르거나 직접 입력해 메모할 수 있어요.</div>`;

  app.innerHTML = `
    <div class="card">
      <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem;">
        <h2 style="margin:0;font-size:1.05rem;color:var(--terra);flex:1;line-height:1.3;">💡 브레인스토밍 회의</h2>
        <button class="btn-tiny" id="bsReset" style="font-size:0.72rem;flex-shrink:0;">🔄 새로 시작</button>
      </div>
      <div style="font-size:0.78rem;color:var(--ink-soft);margin-bottom:0.8rem;">
        ${escText(ch.name)}${bs.keyword ? ` · 키워드: ${escText(bs.keyword)}` : ''} · ${bs.messages.length}개 대화${bs.bookmarks.length > 0 ? ` · 🔖 ${bs.bookmarks.length}` : ''}${bs.memos.length > 0 ? ` · 📝 ${bs.memos.length}` : ''}
      </div>

      <div id="bsMessages" style="background:var(--cream);border-radius:0.7rem;padding:0.9rem 0.7rem;margin-bottom:0.8rem;max-height:55vh;overflow-y:auto;">
        ${messagesHtml}
        ${loadingHtml}
      </div>

      <textarea id="bsInput" rows="2" placeholder="PD에게 답하거나 새 아이디어를 던져보세요..."
        style="width:100%;border:1px solid var(--line);border-radius:0.5rem;padding:0.7rem;font-family:inherit;font-size:0.92rem;resize:vertical;background:white;color:var(--ink);" ${bs.loading ? 'disabled' : ''}></textarea>
      <button class="btn-primary" id="bsSend" style="width:100%;margin-top:0.5rem;" ${bs.loading ? 'disabled' : ''}>${bs.loading ? '⏳ PD가 생각 중...' : '💬 보내기'}</button>
      <div style="font-size:0.72rem;color:var(--ink-soft);margin-top:0.35rem;text-align:center;">💡 PC: Ctrl+Enter로 빠른 전송</div>

      <details style="margin-top:0.9rem;background:rgba(245,181,0,0.06);border:1px solid rgba(245,181,0,0.25);border-radius:0.6rem;padding:0.5rem 0.7rem;" ${bs.memos.length > 0 ? 'open' : ''}>
        <summary style="cursor:pointer;font-size:0.85rem;font-weight:600;color:#7a5818;padding:0.2rem 0;">📝 회의 메모 (${bs.memos.length})</summary>
        <div style="margin-top:0.5rem;">
          ${memosHtml}
          <textarea id="bsMemoInput" rows="1" placeholder="회의 중 떠오른 아이디어를 빠르게 메모하세요..."
            style="width:100%;border:1px solid rgba(245,181,0,0.4);border-radius:0.4rem;padding:0.5rem;font-family:inherit;font-size:0.82rem;background:white;color:var(--ink);resize:vertical;margin-top:0.3rem;"></textarea>
          <button class="btn-tiny" id="bsMemoAdd" style="margin-top:0.3rem;background:rgba(245,181,0,0.2);color:#7a5818;font-size:0.78rem;">+ 메모 추가</button>
        </div>
      </details>

      ${bs.messages.length >= 2 ? `
        <div class="divider"></div>
        <button class="btn-secondary" id="bsConclude" style="background:rgba(184,92,56,0.12);border:1px solid rgba(184,92,56,0.3);color:var(--terra-deep);font-weight:700;">🎯 회의 결론 도출 (지금까지 정리하기)</button>
      ` : ''}
      <button class="btn-secondary" id="bsBack" style="margin-top:${bs.messages.length >= 2 ? '0.5rem' : '0.9rem'};">← 에피소드 목록으로</button>
    </div>
  `;

  // 메시지 영역 항상 아래로 스크롤
  setTimeout(() => {
    const ml = document.getElementById('bsMessages');
    if (ml) ml.scrollTop = ml.scrollHeight;
  }, 50);

  // 핸들러
  document.getElementById('bsBack').onclick = () => {
    state.stage = 'episodeList';
    render();
  };
  document.getElementById('bsReset').onclick = () => {
    showConfirm('회의를 새로 시작하시겠어요? 지금까지의 대화·책갈피·메모가 모두 사라져요.', () => {
      bs.keyword = '';
      bs.messages = [];
      bs.bookmarks = [];
      bs.memos = [];
      bs.conclusion = '';
      bs.started = false;
      bs.loading = false;
      bs.showFinal = false;
      render();
    });
  };
  // 책갈피 토글
  document.querySelectorAll('[data-bookmark-id]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const id = btn.dataset.bookmarkId;
      const idx = bs.bookmarks.indexOf(id);
      if (idx >= 0) bs.bookmarks.splice(idx, 1);
      else bs.bookmarks.push(id);
      render();
    };
  });
  // 메시지 복사 → 메모로 즉시 저장
  document.querySelectorAll('[data-copy-id]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const id = btn.dataset.copyId;
      const msg = bs.messages.find(m => m.id === id);
      if (!msg) return;
      bs.memos.push({ id: 'memo' + Date.now(), text: msg.content, createdAt: Date.now() });
      showToast('📝 메모에 추가됐어요');
      render();
    };
  });
  // 메모 삭제
  document.querySelectorAll('[data-memo-del]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const id = btn.dataset.memoDel;
      bs.memos = bs.memos.filter(mm => mm.id !== id);
      render();
    };
  });
  // 메모 직접 추가
  const memoAddBtn = document.getElementById('bsMemoAdd');
  if (memoAddBtn) memoAddBtn.onclick = () => {
    const input = document.getElementById('bsMemoInput');
    const text = input.value.trim();
    if (!text) return;
    bs.memos.push({ id: 'memo' + Date.now(), text: text, createdAt: Date.now() });
    input.value = '';
    render();
  };
  // 결론 도출
  const concludeBtn = document.getElementById('bsConclude');
  if (concludeBtn) concludeBtn.onclick = async () => {
    if (bs.loading) return;
    await concludeBrainstorm();
    bs.showFinal = true;
    render();
  };
  // 메시지 전송
  const sendBtn = document.getElementById('bsSend');
  const inputEl = document.getElementById('bsInput');
  const send = () => {
    if (bs.loading) return;
    const text = inputEl.value.trim();
    if (!text) return;
    bs.messages.push({ id: 'm' + Date.now(), role: 'user', content: text });
    inputEl.value = '';
    render();
    callBrainstormAI();
  };
  sendBtn.onclick = send;
  inputEl.addEventListener('keydown', (e) => {
    // 안드로이드 한글 IME 충돌 방지를 위해 일반 Enter는 막지 않음 (줄바꿈 유지).
    // PC 사용자는 Ctrl+Enter (Mac은 Cmd+Enter)로 빠르게 전송 가능.
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });
}

// 회의 결론 도출 — AI에게 지금까지 회의 요약 + 최종 영상 아이디어 정리 요청
async function concludeBrainstorm() {
  const bs = state.brainstorm;
  const ch = getActiveChannel();
  if (!ch || bs.loading || bs.messages.length === 0) return;
  bs.loading = true;
  render();
  try {
    // 책갈피한 메시지 별도로 강조
    const bookmarkedTexts = bs.bookmarks
      .map(id => bs.messages.find(m => m.id === id))
      .filter(Boolean)
      .map(m => `[${m.role === 'user' ? '나' : 'PD'}] ${m.content}`);
    const memoTexts = bs.memos.map(m => m.text);

    const systemPrompt = `당신은 영상 기획 회의를 마무리하는 PD입니다. 지금까지의 회의 내용을 바탕으로 실행 가능한 영상 아이디어로 정리해주세요.

채널: ${ch.name}
채널 주제·방향: ${ch.topic || '미설정'}

출력 구조:
1. 회의 핵심 요약 (3-4문장으로 우리가 다룬 방향)
2. 추천 영상 아이디어 2~3개 — 각각:
   · 영상 제목 (가제)
   · 핵심 메시지 한 줄
   · 구성 흐름 (인트로/본론 3-4단계/마무리)
   · 차별화 포인트
3. 다음 단계 제안 (즉시 만들 영상 1개 고르기 / 추가 리서치 / 인터뷰 진행 등)

규칙:
- 마크다운 기호(#, *, **) 사용 금지. 일반 텍스트로만.
- 친근하지만 명확한 어조.
- 회의에서 사용자가 강하게 호응한 방향을 우선시.${buildPersonaContext()}`;

    let contextMessages = bs.messages.map(m => ({ role: m.role, content: m.content }));
    let finalRequest = '지금까지의 회의 내용을 정리해서 결론을 도출해주세요.';
    if (bookmarkedTexts.length > 0) {
      finalRequest += `\n\n특히 사용자가 책갈피로 강조한 내용을 우선해주세요:\n${bookmarkedTexts.join('\n\n')}`;
    }
    if (memoTexts.length > 0) {
      finalRequest += `\n\n사용자가 회의 중 따로 적어둔 메모:\n${memoTexts.map(t => '· ' + t).join('\n')}`;
    }
    contextMessages.push({ role: 'user', content: finalRequest });

    const response = await callClaude(contextMessages, systemPrompt);
    bs.conclusion = response;
  } catch (e) {
    showToast(friendlyError(e));
  } finally {
    bs.loading = false;
  }
}

// 최종 출력 화면 — 회의 전체 + 책갈피 + 메모 + 결론을 한 화면에서 보고 저장
function renderBrainstormFinal(ch) {
  const bs = state.brainstorm;
  const bookmarkedMsgs = bs.bookmarks
    .map(id => bs.messages.find(m => m.id === id))
    .filter(Boolean);

  const bookmarksHtml = bookmarkedMsgs.length > 0 ? bookmarkedMsgs.map(m => `
    <div style="background:rgba(245,181,0,0.08);border:1px solid rgba(245,181,0,0.3);border-radius:0.5rem;padding:0.6rem 0.7rem;margin-bottom:0.4rem;">
      <div style="font-size:0.72rem;color:var(--ink-soft);font-weight:700;margin-bottom:0.25rem;">🔖 ${m.role === 'user' ? '나' : 'PD'}</div>
      <div style="font-size:0.88rem;line-height:1.7;white-space:pre-wrap;word-break:keep-all;color:var(--ink);">${escText(m.content)}</div>
    </div>
  `).join('') : '<div style="font-size:0.82rem;color:var(--ink-soft);font-style:italic;">책갈피한 내용이 없어요.</div>';

  const memosHtml = bs.memos.length > 0 ? bs.memos.map(m => `
    <div style="background:rgba(184,92,56,0.06);border:1px solid rgba(184,92,56,0.2);border-radius:0.5rem;padding:0.5rem 0.7rem;margin-bottom:0.4rem;font-size:0.85rem;line-height:1.6;white-space:pre-wrap;word-break:keep-all;color:var(--ink);">${escText(m.text)}</div>
  `).join('') : '<div style="font-size:0.82rem;color:var(--ink-soft);font-style:italic;">메모한 내용이 없어요.</div>';

  const allConvHtml = bs.messages.map(m => {
    const who = m.role === 'user' ? '나' : 'PD';
    const isBkm = bs.bookmarks.includes(m.id);
    return `
      <div style="background:white;border:1px solid var(--line);border-radius:0.5rem;padding:0.5rem 0.7rem;margin-bottom:0.4rem;${isBkm ? 'box-shadow:0 0 0 2px rgba(245,181,0,0.3);' : ''}">
        <div style="font-size:0.7rem;color:var(--ink-soft);font-weight:700;margin-bottom:0.2rem;">${isBkm ? '🔖 ' : ''}${who}</div>
        <div style="font-size:0.85rem;line-height:1.7;white-space:pre-wrap;word-break:keep-all;color:var(--ink);">${escText(m.content)}</div>
      </div>
    `;
  }).join('');

  app.innerHTML = `
    <div class="card">
      <h2 style="margin:0 0 0.3rem;font-size:1.05rem;color:var(--terra);line-height:1.3;">🎯 회의 결과</h2>
      <div style="font-size:0.78rem;color:var(--ink-soft);margin-bottom:0.9rem;">
        ${escText(ch.name)}${bs.keyword ? ` · 키워드: ${escText(bs.keyword)}` : ''} · ${new Date().toLocaleDateString('ko-KR')}
      </div>

      ${bs.conclusion ? `
        <div style="background:rgba(184,92,56,0.06);border:2px solid rgba(184,92,56,0.3);border-radius:0.7rem;padding:0.9rem 1rem;margin-bottom:1rem;">
          <div style="font-size:0.85rem;font-weight:700;color:var(--terra-deep);margin-bottom:0.5rem;">🎯 PD가 정리한 결론</div>
          <div style="font-size:0.92rem;line-height:1.85;white-space:pre-wrap;word-break:keep-all;color:var(--ink);">${escText(bs.conclusion)}</div>
        </div>
      ` : `
        <div style="background:rgba(255,211,122,0.1);border:1px solid rgba(212,168,67,0.3);border-radius:0.5rem;padding:0.7rem;margin-bottom:1rem;font-size:0.82rem;color:#7a5818;">
          💡 아직 결론이 없어요. ${bs.loading ? '결론 정리 중...' : '회의로 돌아가서 "🎯 회의 결론 도출" 버튼을 눌러주세요.'}
        </div>
      `}

      <details ${bs.bookmarks.length > 0 ? 'open' : ''} style="background:rgba(245,181,0,0.05);border:1px solid rgba(245,181,0,0.25);border-radius:0.6rem;padding:0.6rem 0.8rem;margin-bottom:0.7rem;">
        <summary style="cursor:pointer;font-size:0.88rem;font-weight:700;color:#7a5818;">🔖 책갈피 (${bs.bookmarks.length})</summary>
        <div style="margin-top:0.6rem;">${bookmarksHtml}</div>
      </details>

      <details ${bs.memos.length > 0 ? 'open' : ''} style="background:rgba(184,92,56,0.04);border:1px solid rgba(184,92,56,0.2);border-radius:0.6rem;padding:0.6rem 0.8rem;margin-bottom:0.7rem;">
        <summary style="cursor:pointer;font-size:0.88rem;font-weight:700;color:var(--terra-deep);">📝 메모 (${bs.memos.length})</summary>
        <div style="margin-top:0.6rem;">${memosHtml}</div>
      </details>

      <details style="background:rgba(92,74,58,0.04);border:1px solid rgba(92,74,58,0.2);border-radius:0.6rem;padding:0.6rem 0.8rem;margin-bottom:1rem;">
        <summary style="cursor:pointer;font-size:0.88rem;font-weight:700;color:var(--soil, #5C4A3A);">💬 전체 대화 (${bs.messages.length})</summary>
        <div style="margin-top:0.6rem;">${allConvHtml}</div>
      </details>

      <div class="btn-row">
        <button class="btn-tiny" id="bsfCopy">📋 복사</button>
        <button class="btn-tiny" id="bsfTxt">📄 txt</button>
        <button class="btn-tiny" id="bsfPdf">📕 pdf</button>
      </div>
      <button class="btn-secondary" id="bsfExtractSchedule" style="margin-top:0.5rem;background:linear-gradient(135deg, rgba(92,140,184,0.18) 0%, rgba(184,92,56,0.18) 100%);border:1px solid rgba(92,140,184,0.4);color:#2c5476;font-weight:700;">📅 회의에서 일정·할 일 자동 추출</button>
      <button class="btn-secondary" id="bsfReconclude" style="margin-top:0.4rem;background:rgba(184,92,56,0.1);color:var(--terra-deep);">🔄 결론 다시 도출</button>
      <button class="btn-secondary" id="bsfBackBtn">← 회의로 돌아가기</button>
    </div>
  `;

  // 출력용 텍스트 빌드
  const buildFinalText = () => {
    const parts = [];
    parts.push(`💡 ${ch.name} 브레인스토밍 회의 결과`);
    if (bs.keyword) parts.push(`키워드: ${bs.keyword}`);
    parts.push(`날짜: ${new Date().toLocaleString('ko-KR')}`);
    parts.push('');
    if (bs.conclusion) {
      parts.push('='.repeat(34));
      parts.push('🎯 PD가 정리한 결론');
      parts.push('='.repeat(34));
      parts.push('');
      parts.push(bs.conclusion);
      parts.push('');
    }
    if (bookmarkedMsgs.length > 0) {
      parts.push('='.repeat(34));
      parts.push(`🔖 책갈피 (${bookmarkedMsgs.length})`);
      parts.push('='.repeat(34));
      parts.push('');
      bookmarkedMsgs.forEach(m => {
        parts.push(`[${m.role === 'user' ? '나' : 'PD'}] ${m.content}`);
        parts.push('');
      });
    }
    if (bs.memos.length > 0) {
      parts.push('='.repeat(34));
      parts.push(`📝 메모 (${bs.memos.length})`);
      parts.push('='.repeat(34));
      parts.push('');
      bs.memos.forEach(m => { parts.push('· ' + m.text); });
      parts.push('');
    }
    parts.push('='.repeat(34));
    parts.push(`💬 전체 대화 (${bs.messages.length})`);
    parts.push('='.repeat(34));
    parts.push('');
    bs.messages.forEach(m => {
      const who = m.role === 'user' ? '나' : 'PD';
      parts.push(`[${who}] ${m.content}`);
      parts.push('');
    });
    parts.push('— 🎙 파고드림 PD 스튜디오');
    return parts.join('\n');
  };

  document.getElementById('bsfBackBtn').onclick = () => { bs.showFinal = false; render(); };

  document.getElementById('bsfCopy').onclick = async () => {
    try {
      await navigator.clipboard.writeText(buildFinalText());
      showToast('📋 회의 결과 전체 복사됨');
    } catch (e) {
      showToast('복사 실패 — 텍스트 영역에서 직접 복사해주세요');
    }
  };
  document.getElementById('bsfTxt').onclick = () => {
    const fname = `[${ch.name}] 브레인스토밍 회의_${new Date().toISOString().slice(0,10)}.txt`;
    downloadText(fname, buildFinalText());
  };
  document.getElementById('bsfPdf').onclick = () => {
    printAsPDF({
      titleHead: '브레인스토밍 회의 결과',
      channelName: ch.name,
      epLabel: '',
      epTitle: bs.keyword ? `키워드: ${bs.keyword}` : '',
      topic: bs.keyword || '',
      outputLabel: '브레인스토밍 회의',
      body: buildFinalText(),
    });
  };
  document.getElementById('bsfReconclude').onclick = async () => {
    if (bs.loading) return;
    await concludeBrainstorm();
    render();
  };
  document.getElementById('bsfExtractSchedule').onclick = async () => {
    if (bs.loading) return;
    await extractScheduleFromBrainstorm(ch);
  };
}

// 📅 브레인스토밍 회의에서 일정·할 일 자동 추출 — Claude API 1회 호출 → 모달 표시
async function extractScheduleFromBrainstorm(ch) {
  const bs = state.brainstorm;
  if (!bs || !bs.messages || bs.messages.length === 0) {
    showToast('추출할 회의 내용이 없어요');
    return;
  }
  bs.loading = true;
  render();
  try {
    const today = new Date();
    const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    const dayName = ['일','월','화','수','목','금','토'][today.getDay()];

    // 회의 메시지 + 메모 + 책갈피 텍스트 모음
    const convText = bs.messages.map(m => `[${m.role === 'user' ? '나' : 'PD'}] ${m.content}`).join('\n');
    const memoText = bs.memos && bs.memos.length > 0 ? '\n\n[메모]\n' + bs.memos.map(m => '· ' + m.text).join('\n') : '';
    const conclusionText = bs.conclusion ? '\n\n[결론]\n' + bs.conclusion : '';

    const systemPrompt = `당신은 회의 내용에서 일정과 할 일을 정확히 추출하는 비서입니다.

오늘은 ${todayStr} (${dayName}요일)입니다.

다음 회의 내용에서 *날짜·시간·할 일* 키워드가 있는 항목을 JSON 배열로 추출해주세요.

규칙:
- 정확한 날짜를 알 수 있는 항목만 추출 (예: "다음 주 화요일" → 정확한 YYYY-MM-DD로 변환)
- "나중에", "곧" 같이 모호한 표현은 *제외*
- 같은 일정이 여러 번 언급되면 *한 번만* 추출
- 사용자가 *실제로 하기로 결정한 것*만. 단순 제안이나 가능성은 제외.
- type은 다음 중 하나: "task"(할 일), "upload"(업로드), "shoot"(촬영), "edit"(편집), "meeting"(미팅), "other"(기타)

응답은 *오직 JSON 배열만*. 다른 설명·마크다운·코드블록 금지.
형식: [{"date":"YYYY-MM-DD","title":"제목 (짧게)","type":"task","note":"상세 (없으면 빈 문자열)"}]
추출할 일정이 없으면: []`;

    const response = await callClaude(
      [{ role: 'user', content: `다음 회의 내용에서 일정·할 일을 추출해주세요:\n\n${convText}${memoText}${conclusionText}` }],
      systemPrompt
    );

    // JSON 파싱 — 응답에서 [ ... ] 영역만 추출
    let items = [];
    try {
      const match = response.match(/\[[\s\S]*\]/);
      if (match) items = JSON.parse(match[0]);
    } catch (e) {
      console.error('JSON 파싱 실패:', e);
    }

    bs.loading = false;
    render();

    if (!Array.isArray(items) || items.length === 0) {
      showToast('회의에서 명확한 일정을 찾지 못했어요');
      return;
    }

    showScheduleCandidatesModal(items, ch);
  } catch (e) {
    bs.loading = false;
    render();
    showToast(friendlyError(e));
  }
}

// === ARCHIVE (결과물 보관함) ===
function formatArchiveDate(ts) {
  if (!ts) return '날짜 미상';
  const d = new Date(ts);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

function getArchiveItems(ch) {
  // 채널 안 모든 에피소드의 모든 결과물을 평면화
  const items = [];
  (ch.episodes || []).forEach(ep => {
    Object.keys(ep.outputs || {}).forEach(key => {
      const content = ep.outputs[key];
      if (!content || typeof content !== 'string' || !content.trim()) return;
      items.push({
        epId: ep.id,
        epNumber: ep.epNumber || 0,
        epTitle: ep.title || '',
        epLabel: `EP.${String(ep.epNumber || 0).padStart(2, '0')}`,
        outputKey: key,
        outputLabel: OUTPUTS[key]?.label || key,
        outputIcon: OUTPUTS[key]?.icon || '📄',
        content: content,
        timestamp: ep.updatedAt || ep.createdAt || 0,
      });
    });
  });
  return items;
}

function filterArchiveItems(items) {
  const arc = state.archive;
  let r = items;
  // 단어 검색 (본문 + 에피소드 제목 + 작업명)
  if (arc.searchTerm && arc.searchTerm.trim()) {
    const q = arc.searchTerm.trim().toLowerCase();
    r = r.filter(it =>
      (it.content || '').toLowerCase().includes(q) ||
      (it.epTitle || '').toLowerCase().includes(q) ||
      (it.outputLabel || '').toLowerCase().includes(q) ||
      (it.epLabel || '').toLowerCase().includes(q)
    );
  }
  if (arc.filterType) r = r.filter(it => it.outputKey === arc.filterType);
  if (arc.filterEpId) r = r.filter(it => it.epId === arc.filterEpId);
  if (arc.filterDate === '7days') {
    const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
    r = r.filter(it => it.timestamp >= cutoff);
  } else if (arc.filterDate === '30days') {
    const cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
    r = r.filter(it => it.timestamp >= cutoff);
  } else if (arc.filterDate === '6months') {
    const cutoff = Date.now() - 180 * 24 * 60 * 60 * 1000;
    r = r.filter(it => it.timestamp >= cutoff);
  } else if (arc.filterDate === '1year') {
    const cutoff = Date.now() - 365 * 24 * 60 * 60 * 1000;
    r = r.filter(it => it.timestamp >= cutoff);
  }
  // 정렬
  r = r.slice().sort((a, b) => arc.sort === 'oldest' ? a.timestamp - b.timestamp : b.timestamp - a.timestamp);
  return r;
}

// 🔥 터질 소재 찾기 — 채널 톤·시청자에 맞춘 후킹 각도 발굴
// === 발굴 결과 텍스트를 각도 1/2/3 카드로 분리 렌더링 ===
// AI가 "각도 1", "각도 2", "각도 3" 같은 마커로 출력하면 정규식으로 split.
// 마커가 없으면 통째로 한 박스에 표시 (fallback).
function renderSourceFinderResultCards(rawText) {
  if (!rawText || !rawText.trim()) return '';
  const text = rawText.trim();
  // "각도 1", "각도 2", "각도 3" 또는 "1.", "2.", "3." 등의 헤더로 split
  // 가장 안전한 패턴: 줄 시작에서 "각도 N"
  const sections = text.split(/\n(?=각도\s*[1-9]\b|\[?각도\s*[1-9]\]?)/);
  // 첫 섹션은 인트로(PD 인사말 등), 나머지는 각도들
  let intro = '';
  let angles = [];
  if (sections.length === 1) {
    // 마커가 없거나 단일 — 통째 표시
    return `
      <div style="background:white;border:2px solid rgba(255,107,53,0.25);border-radius:0.9rem;padding:1rem 1.1rem;">
        <div style="font-size:0.86rem;font-weight:800;color:#c1521e;margin-bottom:0.6rem;display:flex;align-items:center;gap:0.35rem;">🎯 발굴된 영상 각도</div>
        <div style="font-size:0.9rem;line-height:1.85;color:var(--ink);white-space:pre-wrap;word-break:keep-all;">${escText(text)}</div>
      </div>
    `;
  }
  // sections[0]가 "각도 1"로 시작하면 인트로 없음, 아니면 인트로
  if (/^각도\s*[1-9]\b|^\[?각도\s*[1-9]\]?/.test(sections[0].trim())) {
    angles = sections;
  } else {
    intro = sections[0].trim();
    angles = sections.slice(1);
  }

  const angleCardsHtml = angles.map((angleText, i) => {
    const trimmed = angleText.trim();
    // 첫 줄은 헤더(각도 N + 제목)
    const lines = trimmed.split('\n');
    const headerLine = lines[0].trim();
    const bodyText = lines.slice(1).join('\n').trim();
    // 헤더에서 번호와 제목 분리
    const headerMatch = headerLine.match(/^\[?각도\s*([1-9])\]?\.?\s*[:：]?\s*(.*)/);
    const angleNum = headerMatch ? headerMatch[1] : String(i + 1);
    const angleTitle = headerMatch ? (headerMatch[2] || '').trim() : headerLine;
    return `
      <div style="background:white;border:1.5px solid rgba(255,107,53,0.2);border-radius:0.9rem;padding:0;margin-bottom:0.8rem;box-shadow:0 2px 10px rgba(40,20,10,0.04);overflow:hidden;">
        <div style="background:linear-gradient(135deg, #FF6B35 0%, #C1521E 100%);color:white;padding:0.7rem 1rem;display:flex;align-items:center;gap:0.55rem;">
          <span style="font-size:0.7rem;font-weight:800;background:rgba(255,255,255,0.22);padding:0.18rem 0.5rem;border-radius:0.35rem;letter-spacing:0.04em;">각도 ${escText(angleNum)}</span>
          ${angleTitle ? `<span style="font-size:0.92rem;font-weight:700;line-height:1.4;flex:1;">${escText(angleTitle)}</span>` : ''}
        </div>
        ${bodyText ? `<div style="padding:0.85rem 1rem;font-size:0.86rem;line-height:1.8;color:var(--ink);white-space:pre-wrap;word-break:keep-all;">${escText(bodyText)}</div>` : ''}
      </div>
    `;
  }).join('');

  return `
    ${intro ? `
      <div style="background:linear-gradient(135deg, rgba(255,252,245,0.8) 0%, rgba(248,239,216,0.5) 100%);border:1px solid rgba(184,92,56,0.18);border-radius:0.8rem;padding:0.85rem 1rem;margin-bottom:0.9rem;">
        <div style="font-size:0.86rem;line-height:1.8;color:var(--ink);white-space:pre-wrap;word-break:keep-all;">${escText(intro)}</div>
      </div>
    ` : ''}
    <div style="font-size:0.82rem;font-weight:800;color:#c1521e;margin-bottom:0.5rem;display:flex;align-items:center;gap:0.35rem;letter-spacing:0.03em;">🎯 발굴된 영상 각도 ${angles.length}개</div>
    ${angleCardsHtml}
  `;
}

function renderSourceFinder() {
  const ch = getActiveChannel();
  if (!ch) { state.stage = 'dashboard'; render(); return; }
  const sf = state.sourceFinder;
  // 채널 바뀌면 전체 초기화
  if (sf.channelId !== ch.id) {
    sf.channelId = ch.id;
    sf.stage = 'input';
    sf.trendInput = '';
    sf.topicsRaw = ''; sf.topicsList = []; sf.selectedTopicIdxs = [];
    sf.anglesRaw = ''; sf.anglesByTopic = []; sf.selectedAngles = [];
    sf.loading = false;
    sf.result = '';
  }

  // stage 분기
  if (sf.stage === 'input') return renderSfInputStage(ch, sf);
  if (sf.stage === 'topics') return renderSfTopicsStage(ch, sf);
  if (sf.stage === 'angles') return renderSfAnglesStage(ch, sf);
  return renderSfInputStage(ch, sf);
}

${channelInfo}

[발굴 규칙]

[출력 구조 — 소재 5~6개]

⚠ 절대 규칙:

- 마크다운 기호(*, #, **, -) 사용 금지
- 각도·후킹 패턴·영상 제목·인트로 같은 건 *아직* 안 만듦 — 그건 다음 단계

// AI 응답에서 소재 카드 배열 추출
function parseTopicsFromAI(rawText) {
  if (!rawText || !rawText.trim()) return [];
  const text = rawText.trim();
  // "소재 1.", "소재 2." 헤더로 split
  const sections = text.split(/\n(?=소재\s*[1-9]\b|\[?소재\s*[1-9]\]?)/);
  const topics = [];
  sections.forEach(section => {
    const trimmed = section.trim();
    // 소재 N. 으로 시작하는 것만
    const headerMatch = trimmed.match(/^\[?소재\s*([1-9])\]?\.?\s*[:：]?\s*(.*)/);
    if (!headerMatch) return; // 인트로 등은 무시
    const lines = trimmed.split('\n');
    const headerLine = lines[0].trim();
    const titleMatch = headerLine.match(/^\[?소재\s*[1-9]\]?\.?\s*[:：]?\s*(.*)/);
    let title = titleMatch ? (titleMatch[1] || '').trim() : '';
    // 대괄호 제거
    title = title.replace(/^\[(.+)\]$/, '$1').trim();

    // body: 나머지 줄 (왜 마음 쓸까 등)
    const bodyLines = lines.slice(1).map(l => l.trim()).filter(Boolean);
    // "왜 시청자가 마음 쓸까:" 같은 라벨 제거
    const whyText = bodyLines.map(l => l.replace(/^왜\s*시청자가?\s*마음\s*쓸까\s*[:：]?\s*/, '').trim()).filter(Boolean).join('\n');

    if (title) topics.push({ title, why: whyText });
  });
  return topics;
}

    showToast('⚠ 선택된 소재가 없어요');
    return;
  }
  sf.loading = true;
  sf.stage = 'angles';
  render();

  try {
    const selectedTopics = sf.selectedTopicIdxs.map(i => sf.topicsList[i]).filter(Boolean);
    const topicsListText = selectedTopics.map((t, i) =>

// AI 응답에서 소재별 각도 그룹 추출
// 출력: [{ topicTitle, angles: [{ num, title, body }] }]
function parseAnglesFromAI(rawText, selectedTopics) {
  if (!rawText || !rawText.trim()) return [];
  const text = rawText.trim();

  // "=== 소재 N: 제목 ===" 로 그룹 split
  const groupRegex = /===\s*소재\s*[1-9]\s*[:：]?\s*([^=]+?)\s*===/g;
  const splits = text.split(/===\s*소재\s*[1-9]\s*[:：]?\s*[^=]+?\s*===/);
  const headers = [];
  let m;
  while ((m = groupRegex.exec(text)) !== null) {
    headers.push(m[1].trim());
  }

  // 첫 split은 헤더 앞 부분(빈 텍스트 또는 도입). 그 후 splits[i+1]은 headers[i] 그룹의 body
  const groups = [];
  headers.forEach((rawTitle, gi) => {
    const groupBody = (splits[gi + 1] || '').trim();
    if (!groupBody) return;
    // "각도 N." 마커로 각도들 split
    const angleSections = groupBody.split(/\n(?=각도\s*[1-9]\b|\[?각도\s*[1-9]\]?)/);
    const angles = [];
    angleSections.forEach(section => {
      const t = section.trim();
      const headerMatch = t.match(/^\[?각도\s*([1-9])\]?\.?\s*[:：]?\s*(.*)/);
      if (!headerMatch) return;
      const num = headerMatch[1];
      let angleTitle = (headerMatch[2] || '').trim().replace(/^\[(.+)\]$/, '$1').trim();
      const bodyText = t.split('\n').slice(1).join('\n').trim();
      angles.push({ num, title: angleTitle, body: bodyText });
    });
    if (angles.length > 0) {
      // 소재 제목 우선순위: AI 출력 header (대괄호 제거) → 원본 선택 소재 제목
      let cleanTitle = rawTitle.replace(/^\[(.+)\]$/, '$1').trim();
      if (!cleanTitle && selectedTopics[gi]) cleanTitle = selectedTopics[gi].title;
      groups.push({ topicTitle: cleanTitle, angles });
    }
  });

  // fallback: 그룹 파싱 실패 시 선택 소재 그대로 + 단일 그룹
  if (groups.length === 0 && selectedTopics.length > 0) {
    // 전체 텍스트에서 각도만 split해서 첫 소재에 다 붙임
    const angleSections = text.split(/\n(?=각도\s*[1-9]\b)/);
    const angles = [];
    angleSections.forEach(section => {
      const t = section.trim();
      const headerMatch = t.match(/^\[?각도\s*([1-9])\]?\.?\s*[:：]?\s*(.*)/);
      if (!headerMatch) return;
      const num = headerMatch[1];
      const angleTitle = (headerMatch[2] || '').trim().replace(/^\[(.+)\]$/, '$1').trim();
      const bodyText = t.split('\n').slice(1).join('\n').trim();
      angles.push({ num, title: angleTitle, body: bodyText });
    });
    if (angles.length > 0) {
      groups.push({ topicTitle: selectedTopics[0].title, angles });
    }
  }

  return groups;
}

// === 선택된 각도들 → 에피소드 자동 생성 ===
function createEpisodesFromAngles() {
  const ch = getActiveChannel();
  if (!ch) return;
  const sf = state.sourceFinder;
  if (!sf.selectedAngles || sf.selectedAngles.length === 0) {
    showToast('⚠ 선택된 각도가 없어요');
    return;
  }

  const newEpisodes = [];
  sf.selectedAngles.forEach(sel => {
    const group = sf.anglesByTopic[sel.topicIdx];
    if (!group) return;
    const angle = group.angles[sel.angleIdx];
    if (!angle) return;

    // sourceFinderResult — 소재 + 각도 정보 종합. 이후 모든 AI 작업에 자동 반영됨
    const sourceFinderResult = [
      `[소재] ${group.topicTitle}`,
      `[선택한 각도]`,
      `각도 ${angle.num}. ${angle.title}`,
      '',
      angle.body,
    ].filter(Boolean).join('\n');

    const ep = newEpisode(ch, {
      epNumber: ch.episodeIdNext || (ch.episodes.length + 1),
      title: angle.title || group.topicTitle,
      status: 'planning',
      topic: group.topicTitle,
      sourceFinderResult,
    });
    ch.episodes.push(ep);
    ch.episodeIdNext = (ch.episodeIdNext || ch.episodes.length) + 1;
    newEpisodes.push(ep);
  });

  if (newEpisodes.length === 0) {
    showToast('⚠ 에피소드 생성 실패');
    return;
  }

  // 첫 새 에피소드 활성화
  ch.activeEpisodeId = newEpisodes[0].id;
  state.activeChannelId = ch.id;
  touchChannel(ch);

  // 발굴 상태 초기화 (재진입 시 새 발굴 가능)
  sf.stage = 'input';
  sf.trendInput = '';
  sf.topicsRaw = ''; sf.topicsList = []; sf.selectedTopicIdxs = [];
  sf.anglesRaw = ''; sf.anglesByTopic = []; sf.selectedAngles = [];

  saveState();
  const cornerHint = (ch.corners && ch.corners.length > 0) ? ' (코너 분류는 작업 메뉴 → 에피소드 정보 수정에서)' : '';
  showToast(`✨ ${newEpisodes.length}개 에피소드 생성됨! 첫 번째 에피소드로 이동해요.${cornerHint}`);
  state.stage = 'menu';
  render();
}

function renderCalendar() {
  const now = new Date();
  if (state.calYear === null) { state.calYear = now.getFullYear(); state.calMonth = now.getMonth(); }
  const y = state.calYear, m = state.calMonth;
  const first = new Date(y, m, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const tStr = todayYMD();
  const cycleDays = channelCycleWeekdays();

  // build cells
  let cells = '';
  for (let i = 0; i < startDow; i++) cells += `<div class="cal-cell empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = ymd(y, m, d);
    const dow = new Date(y, m, d).getDay();
    const evs = eventsOnDate(dateStr);
    const isToday = dateStr === tStr;
    const isCycle = cycleDays.has(dow);
    const hasImportant = evs.some(e => e.important && !e.done);
    const dotsHtml = evs.slice(0, 4).map(e => {
      const info = eventTypeInfo(e.type);
      return `<span class="cal-dot" style="background:${info.color};${e.done ? 'opacity:0.4;' : ''}"></span>`;
    }).join('');
    const dowClass = dow === 0 ? 'sun' : (dow === 6 ? 'sat' : '');
    cells += `
      <div class="cal-cell ${isToday ? 'today' : ''} ${evs.length ? 'has-schedule' : ''} ${isCycle ? 'cycle-day' : ''}" data-date="${dateStr}">
        <span class="cal-daynum ${dowClass}">${d}</span>
        ${hasImportant ? '<span class="cal-star">⭐</span>' : ''}
        <div class="cal-dots">${dotsHtml}</div>
      </div>
    `;
  }

  // upcoming summary: today + next days
  const upcoming = sortEvents(state.events.filter(e => e.date >= tStr && !e.done))
    .sort((a, b) => {
      // date first, then importance/time within date
      if (a.date !== b.date) return a.date.localeCompare(b.date);
      return 0;
    });
  // re-sort properly: by date, then sortEvents order within date
  const upcomingByDate = {};
  state.events.filter(e => e.date >= tStr && !e.done).forEach(e => {
    (upcomingByDate[e.date] = upcomingByDate[e.date] || []).push(e);
  });
  const upcomingList = [];
  Object.keys(upcomingByDate).sort().forEach(dt => {
    sortEvents(upcomingByDate[dt]).forEach(e => upcomingList.push(e));
  });
  const upcomingShown = upcomingList.slice(0, 6);
  const todayEvents = sortEvents(state.events.filter(e => e.date === tStr));

  const summaryHtml = `
    <div class="summary-box">
      <h3>🔔 오늘 (${tStr})</h3>
      ${todayEvents.length === 0
        ? `<div style="font-size:0.82rem;color:var(--soil-light);">오늘 등록된 일정이 없어요.</div>`
        : todayEvents.map(e => eventRowHtml(e)).join('')}
    </div>
    <div class="summary-box">
      <h3>📋 다가오는 일정</h3>
      ${upcomingShown.length === 0
        ? `<div style="font-size:0.82rem;color:var(--soil-light);">예정된 일정이 없어요. 달력 날짜를 눌러 추가해보세요.</div>`
        : upcomingShown.map(e => eventRowHtml(e, true)).join('')}
    </div>
  `;

  // memos / todos
  const memosHtml = state.memos.length === 0
    ? `<div style="font-size:0.82rem;color:var(--soil-light);">메모가 없어요. 아이디어나 할 일을 적어두세요.</div>`
    : state.memos.map(mo => `
      <div class="memo-card ${mo.done ? 'done' : ''}">
        <button class="memo-check" data-memo-check="${mo.id}">${mo.done ? '✓' : ''}</button>
        <div class="memo-text">${escText(mo.text)}</div>
        <button class="memo-to-event" data-memo-to-event="${mo.id}" title="일정으로 변환">📅</button>
        <button class="memo-del" data-memo-del="${mo.id}">✕</button>
      </div>
    `).join('');

  app.innerHTML = `
    <div class="breadcrumb">콘텐츠 캘린더</div>
    <div class="cal-head">
      <button class="cal-nav-btn" id="calPrev">‹</button>
      <div class="cal-title">${y}년 ${m + 1}월</div>
      <button class="cal-nav-btn" id="calNext">›</button>
    </div>
    <div style="text-align:center;margin-bottom:0.8rem;">
      <button class="btn-tiny" id="calToday">오늘로</button>
    </div>
    <div class="cal-grid">
      <div class="cal-dow sun">일</div><div class="cal-dow">월</div><div class="cal-dow">화</div>
      <div class="cal-dow">수</div><div class="cal-dow">목</div><div class="cal-dow">금</div>
      <div class="cal-dow sat">토</div>
      ${cells}
    </div>
    <div style="font-size:0.72rem;color:var(--soil-light);margin-bottom:1rem;text-align:center;">
      날짜를 누르면 일정을 추가할 수 있어요 · ${EVENT_TYPES.map(t => `${t.icon}${t.label}`).join('  ')}
      ${cycleDays.size > 0 ? '<br>🟡 테두리 = 채널 업로드 요일' : ''}
    </div>
    ${summaryHtml}
    <div class="summary-box">
      <h3>📝 메모 · 할 일</h3>
      <textarea id="memoInput" placeholder="아이디어, 할 일, 기억할 것... (날짜와 무관한 메모)" style="min-height:60px;margin-bottom:0.5rem;"></textarea>
      <button class="btn-tiny" id="addMemo">+ 메모 추가</button>
      <div style="margin-top:0.7rem;">${memosHtml}</div>
    </div>
    <div class="divider"></div>
    <button class="btn-secondary" id="calBack">← ${state.calReturn === 'landing' ? '처음으로' : '대시보드로'}</button>
  `;

  document.getElementById('calPrev').onclick = () => {
    state.calMonth--;
    if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }
    render();
  };
  document.getElementById('calNext').onclick = () => {
    state.calMonth++;
    if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
    render();
  };
  document.getElementById('calToday').onclick = () => {
    const t = new Date();
    state.calYear = t.getFullYear(); state.calMonth = t.getMonth();
    render();
  };
  document.querySelectorAll('.cal-cell[data-date]').forEach(cell => {
    cell.onclick = () => showEventDialog(cell.dataset.date);
  });
  document.querySelectorAll('[data-ev-check]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const id = parseInt(btn.dataset.evCheck);
      const ev = state.events.find(x => x.id === id);
      if (ev) { ev.done = !ev.done; render(); }
    };
  });
  document.querySelectorAll('[data-ev-del]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const id = parseInt(btn.dataset.evDel);
      state.events = state.events.filter(x => x.id !== id);
      render();
    };
  });
  document.querySelectorAll('[data-ev-edit]').forEach(row => {
    row.onclick = () => {
      const id = parseInt(row.dataset.evEdit);
      const ev = state.events.find(x => x.id === id);
      if (ev) showEventDialog(ev.date, ev);
    };
  });
  document.getElementById('addMemo').onclick = () => {
    const txt = document.getElementById('memoInput').value.trim();
    if (!txt) { showToast('메모 내용을 입력해주세요.'); return; }
    state.memos.unshift({ id: state.memoIdNext++, text: txt, done: false, createdAt: Date.now() });
    render();
  };
  document.querySelectorAll('[data-memo-check]').forEach(btn => {
    btn.onclick = () => {
      const id = parseInt(btn.dataset.memoCheck);
      const mo = state.memos.find(x => x.id === id);
      if (mo) { mo.done = !mo.done; render(); }
    };
  });
  document.querySelectorAll('[data-memo-del]').forEach(btn => {
    btn.onclick = () => {
      const id = parseInt(btn.dataset.memoDel);
      state.memos = state.memos.filter(x => x.id !== id);
      render();
    };
  });
  // 📅 메모 → 일정 변환
  document.querySelectorAll('[data-memo-to-event]').forEach(btn => {
    btn.onclick = () => {
      const id = parseInt(btn.dataset.memoToEvent);
      const mo = state.memos.find(x => x.id === id);
      if (mo) convertMemoToEvent(mo);
    };
  });
  document.getElementById('calBack').onclick = () => {
    state.stage = (state.calReturn === 'landing') ? 'landing' : 'dashboard';
    render();
  };
}

// 📝 한국어 메모에서 날짜 키워드 추출 → YYYY-MM-DD 반환
// 못 찾으면 오늘 날짜 반환
function extractDateFromMemo(text) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

  if (!text) return ymd(today);
  const t = text.replace(/\s+/g, ''); // 공백 제거해서 매칭 단순화

  // 1. "오늘" → 오늘
  if (/오늘/.test(t)) return ymd(today);

  // 2. "내일" → 내일
  if (/내일/.test(t)) {
    const d = new Date(today); d.setDate(today.getDate() + 1);
    return ymd(d);
  }

  // 3. "모레" → 모레
  if (/모레/.test(t)) {
    const d = new Date(today); d.setDate(today.getDate() + 2);
    return ymd(d);
  }

  // 4. "X월 Y일" 또는 "X/Y" 형식
  const mdMatch = t.match(/(\d{1,2})월(\d{1,2})일/) || t.match(/(\d{1,2})\/(\d{1,2})/);
  if (mdMatch) {
    const month = parseInt(mdMatch[1]);
    const day = parseInt(mdMatch[2]);
    if (month >= 1 && month <= 12 && day >= 1 && day <= 31) {
      const year = today.getFullYear();
      const d = new Date(year, month - 1, day);
      // 이미 지났으면 내년으로
      if (d < today) d.setFullYear(year + 1);
      return ymd(d);
    }
  }

  // 5. "다음주 X요일" / "다음 주 X요일"
  const dayMap = { '일': 0, '월': 1, '화': 2, '수': 3, '목': 4, '금': 5, '토': 6 };
  const nextWeekMatch = t.match(/다음주([일월화수목금토])요일?/) || t.match(/다음주([일월화수목금토])/);
  if (nextWeekMatch) {
    const targetDay = dayMap[nextWeekMatch[1]];
    const d = new Date(today);
    const diff = (targetDay - d.getDay() + 7) % 7;
    d.setDate(today.getDate() + (diff || 7) + 7); // 이번 주 같은 요일 + 7일 = 다음 주
    return ymd(d);
  }

  // 6. "이번주 X요일" / "이번 주 X요일" / 그냥 "X요일"
  const thisWeekMatch = t.match(/이번주([일월화수목금토])요일?/) || t.match(/([일월화수목금토])요일/);
  if (thisWeekMatch) {
    const targetDay = dayMap[thisWeekMatch[1]];
    const d = new Date(today);
    const diff = (targetDay - d.getDay() + 7) % 7;
    d.setDate(today.getDate() + (diff || 7)); // 오늘이 그 요일이면 다음 주 같은 요일
    return ymd(d);
  }

  // 못 찾으면 오늘
  return ymd(today);
}

// 📝 메모를 일정으로 변환 — extractDateFromMemo 호출 후 showEventDialog 열기
function convertMemoToEvent(memo) {
  if (!memo || !memo.text) return;
  const dateStr = extractDateFromMemo(memo.text);
  // 메모 텍스트를 일정 제목으로 사용 (긴 메모는 첫 줄 또는 50자로 자름)
  const firstLine = memo.text.split('\n')[0].trim();
  const title = firstLine.length > 50 ? firstLine.slice(0, 50) + '…' : firstLine;
  // 일정 다이얼로그를 미리 채워서 열기
  showEventDialog(dateStr, {
    type: 'task',
    title: title,
    channelId: null,
    note: memo.text.length > title.length ? memo.text : '',
    done: false,
    allDay: true,
    time: '',
    important: false,
    _fromMemo: memo.id, // 일정 저장 후 메모 완료 처리에 사용
  });
}

function eventRowHtml(e, showDate) {
  const info = eventTypeInfo(e.type);
  const ch = state.channels.find(c => c.id === e.channelId);
  const metaParts = [];
  if (showDate) metaParts.push(e.date);
  const timeLabel = (e.allDay === false && e.time) ? `🕐 ${e.time}` : '하루 종일';
  metaParts.push(timeLabel);
  if (ch) metaParts.push(ch.name);
  if (e.note) metaParts.push(e.note);
  return `
    <div class="event-row ${e.done ? 'done' : ''} ${e.important ? 'important' : ''}" data-ev-edit="${e.id}">
      <button class="ev-check" data-ev-check="${e.id}">${e.done ? '✓' : ''}</button>
      <div class="ev-body">
        <div class="ev-title">
          ${e.important ? '<span class="ev-star">⭐</span>' : ''}
          <span class="type-pill" style="background:${info.color};">${info.icon} ${info.label}</span>
          ${escText(e.title)}
        </div>
        ${metaParts.length ? `<div class="ev-meta">${escText(metaParts.join(' · '))}</div>` : ''}
      </div>
      <button class="ev-del" data-ev-del="${e.id}">🗑</button>
    </div>
  `;
}

// sort: important first, then by time (all-day last within same group)
function sortEvents(list) {
  return list.slice().sort((a, b) => {
    if (!!b.important !== !!a.important) return b.important ? 1 : -1;
    const at = (a.allDay === false && a.time) ? a.time : '99:99';
    const bt = (b.allDay === false && b.time) ? b.time : '99:99';
    return at.localeCompare(bt);
  });
}

function showEventDialog(dateStr, existing) {
  // existing이 .id를 가지면 수정 모드. .id 없는 객체는 *prefill* (메모에서 변환 등)
  const isEdit = !!(existing && typeof existing.id !== 'undefined');
  const ev = existing || { type: 'upload', title: '', channelId: null, note: '', done: false, allDay: true, time: '', important: false };
  const fromMemoId = existing && existing._fromMemo;
  const existId = document.getElementById('pd-event-modal');
  if (existId) existId.remove();

  const modal = document.createElement('div');
  modal.id = 'pd-event-modal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(20,15,10,0.7);z-index:10000;display:flex;align-items:center;justify-content:center;padding:1.2rem;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);font-family:inherit;overflow-y:auto;';

  const typeOpts = EVENT_TYPES.map(t =>
    `<option value="${t.key}"${ev.type === t.key ? ' selected' : ''}>${t.icon} ${t.label}</option>`
  ).join('');
  const chOpts = ['<option value="">(채널 연결 안 함)</option>'].concat(
    state.channels.map(c => `<option value="${c.id}"${ev.channelId === c.id ? ' selected' : ''}>${escText(c.name)}</option>`)
  ).join('');
  const allDay = ev.allDay !== false;

  modal.innerHTML = `
    <div style="background:#FAF5EA;border-radius:1rem;padding:1.4rem;max-width:380px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,0.3);">
      <div style="font-size:1rem;font-weight:700;color:#2A1810;margin-bottom:0.2rem;">${isEdit ? '일정 수정' : '새 일정 추가'}</div>
      <div style="font-size:0.8rem;color:#8B6F47;margin-bottom:1rem;">📅 ${dateStr}</div>

      <label>일정 유형</label>
      <select id="evType">${typeOpts}</select>

      <label>제목 *</label>
      <input type="text" id="evTitle" placeholder="예: EP.06 업로드, 촬영, 대본 마감" value="${escAttr(ev.title)}">

      <label>시간</label>
      <label style="display:flex;align-items:center;font-size:0.85rem;color:var(--ink);margin-bottom:0.5rem;cursor:pointer;font-weight:400;">
        <input type="checkbox" id="evAllDay"${allDay ? ' checked' : ''}> 하루 종일
      </label>
      <input type="time" id="evTime" value="${escAttr(ev.time || '')}" style="display:${allDay ? 'none' : 'block'};">

      <label style="display:flex;align-items:center;font-size:0.9rem;color:var(--ink);margin:0.3rem 0 0.9rem;cursor:pointer;font-weight:600;">
        <input type="checkbox" id="evImportant"${ev.important ? ' checked' : ''}> ⭐ 중요 표시
      </label>

      <label>채널 연결 (선택)</label>
      <select id="evChannel">${chOpts}</select>

      <label>메모 (선택)</label>
      <textarea id="evNote" placeholder="추가 메모" style="min-height:50px;">${escText(ev.note || '')}</textarea>

      ${ev.episodeId ? (() => {
        const found = findEpisodeByEventId(ev.id);
        return found ? `
          <div style="background:rgba(184,92,56,0.08);border:1px solid rgba(184,92,56,0.25);border-radius:0.6rem;padding:0.65rem 0.8rem;margin-bottom:0.8rem;">
            <div style="font-size:0.72rem;color:var(--soil-light);margin-bottom:0.25rem;font-weight:600;">🔗 연결된 에피소드</div>
            <div style="font-size:0.85rem;color:var(--ink);margin-bottom:0.5rem;line-height:1.5;">EP.${String(found.ep.epNumber).padStart(2, '0')}${found.ep.title ? ' · ' + escText(found.ep.title) : ''}</div>
            <button class="btn-secondary" id="evGoToEpisode" style="margin:0;background:white;border:1px solid rgba(184,92,56,0.4);color:var(--terra-deep);font-size:0.82rem;font-weight:700;">▶ 이 에피소드 작업 메뉴로</button>
          </div>
        ` : '';
      })() : ''}

      <button class="btn-primary" id="evSave" style="margin-top:0.3rem;">${isEdit ? '수정 완료' : '일정 추가'}</button>
      ${isEdit ? `<button class="btn-secondary" id="evDelete" style="color:var(--terra-deep);border-color:rgba(184,92,56,0.4);">🗑 이 일정 삭제</button>` : ''}
      <button class="btn-secondary" id="evCancel">취소</button>
    </div>
  `;
  document.body.appendChild(modal);
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
  document.getElementById('evCancel').onclick = () => modal.remove();
  document.getElementById('evAllDay').onchange = (e) => {
    document.getElementById('evTime').style.display = e.target.checked ? 'none' : 'block';
  };
  // 🔗 연결된 에피소드로 이동
  const goEpBtn = document.getElementById('evGoToEpisode');
  if (goEpBtn) goEpBtn.onclick = () => {
    const found = findEpisodeByEventId(ev.id);
    if (!found) { showToast('연결된 에피소드를 찾을 수 없어요'); return; }
    state.activeChannelId = found.ch.id;
    found.ch.activeEpisodeId = found.ep.id;
    modal.remove();
    state.stage = 'menu';
    state.activeOutput = null;
    render();
  };
  document.getElementById('evSave').onclick = () => {
    const title = document.getElementById('evTitle').value.trim();
    if (!title) { showToast('제목을 입력해주세요.'); return; }
    const type = document.getElementById('evType').value;
    const channelId = document.getElementById('evChannel').value || null;
    const note = document.getElementById('evNote').value.trim();
    const evAllDay = document.getElementById('evAllDay').checked;
    const time = evAllDay ? '' : document.getElementById('evTime').value;
    const important = document.getElementById('evImportant').checked;
    if (isEdit) {
      existing.type = type; existing.title = title;
      existing.channelId = channelId; existing.note = note;
      existing.allDay = evAllDay; existing.time = time; existing.important = important;
    } else {
      state.events.push({
        id: state.eventIdNext++, date: dateStr,
        type, title, channelId, note, done: false,
        allDay: evAllDay, time, important,
      });
      // 📝 메모에서 변환된 일정이면 원본 메모를 완료 처리 (중복 추적 방지)
      if (fromMemoId) {
        const mo = state.memos.find(x => x.id === fromMemoId);
        if (mo) mo.done = true;
        showToast('✓ 일정 추가 · 원본 메모는 완료 처리됐어요');
      }
    }
    modal.remove();
    render();
  };
  const evDel = document.getElementById('evDelete');
  if (evDel) evDel.onclick = () => {
    state.events = state.events.filter(x => x.id !== existing.id);
    modal.remove();
    render();
  };
}

// === PD WORK MENU ===
function renderMenu() {
  const ch = getActiveChannel();
  if (!ch) { state.stage = 'dashboard'; render(); return; }
  const ep = getActiveEpisode();
  if (!ep) { state.stage = 'episodeList'; render(); return; }

  const answeredCount = ep.messages.filter(m => m.role === 'user' && !m.hidden).length;
  let interviewStatus, interviewDesc;
  if (!ep.interviewMode && answeredCount === 0) {
    interviewStatus = '시작하기 →';
    interviewDesc = 'AI 모드 또는 질문지 모드로 영상의 핵심 이야기를 끌어내요';
  } else if (ep.interviewMode === 'prepared') {
    const total = ep.preparedQuestions.length;
    if (total > 0 && ep.preparedIndex < total) {
      interviewStatus = `진행 중 ${ep.preparedIndex}/${total}`;
    } else {
      interviewStatus = `✓ ${answeredCount}문답`;
    }
    interviewDesc = `질문지 모드 · ${answeredCount}개 답변 완료`;
  } else if (ep.interviewMode === 'ai') {
    interviewStatus = `✓ ${answeredCount}문답`;
    interviewDesc = `AI 모드 · ${answeredCount}개 답변 완료`;
  } else {
    interviewStatus = '이어가기 →';
    interviewDesc = '인터뷰를 이어가거나 다시 시작할 수 있어요';
  }
  const interviewDone = answeredCount > 0;

  const keys = Object.keys(OUTPUTS);
  const cardsHtml = keys.map(k => {
    const o = OUTPUTS[k];
    const done = !!ep.outputs[k];
    return `
      <div class="output-card ${done ? 'done' : ''}" data-key="${k}">
        <div class="output-icon">${o.icon}</div>
        <div class="output-info">

      ep.updatedAt = Date.now();

    });

}

// === INTERVIEW ===
function formatInterviewText(ch, ep) {
  const epLbl = `EP.${String(ep.epNumber).padStart(2, '0')}`;
  const parts = [];
  parts.push(`[${ch.name}] ${epLbl}${ep.title ? ' · ' + ep.title : ''}`);
  parts.push(`주제: ${ep.topic || ch.topic || '미설정'}`);
  parts.push(`인터뷰 방식: ${ep.interviewMode === 'ai' ? 'AI 모드' : '질문지 모드'}`);
  parts.push(`내보낸 날짜: ${new Date().toLocaleString('ko-KR')}`);
  parts.push('');
  parts.push('='.repeat(34));
  parts.push('🎙 인터뷰 내용');
  parts.push('='.repeat(34));
  parts.push('');
  ep.messages.filter(m => !m.hidden).forEach(m => {
    const who = m.role === 'assistant' ? 'PD' : '나';
    parts.push(`[${who}] ${cleanForDisplay(m.content)}`);
    parts.push('');
  });
  return parts.join('\n');
}

// 인터뷰 복사·다운로드 버튼의 공통 핸들러 연결
function wireInterviewIO(ch, ep) {
  const copyBtn = document.getElementById('itvCopy');
  if (copyBtn) copyBtn.onclick = async () => {
    const text = formatInterviewText(ch, ep);
    const ok = await copyToClipboard(text);
    if (ok) {
      copyBtn.textContent = '✓ 복사 완료';
      setTimeout(() => { copyBtn.textContent = '📋 대화 복사'; }, 2000);
    } else {
      showToast('복사 실패 — 길게 눌러 직접 복사해주세요.');
    }
  };
  const dlBtn = document.getElementById('itvDownload');
  if (dlBtn) dlBtn.onclick = () => {
    const text = formatInterviewText(ch, ep);
    const epLbl = `EP.${String(ep.epNumber).padStart(2, '0')}`;
    const safeName = `${ch.name}_${epLbl}_인터뷰`.replace(/[\\/:*?"<>|]/g, '_');
    const fname = `${safeName}_${Date.now()}.txt`;
    const ok = downloadText(fname, text);
    if (ok) {
      dlBtn.textContent = '✓ 저장됨';
      setTimeout(() => { dlBtn.textContent = '📄 txt'; }, 2000);
    } else {
      showToast('다운로드 실패 — 복사 버튼을 이용해주세요.');
    }
  };
  const pdfBtn = document.getElementById('itvDownloadPdf');
  if (pdfBtn) pdfBtn.onclick = () => {
    const text = formatInterviewText(ch, ep);
    const epLbl = `EP.${String(ep.epNumber).padStart(2, '0')}`;
    printAsPDF({
      titleHead: `${epLbl} 인터뷰 대화`,
      channelName: ch.name,
      epLabel: epLbl,
      epTitle: ep.title,
      topic: ep.topic || ch.topic,
      outputLabel: '인터뷰 대화',
      body: text,
    });
  };
}

function renderInterview() {
  const ch = getActiveChannel();
  if (!ch) { state.stage = 'dashboard'; render(); return; }
  const ep = getActiveEpisode();
  if (!ep) { state.stage = 'episodeList'; render(); return; }
  const epLabel = `EP.${String(ep.epNumber).padStart(2, '0')}`;

  // MODE PICKER
  if (!ep.interviewMode) {
    app.innerHTML = `
      <div class="breadcrumb">${escText(ch.name)} · ${epLabel} · 인터뷰</div>
      <h2>🎙 인터뷰 방식 선택</h2>
      <div class="meta-line">${(state.profile && state.profile.nickname) ? escText(state.profile.nickname) + '님, ' : ''}PD가 어떻게 질문할까요? 인터뷰 내용은 대본·제목·쇼츠 등 다른 결과물의 핵심 재료가 돼요.</div>
      <div class="output-card" data-mode="ai">
        <div class="output-icon">🤖</div>
        <div class="output-info">
          <div class="output-label">AI 모드</div>
          <div class="output-desc">PD가 대화 흐름에 맞춰 질문을 직접 만들어요. 자연스럽지만 Claude.ai 사용량을 씁니다.</div>
        </div>
        <div class="output-status">선택 →</div>
      </div>
      <div class="output-card" data-mode="prepared">
        <div class="output-icon">📋</div>
        <div class="output-info">
          <div class="output-label">질문지 모드</div>
          <div class="output-desc">미리 준비한 질문 목록으로 진행해요. 사용량 0회, 빠르고 원하는 질문만.</div>
        </div>
        <div class="output-status">선택 →</div>
      </div>
      <div class="divider"></div>
      <button class="btn-secondary" id="backToMenu">← 메뉴로</button>
    `;
    document.querySelectorAll('[data-mode]').forEach(card => {
      card.onclick = async () => {
        const mode = card.dataset.mode;
        ep.interviewMode = mode;
        ep.updatedAt = Date.now();
        touchChannel(ch);
        state.error = '';
        if (mode === 'ai' && ep.messages.length === 0) {
          ep.messages.push({ role: 'user', content: '인터뷰를 시작해주세요. 첫 번째 질문을 해주세요.', hidden: true });
          render();
          await sendToAI(null);
          return;
        }
        render();
      };
    });
    document.getElementById('backToMenu').onclick = () => { state.stage = 'menu'; render(); };
    return;
  }

  // PREPARED MODE
  if (ep.interviewMode === 'prepared') {
    if (!ep.preparedQuestions || ep.preparedQuestions.length === 0) {
      app.innerHTML = `
        <div class="breadcrumb">${epLabel} · 인터뷰 · 질문지 모드</div>
        <h2>📋 질문지 준비</h2>
        <div class="meta-line">진행할 질문을 한 줄에 하나씩 입력하세요. 입력한 순서대로 진행돼요.</div>
        <textarea id="questionsInput" placeholder="예시:
이 주제에 관심 갖게 된 계기가 무엇인가요?
가장 강조하고 싶은 핵심 메시지는?
시청자가 흔히 오해하는 부분이 있다면?
이걸 실천하면 어떤 변화가 생기나요?
시청자가 꼭 기억했으면 하는 한 가지는?" style="min-height: 220px;"></textarea>
        <button class="btn-primary" id="confirmQuestions">질문지 확정 → 인터뷰 시작</button>
        <button class="btn-secondary" id="changeMode">← 방식 다시 선택</button>
      `;
      document.getElementById('confirmQuestions').onclick = () => {
        const raw = document.getElementById('questionsInput').value;
        const qs = raw.split('\n').map(q => q.trim()).filter(q => q.length > 0);
        if (qs.length === 0) { showToast('질문을 최소 1개 이상 입력해주세요.'); return; }
        ep.preparedQuestions = qs;
        ep.preparedIndex = 0;
        ep.messages = [];
        ep.updatedAt = Date.now();
        touchChannel(ch);
        render();
      };
      document.getElementById('changeMode').onclick = () => {
        ep.interviewMode = null;
        render();
      };
      return;
    }

    const total = ep.preparedQuestions.length;
    const idx = ep.preparedIndex;
    const done = idx >= total;

    if (done) {
      const answered = ep.messages.filter(m => m.role === 'user' && !m.hidden).length;
      app.innerHTML = `
        <div class="breadcrumb">${epLabel} · 인터뷰 · 질문지 모드</div>
        <h2>✅ 질문지 인터뷰 완료</h2>
        <div class="meta-line">${answered}개 질문에 답변했어요. 이제 메뉴에서 대본·제목·쇼츠 등을 만들 수 있어요.</div>
        <div class="chat-area" id="chat">
          ${ep.messages.map(m => {
            if (m.hidden) return '';
            const isPD = m.role === 'assistant';
            return `<div class="chat-msg ${isPD ? 'chat-pd' : 'chat-user'}">${escText(cleanForDisplay(m.content))}</div>`;
          }).join('')}
        </div>
        <div class="btn-row">
          <button class="btn-tiny" id="itvCopy">📋 대화 복사</button>
          <button class="btn-tiny" id="itvDownload">📄 txt</button>
          <button class="btn-tiny" id="itvDownloadPdf">📕 pdf</button>
        </div>
        <button class="btn-primary" id="goMenu">📁 메뉴로 (결과물 만들기)</button>
        <button class="btn-secondary" id="addMore">+ 질문 더 추가하기</button>
        <button class="btn-secondary" id="resetInterview">↺ 인터뷰 처음부터</button>
      `;
      wireInterviewIO(ch, ep);
      document.getElementById('goMenu').onclick = () => { state.stage = 'menu'; render(); };
      document.getElementById('addMore').onclick = () => {
        ep.preparedQuestions = [];
        render();
      };
      document.getElementById('resetInterview').onclick = () => {
        showConfirm('인터뷰를 처음부터 다시 할까요? 현재 답변이 모두 사라져요.', () => {
          ep.messages = [];
          ep.preparedQuestions = [];
          ep.preparedIndex = 0;
          ep.interviewMode = null;
          ep.updatedAt = Date.now();
          touchChannel(ch);
          render();
        });
      };
      return;
    }

    const currentQ = ep.preparedQuestions[idx];
    const isLast = idx === total - 1;
    app.innerHTML = `
      <div class="breadcrumb">${epLabel} · 인터뷰 · 질문지 모드</div>
      <h2>질문 ${idx + 1} / ${total}</h2>
      <div class="chat-area" id="chat">
        ${ep.messages.map(m => {
          if (m.hidden) return '';
          const isPD = m.role === 'assistant';
          return `<div class="chat-msg ${isPD ? 'chat-pd' : 'chat-user'}">${escText(cleanForDisplay(m.content))}</div>`;
        }).join('')}
        <div class="chat-msg chat-pd" style="border: 2px solid var(--terra);">${escText(currentQ)}</div>
      </div>
      <textarea id="answerInput" placeholder="답변을 입력하세요..." autofocus></textarea>
      <button class="btn-primary" id="nextQ">${isLast ? '답변 저장 후 완료 →' : '답변 저장 후 다음 질문 →'}</button>
      <button class="btn-secondary" id="backToMenu">← 메뉴로 (진행 상황 저장됨)</button>
    `;
    setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 100);
    document.getElementById('nextQ').onclick = () => {
      const ans = document.getElementById('answerInput').value.trim();
      if (!ans) { showToast('답변을 입력해주세요.'); return; }
      ep.messages.push({ role: 'assistant', content: currentQ });
      ep.messages.push({ role: 'user', content: ans });
      ep.preparedIndex++;
      ep.updatedAt = Date.now();
      touchChannel(ch);
      render();
    };
    document.getElementById('answerInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        document.getElementById('nextQ').click();
      }
    });
    document.getElementById('backToMenu').onclick = () => { state.stage = 'menu'; render(); };
    return;
  }

  // AI MODE
  const msgsHtml = ep.messages.map((m, i) => {
    if (m.hidden) return '';
    const isPD = m.role === 'assistant';
    const displayText = cleanForDisplay(m.content);
    return `<div class="chat-msg ${isPD ? 'chat-pd' : 'chat-user'}">${escText(displayText)}${isPD && voice.ttsSupported ? `<br><button class="replay-btn" data-idx="${i}">🔊 다시 듣기</button>` : ''}</div>`;
  }).join('');
  app.innerHTML = `
    <div class="breadcrumb">${epLabel} · 인터뷰 · AI 모드 · ${escText(ch.name)}</div>
    <div class="chat-area" id="chat">
      ${msgsHtml}
      ${state.loading ? '<div class="loading">PD가 생각 중</div>' : ''}
    </div>
    ${state.error ? `<div class="error">⚠ ${escText(state.error)}</div>` : ''}
    ${!state.loading ? `
      <textarea id="userInput" placeholder="답변을 자유롭게 입력하세요..." autofocus></textarea>
      <button class="btn-primary" id="send">답변 보내기 →</button>
      ${ep.messages.filter(m => !m.hidden).length > 0 ? `
        <div class="btn-row">
          <button class="btn-tiny" id="itvCopy">📋 대화 복사</button>
          <button class="btn-tiny" id="itvDownload">📄 txt</button>
          <button class="btn-tiny" id="itvDownloadPdf">📕 pdf</button>
        </div>
      ` : ''}
      <div class="btn-row">
        <button class="btn-secondary" id="backToMenu">📁 메뉴로 (저장됨)</button>
        <button class="btn-secondary" id="resetInterview">↺ 처음부터</button>
      </div>
    ` : ''}
  `;
  setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 100);
  document.querySelectorAll('.replay-btn').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.idx);
      if (ep.messages[idx]) speakText(ep.messages[idx].content);
    };
  });
  if (!state.loading) {
    wireInterviewIO(ch, ep);
    document.getElementById('send').onclick = async () => {
      const inp = document.getElementById('userInput').value.trim();
      if (!inp) return;
      stopSpeaking();
      await sendToAI(inp);
    };
    document.getElementById('userInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        document.getElementById('send').click();
      }
    });
    document.getElementById('backToMenu').onclick = () => {
      stopSpeaking();
      state.stage = 'menu';
      render();
    };
    document.getElementById('resetInterview').onclick = () => {
      showConfirm('인터뷰를 처음부터 다시 할까요? 현재 대화가 모두 사라져요.', () => {
        stopSpeaking();
        ep.messages = [];
        ep.interviewMode = null;
        ep.updatedAt = Date.now();
        touchChannel(ch);
        render();
      });
    };
  }
}

// 완성 코드 — 앱에서 첫 결과물을 뽑은 사람에게만 보이는 고정 코드.
// 이 코드를 채널 댓글에 남기면 "실제로 앱을 끝까지 써본 사람"임을 알 수 있음.
const COMPLETION_CODE = '파고드림_첫결과물_완성';

// 채널 댓글에 복사될 인사말 텍스트를 만든다.
// 닉네임이 있으면 부르고, 없으면 부르는 줄을 자연스럽게 뺀다.
// 채널명은 사용자 프라이버시를 위해 일부러 포함하지 않는다.
function buildGreetingMessage(outputLabel) {
  const nick = (state.profile && state.profile.nickname || '').trim();
  const greetLine = nick ? `${nick}님,` : '안녕하세요,';
  const lines = [
    `🎙 파고드림 PD 스튜디오로 ${outputLabel} 완성!`,
    `[${COMPLETION_CODE}]`,
    ``,
    `${greetLine} 좋은 도구 만들어주셔서 감사해요 🙏`,
    `덕분에 막힘없이 ${outputLabel}을(를) 만들 수 있었어요.`,
  ];
  return lines.join('\n');
}

// 완성 코드 안내 카드 HTML — 긴 인사말 본문은 화면에 노출 안 함, 버튼만.

// 완성 코드 카드의 버튼 핸들러 연결

  const copyBtn = document.getElementById('copyGreeting');

// === THUMBNAIL ===
async function maybeRestoreDesign(tool) {
  // Restore saved settings once per tool-open (if not already restored)
  if (design._restored && design._restored[tool]) return;
  if (!design._restored) design._restored = {};
  const saved = await loadDesignWork(tool);
  if (saved && saved.data) {
    applySerializedDesign(tool, saved.data);
    // reset history so restored state becomes the baseline
    designHistory[tool] = { stack: [], pointer: -1 };
    designDirty[tool] = false;
    design._restored[tool] = true;
    return saved;
  }
  design._restored[tool] = true;
  return null;
}

async function drawThumbnail() {
  await ensureFontsLoaded();
  const t = design.thumb;
  const canvas = document.getElementById('thumbCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(0, 0, w, h);
  if (t.bg) {
    ctx.save();
    const filters = [`brightness(${t.bgBright}%)`, `contrast(${t.bgContrast}%)`];
    if ((t.bgBlur ?? 0) > 0) filters.push(`blur(${t.bgBlur}px)`);
    ctx.filter = filters.join(' ');
    const imgRatio = t.bg.width / t.bg.height;
    const cRatio = w / h;
    let dw, dh;
    if (imgRatio > cRatio) {
      dh = h; dw = t.bg.width * (dh / t.bg.height);
    } else {
      dw = w; dh = t.bg.height * (dw / t.bg.width);
    }
    const scale = t.bgScale ?? 1;
    dw *= scale; dh *= scale;
    const offX = w * ((t.bgX ?? 0) / 100);
    const offY = h * ((t.bgY ?? 0) / 100);
    const x = (w - dw) / 2 + offX;
    const y = (h - dh) / 2 + offY;
    const rot = (t.bgRotate ?? 0) * Math.PI / 180;
    const flip = !!t.bgFlip;
    if (rot !== 0 || flip) {
      const cxp = x + dw / 2, cyp = y + dh / 2;
      ctx.translate(cxp, cyp);
      if (rot !== 0) ctx.rotate(rot);
      if (flip) ctx.scale(-1, 1);
      ctx.translate(-cxp, -cyp);
    }
    ctx.drawImage(t.bg, x, y, dw, dh);
    ctx.restore();
  }
  const spread = t.gradSpread / 100;
  if (t.grads.bottom) {
    const g = ctx.createLinearGradient(0, h * (1 - spread), 0, h);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.98)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  }
  if (t.grads.top) {
    const g = ctx.createLinearGradient(0, 0, 0, h * spread);
    g.addColorStop(0, 'rgba(0,0,0,0.98)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  }
  if (t.grads.left) {
    const g = ctx.createLinearGradient(0, 0, w * spread, 0);
    g.addColorStop(0, 'rgba(0,0,0,0.98)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  }
  if (t.grads.right) {
    const g = ctx.createLinearGradient(w * (1 - spread), 0, w, 0);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.98)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  }
  t.overlays.filter(o => o.layer === 'bottom').forEach(ov => drawOverlay(ctx, ov, w, h));
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const line of t.textLines) {
    if (!line.text.trim()) continue;
    ctx.save();
    const xp = w * (line.x / 100);
    const yp = h * (line.y / 100);
    const weight = line.bold ? '900' : line.weight;
    const style = line.italic ? 'italic ' : '';
    ctx.font = `${style}${weight} ${line.size}px ${line.font}`;
    try { ctx.letterSpacing = ((line.letterSpacing ?? 0)) + 'px'; } catch (e) {}

    const rot = (line.rotate ?? 0) * Math.PI / 180;
    if (rot !== 0) {
      ctx.translate(xp, yp);
      ctx.rotate(rot);
      ctx.translate(-xp, -yp);
    }

    const lines = line.text.split('\n');
    const lineHeight = line.size + (line.lineGap ?? 10);
    const startY = yp - (lines.length - 1) * lineHeight / 2;
    const outlineW = line.outlineWidth ?? 0;

    lines.forEach((ln, i) => {
      const ly = startY + i * lineHeight;

      // highlight box behind text (per line)
      const boxOp = line.boxOpacity ?? 0;
      if (boxOp > 0) {
        const m = ctx.measureText(ln);
        const tw = m.width;
        const th = line.size * 1.1;
        const pad = line.size * 0.22;
        ctx.save();
        ctx.shadowColor = 'transparent';
        ctx.globalAlpha = boxOp / 100;
        ctx.fillStyle = line.boxColor || '#000000';
        const r = Math.min(pad, 12);
        const bx = xp - tw/2 - pad, by = ly - th/2, bw = tw + pad*2, bh = th;
        if (ctx.roundRect) {
          ctx.beginPath();
          ctx.roundRect(bx, by, bw, bh, r);
          ctx.fill();
        } else {
          ctx.fillRect(bx, by, bw, bh);
        }
        ctx.restore();
      }

      // outline: only drawn when width > 0 (0 = no outline)
      if (outlineW > 0) {
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
        ctx.lineWidth = outlineW;
        ctx.strokeStyle = line.outlineColor || '#000000';
        ctx.lineJoin = 'round';
        ctx.strokeText(ln, xp, ly);
      }

      // fill (with optional shadow)
      if (line.shadow !== false) {
        ctx.shadowColor = 'rgba(0,0,0,0.9)';
        ctx.shadowBlur = line.size * 0.15;
        ctx.shadowOffsetX = line.size * 0.05;
        ctx.shadowOffsetY = line.size * 0.05;
      } else {
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
      }
      ctx.fillStyle = line.color;
      ctx.fillText(ln, xp, ly);
    });

    try { ctx.letterSpacing = '0px'; } catch (e) {}
    ctx.restore();
  }
  t.overlays.filter(o => o.layer === 'top').forEach(ov => drawOverlay(ctx, ov, w, h));

  if (t.showGuides) {
    ctx.save();
    ctx.strokeStyle = 'rgba(184, 92, 56, 0.6)';
    ctx.lineWidth = Math.max(2, w / 600);
    ctx.setLineDash([w/100, w/100]);
    ctx.beginPath(); ctx.moveTo(w/2, 0); ctx.lineTo(w/2, h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, h/2); ctx.lineTo(w, h/2); ctx.stroke();
    ctx.strokeStyle = 'rgba(184, 92, 56, 0.3)';
    ctx.lineWidth = Math.max(1, w / 1000);
    for (let i = 1; i < 3; i++) {
      ctx.beginPath(); ctx.moveTo(w * i/3, 0); ctx.lineTo(w * i/3, h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, h * i/3); ctx.lineTo(w, h * i/3); ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.restore();
  }
}

function drawOverlay(ctx, ov, w, h) {
  ctx.save();
  ctx.globalAlpha = ov.opacity / 100;
  const tw = w * (ov.size / 100);
  const th = ov.img.height * (tw / ov.img.width);
  const x = w * (ov.x / 100) - tw / 2;
  const y = h * (ov.y / 100) - th / 2;
  const rot = (ov.rotate ?? 0) * Math.PI / 180;
  const flip = !!ov.flip;
  if (rot !== 0 || flip) {
    const cxp = x + tw / 2, cyp = y + th / 2;
    ctx.translate(cxp, cyp);
    if (rot !== 0) ctx.rotate(rot);
    if (flip) ctx.scale(-1, 1);
    ctx.translate(-cxp, -cyp);
  }
  ctx.shadowColor = 'rgba(0,0,0,0.4)';
  ctx.shadowBlur = 15;
  ctx.drawImage(ov.img, x, y, tw, th);
  ctx.restore();
}

// Generic overlay HTML builder. dataAttr = 'ov-id' (thumbnail) | 'ban-ov-id' | 'wm-ov-id'
function overlayCardsHtml(overlays, dataAttr, posMin, posMax) {

        <option value="top"${ov.layer === 'top' ? ' selected' : ''}>글씨 앞 (로고/워터마크)</option>

      <div class="range-label"><span>↔️ 좌우</span><span class="range-val">${ov.x}%</span></div>
      <input type="range" min="${posMin}" max="${posMax}" value="${ov.x}" data-${dataAttr}="${ov.id}" data-prop="x">
      <div class="range-label"><span>↕️ 상하</span><span class="range-val">${ov.y}%</span></div>

    </div>
  `).join('');
}

// Generic overlay event wiring. getOverlays returns the live array; redraw redraws the canvas.
function wireOverlayHandlers(dataAttr, getOverlays, redraw) {
  document.querySelectorAll('[data-' + dataAttr + ']').forEach(el => {
    const id = parseInt(el.dataset[dataAttr.replace(/-([a-z])/g, (m, c) => c.toUpperCase())]);
    const prop = el.dataset.prop;
    const action = el.dataset.action;
    if (action === 'del-ov') {
      el.onclick = () => {
        const arr = getOverlays();
        const idx = arr.findIndex(o => o.id === id);
        if (idx >= 0) arr.splice(idx, 1);
        recordState();
        render();
      };
    } else if (action === 'remove-bg') {
      el.onclick = async () => {
        const ov = getOverlays().find(o => o.id === id);
        if (!ov) return;
        el.textContent = '⏳ 처리 중...';
        ov.img = await removeBackgroundSimple(ov.img);
        redraw();
        recordState();
        el.textContent = '✓ 완료';
        setTimeout(() => { el.textContent = '🪄 배경 자동 제거'; }, 1500);
      };
    } else if (prop) {
      const valEl = el.previousElementSibling ? el.previousElementSibling.querySelector('.range-val') : null;
      const updateHandler = (e) => {
        const ov = getOverlays().find(o => o.id === id);
        if (!ov) return;
        if (prop === 'layer') {
          ov[prop] = e.target.value;
        } else if (prop === 'flip') {
          ov[prop] = e.target.checked;
        } else {
          ov[prop] = parseInt(e.target.value);
          if (valEl) {
            let suffix = '%';
            if (prop === 'rotate') suffix = '°';
            valEl.textContent = ov[prop] + suffix;
          }
        }
        markDirty();
        redraw();
      };
      el.oninput = updateHandler;
      el.onchange = (e) => { updateHandler(e); recordState(); };
    }
  });
}

async function drawBanner() {
  await ensureFontsLoaded();
  const b = design.banner;
  const canvas = document.getElementById('bannerCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const cx = 1280, cy = 720;
  ctx.clearRect(0, 0, 2560, 1440);
  if (b.bg) {
    const iw = b.bg.width * b.scale;
    const ih = b.bg.height * b.scale;
    ctx.drawImage(b.bg, cx - iw/2 + b.x, cy - ih/2 + b.y, iw, ih);
    ctx.fillStyle = `rgba(11, 19, 43, ${b.darkness})`;
    ctx.fillRect(0, 0, 2560, 1440);
  } else {
    const g = ctx.createLinearGradient(0, 0, 0, 1440);
    g.addColorStop(0, '#0B132B'); g.addColorStop(1, '#1C2541');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 2560, 1440);
  }
  // overlays behind text
  (b.overlays || []).filter(o => o.layer === 'bottom').forEach(ov => drawOverlay(ctx, ov, 2560, 1440));
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const yOff = b.yOffset || 0;
  for (const tx of b.texts) {
    if (!tx.text.trim()) continue;
    ctx.save();
    const weight = tx.bold ? '900' : tx.weight;
    const style = tx.italic ? 'italic ' : '';
    ctx.font = `${style}${weight} ${tx.size}px ${tx.font}`;
    try { ctx.letterSpacing = (tx.letterSpacing ?? 0) + 'px'; } catch (e) {}

    const px = cx + (tx.x ?? 0);
    const py = cy + tx.y + yOff;
    const rot = (tx.rotate ?? 0) * Math.PI / 180;
    if (rot !== 0) {
      ctx.translate(px, py);
      ctx.rotate(rot);
      ctx.translate(-px, -py);
    }

    const lines = tx.text.split('\n');
    const lineHeight = tx.size + (tx.lineGap ?? 10);
    const startY = py - (lines.length - 1) * lineHeight / 2;
    const outlineW = tx.outlineWidth ?? 0;

    lines.forEach((ln, i) => {
      const ly = startY + i * lineHeight;
      // outline
      if (outlineW > 0) {
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
        ctx.lineWidth = outlineW;
        ctx.strokeStyle = tx.outlineColor || '#000000';
        ctx.lineJoin = 'round';
        ctx.strokeText(ln, px, ly);
      }
      // fill + shadow
      if (tx.shadow !== false) {
        ctx.shadowColor = 'rgba(0,0,0,0.7)';
        ctx.shadowBlur = 8;
        ctx.shadowOffsetX = 3;
        ctx.shadowOffsetY = 3;
      } else {
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
      }
      ctx.fillStyle = tx.color;
      ctx.fillText(ln, px, ly);
    });

    try { ctx.letterSpacing = '0px'; } catch (e) {}
    ctx.restore();
  }
  ctx.shadowColor = 'transparent';
  // overlays in front of text
  (b.overlays || []).filter(o => o.layer === 'top').forEach(ov => drawOverlay(ctx, ov, 2560, 1440));
  if (b.showSafeZone) {
    const sw = 1546, sh = 423;
    const sx = cx - sw/2, sy = cy - sh/2;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, 0, 2560, sy);
    ctx.fillRect(0, sy + sh, 2560, 1440 - sy - sh);
    ctx.fillRect(0, sy, sx, sh);
    ctx.fillRect(sx + sw, sy, 2560 - sx - sw, sh);
    ctx.strokeStyle = '#FF4444';
    ctx.lineWidth = 4;
    ctx.setLineDash([15, 15]);
    ctx.strokeRect(sx, sy, sw, sh);
    ctx.setLineDash([]);
    ctx.fillStyle = '#FF4444';
    ctx.font = '700 28px "Noto Sans KR"';
    ctx.fillText('▲ 이 영역 안에 모든 글씨가 들어와야 모바일에서 안 잘림 ▲', cx, sy + sh/2 + 40);
  }
}
