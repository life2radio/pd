<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>나도 PD 있다 · PD 스튜디오</title>
  <meta name="description" content="1인 유튜버에게 팀을 주다 — 내가 출연자, AI가 PD인 작은 방송국">
  <meta name="theme-color" content="#B85C38">

  <!-- OG 태그 (소셜 공유 미리보기) -->
  <meta property="og:title" content="나도 PD 있다 · PD 스튜디오">
  <meta property="og:description" content="1인 유튜버에게 팀을 주다 — 내가 출연자, AI가 PD인 작은 방송국">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- TARGET_URL: 새 publish 받으면 이 한 줄만 바꾸면 됨 -->
  <script>
    const TARGET_URL = "https://claude.ai/public/artifacts/f00947cd-bc4e-4682-bf02-f9ae6548d66c";
    window.location.replace(TARGET_URL);
  </script>
  <!-- JS 비활성 시 백업 -->
  <meta http-equiv="refresh" content="0; url=https://claude.ai/public/artifacts/f00947cd-bc4e-4682-bf02-f9ae6548d66c">

  <style>
    body {
      margin: 0;
      padding: 2rem;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      text-align: center;
      background: #FAF5EA;
      color: #5C4A3A;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    h1 {
      font-size: 1.15rem;
      color: #B85C38;
      margin: 0 0 1rem;
      font-weight: 800;
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 1rem 0;
      border: 3px solid rgba(184, 92, 56, 0.18);
      border-top-color: #B85C38;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      font-size: 0.9rem;
      margin: 0.5rem 0;
    }
    .fallback {
      font-size: 0.8rem;
      color: #8A7058;
      margin-top: 1.5rem;
    }
    .fallback a {
      color: #B85C38;
      font-weight: 700;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>🎙 나도 PD 있다</h1>
  <div class="spinner"></div>
  <p class="loading-text">PD 스튜디오 여는 중...</p>
  <p class="fallback">자동으로 이동하지 않으면 <a href="https://claude.ai/public/artifacts/f00947cd-bc4e-4682-bf02-f9ae6548d66c">여기를 눌러주세요</a></p>

  <script>
    // PWA Service Worker 등록 (브라우저가 이 페이지를 PWA로 인식 → beforeinstallprompt 발동)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
