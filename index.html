<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>나도 PD 있다 · PD 스튜디오</title>
  <meta name="description" content="1인 유튜버에게 팀을 주다 — 내가 출연자, AI가 PD인 작은 방송국">
  <meta name="theme-color" content="#B85C38">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #FAF5EA;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    }
    #app-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      display: block;
    }
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #5C4A3A;
      font-size: 0.95rem;
      z-index: 1;
    }
    #loading .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 1rem;
      border: 3px solid rgba(184, 92, 56, 0.18);
      border-top-color: #B85C38;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>PD 스튜디오 여는 중...</div>
  </div>
  <iframe
    id="app-frame"
    src="https://claude.ai/public/artifacts/f00947cd-bc4e-4682-bf02-f9ae6548d66c"
    allow="clipboard-read; clipboard-write; microphone; autoplay"
    allowfullscreen
    title="PD 스튜디오"
  ></iframe>
  <script>
    // PWA Service Worker 등록 — 설치 가능한 PWA로 인식
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
    // iframe 로드 완료 시 로딩 메시지 제거
    document.getElementById('app-frame').addEventListener('load', () => {
      const loading = document.getElementById('loading');
      if (loading) loading.style.display = 'none';
    });
  </script>
</body>
</html>
