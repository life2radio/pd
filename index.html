<!DOCTYPE html>
<!--
  PD 스튜디오 — GitHub Pages PWA 게이트 페이지
  
  앱 본체는 Claude artifact에 있고, 이 페이지는 *PWA 설치 가능한 게이트*.
  - 처음 접속한 사용자: 자동으로 "홈 화면에 설치하기" 버튼 노출 → 한 번 탭으로 네이티브 설치
  - 이미 설치한 사용자(standalone 모드 또는 ?go=1): 즉시 앱으로 리다이렉트
  - 카톡 등 인앱 브라우저: 즉시 앱으로 (PWA 설치 불가 환경)
  
  ↓↓↓ 앱 업데이트로 URL 바뀌면 TARGET_URL 한 줄만 수정 ↓↓↓
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>나도 PD 있다 · PD 스튜디오</title>
  <meta name="description" content="1인 콘텐츠 창작자를 위한 무료 AI 도구. 파고드림 제작.">

  <!-- PWA 매니페스트 & 메타 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#B85C38">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PD 스튜디오">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

  <!-- OG / 공유용 -->
  <meta property="og:title" content="나도 PD 있다 · PD 스튜디오">
  <meta property="og:description" content="PD가 당신을 인터뷰하고, 영상 한 편 분량의 모든 결과물을 만들어드려요.">
  <meta property="og:image" content="icon-512.png">
  <meta property="og:type" content="website">

  <!-- ↓↓↓ 앱 업데이트로 URL 바뀌면 이 한 줄만 수정 ↓↓↓ -->
  <script>const TARGET_URL = 'https://claude.ai/public/artifacts/8b9630e1-64d4-493d-aece-ebac00f2053b';</script>
  <!-- ↑↑↑ 앱 업데이트로 URL 바뀌면 이 한 줄만 수정 ↑↑↑ -->

  <script>
    // ① Service Worker 등록 — PWA 설치 가능 조건 충족 (Chrome 등에서 beforeinstallprompt 이벤트 발생 조건)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {/* SW 등록 실패해도 게이트는 작동 */});
      });
    }

    // ② 즉시 리다이렉트 조건:
    //  - 이미 설치된 PWA (standalone 모드) — 홈 아이콘으로 진입
    //  - 카톡·인스타·페북·라인·네이버·다음 등 인앱 브라우저 (PWA 설치 불가)
    //  - ?go=1 파라미터 또는 세션 플래그 (사용자가 "앱 바로 시작" 누른 경우)
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
    const isInAppBrowser = /KAKAOTALK|Instagram|FBAN|FBAV|FB_IAB|Line\/|NAVER|Daum/i.test(navigator.userAgent || '');
    const params = new URLSearchParams(window.location.search);
    const skipGate = params.has('go') || sessionStorage.getItem('pd-skip-prompt');

    if (isStandalone || isInAppBrowser || skipGate) {
      window.location.replace(TARGET_URL);
    }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #FAF5EA 0%, #F0E4CC 100%);
      color: #2A1810;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      line-height: 1.6;
    }
    .box {
      max-width: 420px;
      width: 100%;
      background: white;
      border-radius: 1.2rem;
      box-shadow: 0 8px 24px rgba(184, 92, 56, 0.12), 0 2px 6px rgba(0,0,0,0.04);
      padding: 1.8rem 1.5rem 1.5rem;
      text-align: center;
    }
    .icon {
      width: 88px; height: 88px;
      margin: 0 auto 0.8rem;
      border-radius: 1.2rem;
      box-shadow: 0 4px 12px rgba(184, 92, 56, 0.25);
    }
    h1 {
      font-size: 1.3rem;
      color: #B85C38;
      margin: 0 0 0.35rem;
      font-weight: 800;
    }
    .tagline {
      font-size: 0.86rem;
      color: #5C4A3A;
      margin: 0 0 1.4rem;
    }
    .install-pitch {
      background: linear-gradient(135deg, rgba(255,107,53,0.08) 0%, rgba(245,181,0,0.08) 100%);
      border: 1.5px solid rgba(255,107,53,0.25);
      border-radius: 0.8rem;
      padding: 0.85rem 0.95rem;
      margin-bottom: 1rem;
      font-size: 0.82rem;
      color: #7a4218;
      line-height: 1.65;
      text-align: left;
    }
    .install-pitch strong { font-weight: 800; color: #c1521e; }
    .btn {
      display: block;
      width: 100%;
      padding: 0.95rem 1rem;
      border-radius: 0.65rem;
      font-size: 1rem;
      font-weight: 800;
      font-family: inherit;
      border: 0;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.15s, background 0.15s;
    }
    .btn:active { transform: translateY(1px); }
    .btn-install {
      background: linear-gradient(135deg, #FF6B35 0%, #C1521E 100%);
      color: white;
      box-shadow: 0 4px 14px rgba(193, 82, 30, 0.3);
      margin-bottom: 0.5rem;
    }
    .btn-install:hover { background: linear-gradient(135deg, #FF7B45 0%, #D1623E 100%); }
    .btn-install.hidden { display: none; }
    .btn-go {
      background: rgba(184, 92, 56, 0.1);
      color: #B85C38;
      border: 1px solid rgba(184, 92, 56, 0.3);
      font-weight: 700;
    }
    .btn-go:hover { background: rgba(184, 92, 56, 0.15); }
    .manual-hint {
      margin-top: 1rem;
      padding: 0.8rem 0.9rem;
      background: rgba(245, 181, 0, 0.06);
      border: 1px solid rgba(245, 181, 0, 0.22);
      border-radius: 0.55rem;
      font-size: 0.76rem;
      color: #6c5018;
      line-height: 1.65;
      text-align: left;
    }
    .manual-hint .title {
      font-weight: 700;
      color: #7a5818;
      margin-bottom: 0.4rem;
      font-size: 0.8rem;
    }
    .manual-hint .row { margin-bottom: 0.25rem; }
    .manual-hint .row:last-child { margin-bottom: 0; }
    .manual-hint strong { font-weight: 700; }
    details summary {
      cursor: pointer;
      list-style: none;
      font-size: 0.78rem;
      color: #8a7560;
      padding: 0.3rem 0;
      margin-top: 0.6rem;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    details summary::-webkit-details-marker { display: none; }
    .credit {
      margin-top: 1.2rem;
      font-size: 0.75rem;
      color: #8a7560;
    }
    .credit a {
      color: #B85C38;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="icon-192.png" class="icon" alt="PD 스튜디오 아이콘">
    <h1>🎙 나도 PD 있다</h1>
    <p class="tagline">1인 콘텐츠 창작자를 위한 무료 AI 도구</p>

    <!-- 설치 권유 박스 — 첫 진입 사용자에게 가장 강조 -->
    <div class="install-pitch">
      <strong>📱 홈 화면에 한 번 설치해두세요!</strong><br>
      매번 검색·즐겨찾기 안 해도 폰 홈 아이콘 한 번 탭으로 앱처럼 실행돼요.
    </div>

    <!-- 1순위 — 자동 설치 버튼 (브라우저가 PWA 인식하면 활성화) -->
    <button class="btn btn-install hidden" id="installBtn">📱 홈 화면에 바로 설치</button>

    <!-- 2순위 — 설치 안 하고 그냥 앱으로 -->
    <button class="btn btn-go" id="goAppBtn">▶ 일단 앱으로 시작</button>

    <!-- 자동 설치 안 되는 환경 — iOS Safari 등 -->
    <details>
      <summary>설치 버튼이 안 보이면 (iOS Safari 등)</summary>
      <div class="manual-hint">
        <div class="title">📱 수동으로 홈 화면에 추가하기</div>
        <div class="row">🍎 <strong>iOS Safari</strong>: 하단 공유 ⬆ → "홈 화면에 추가"</div>
        <div class="row">📱 <strong>안드로이드 크롬</strong>: ⋮ → "홈 화면에 추가"</div>
        <div class="row">💻 <strong>PC 크롬</strong>: 주소창 오른쪽 ⊕ → "설치"</div>
      </div>
    </details>

    <div class="credit">
      🎙 <a href="https://www.youtube.com/@pagodream" target="_blank" rel="noopener">파고드림 채널</a> 제작
    </div>
  </div>

  <script>
    // === "앱 바로 시작" 버튼 ===
    document.getElementById('goAppBtn').onclick = () => {
      sessionStorage.setItem('pd-skip-prompt', '1');
      window.location.replace(TARGET_URL);
    };

    // === PWA 자동 설치 (beforeinstallprompt) ===
    // Chrome/Edge/안드로이드 크롬 등이 PWA 인식하면 이 이벤트 발생.
    // 우리가 그 prompt를 잡아서 우리 버튼에 연결 → 한 번 탭으로 설치.
    let deferredPrompt = null;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.classList.remove('hidden');
    });

    installBtn.onclick = async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();  // 네이티브 설치 다이얼로그 등장
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        // 설치됨 — 사용자가 홈 아이콘으로 다시 열도록 짧은 안내
        installBtn.textContent = '✓ 설치 완료! 잠시 후 앱으로 이동';
        installBtn.style.background = '#3E7B6F';
        sessionStorage.setItem('pd-skip-prompt', '1');
        setTimeout(() => window.location.replace(TARGET_URL), 1200);
      }
      deferredPrompt = null;
    };

    // 설치 완료 이벤트 (브라우저에서 직접 ⋮ → 홈 화면 추가한 경우도 포함)
    window.addEventListener('appinstalled', () => {
      sessionStorage.setItem('pd-skip-prompt', '1');
      installBtn.textContent = '✓ 설치 완료!';
      installBtn.style.background = '#3E7B6F';
    });
  </script>
</body>
</html>
